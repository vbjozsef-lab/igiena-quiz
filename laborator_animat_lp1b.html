<style>
:root{
  --bg:#07111f;--panel:#0d1b2d;--panel2:#10243a;--line:#24425f;--text:#f7fbff;--muted:#aec1d4;
  --cyan:#27d3e2;--blue:#7296ff;--violet:#b48cff;--amber:#ffbc4a;--red:#ff6478;--green:#47d88a;
  --slide-h:calc(100vh - 154px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{overflow:hidden}
button{font:inherit}
.topbar{height:86px;padding:0 34px;display:flex;align-items:center;gap:24px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(7,17,31,.96)}
.brand{display:flex;align-items:center;gap:14px;min-width:300px}.brandmark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2b6de8,#28c8d5);font-size:25px;box-shadow:0 8px 28px rgba(39,211,226,.18)}
.brand h1{font-size:21px;line-height:1.1;margin:0;font-weight:900;letter-spacing:-.02em}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;font-weight:600}
.topicnav{flex:1;display:flex;justify-content:center;gap:8px;overflow:auto;scrollbar-width:none}.topicnav::-webkit-scrollbar{display:none}.topicnav button{border:1px solid rgba(255,255,255,.1);color:#aebfd0;background:#0b1727;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.topicnav button.active{color:white;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,#0b1727);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.tools{display:flex;gap:8px}.tools button{width:42px;height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#0b1727;color:white;font-size:17px;cursor:pointer}
.progressWrap{height:6px;background:#0b1727}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .35s ease}
.stage{height:var(--slide-h);position:relative;padding:24px 34px 18px;background:radial-gradient(circle at 15% 20%,rgba(39,211,226,.08),transparent 26%),radial-gradient(circle at 88% 70%,rgba(114,150,255,.08),transparent 28%),var(--bg)}
.slide{height:100%;max-width:1600px;margin:auto;border:1px solid rgba(255,255,255,.09);border-radius:24px;background:linear-gradient(145deg,rgba(16,36,58,.96),rgba(10,25,43,.98));box-shadow:0 25px 80px rgba(0,0,0,.28);overflow:hidden;display:grid;grid-template-columns:minmax(380px,42%) 1fr;position:relative}
.slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.visual{position:relative;padding:30px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
.content{padding:34px 42px 30px;display:flex;flex-direction:column;min-width:0}
.kicker{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px}.kicker .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.title{font-size:clamp(36px,3.25vw,62px);line-height:1.05;letter-spacing:-.04em;margin:0 0 20px;font-weight:900;max-width:1000px}
.body{font-size:clamp(23px,1.72vw,33px);line-height:1.42;color:#edf5fb;font-weight:500;margin:0}.body strong{color:white;font-weight:900}.body em{color:var(--accent);font-style:normal;font-weight:800}
.note{margin-top:auto;padding:16px 18px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.085);font-size:clamp(17px,1.15vw,22px);line-height:1.45;color:#c4d6e4}.note b{color:var(--accent)}
.result{margin-top:14px;padding:14px 17px;border-radius:14px;font-size:clamp(18px,1.25vw,23px);font-weight:850;line-height:1.35}.result.good{background:rgba(71,216,138,.12);border:1px solid rgba(71,216,138,.35);color:#7ce9ad}.result.warning{background:rgba(255,188,74,.12);border:1px solid rgba(255,188,74,.35);color:#ffd078}.result.positive{background:rgba(255,100,120,.12);border:1px solid rgba(255,100,120,.35);color:#ff9cab}
.source{margin-top:10px;color:#718ba2;font-size:12px;font-weight:600}
.footer{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#081523;border-top:1px solid rgba(255,255,255,.08)}.footer .counter{font-size:13px;color:#9db1c4;font-weight:800}.navbuttons{display:flex;gap:10px}.navbuttons button{border-radius:12px;padding:10px 18px;border:1px solid rgba(255,255,255,.1);font-weight:850;cursor:pointer}.prev{background:#0d1b2d;color:#d5e2ed}.next{background:var(--accent);color:#07111f;border-color:transparent!important}.navbuttons button:disabled{opacity:.3;cursor:default}
.medical-card{width:100%;height:100%;max-height:610px;border-radius:22px;background:#f8fbff;padding:18px;display:flex;flex-direction:column;box-shadow:0 18px 55px rgba(0,0,0,.26);position:relative;overflow:hidden}.medical-card img{width:100%;height:calc(100% - 70px);object-fit:contain;display:block}.medical-caption{margin-top:auto;color:#17314a;font-size:14px;font-weight:900;display:flex;justify-content:space-between;gap:10px;align-items:center}.medical-caption span:last-child{font-size:11px;color:#617b91;font-weight:600;text-align:right}.zonebadge{position:absolute;top:18px;left:18px;padding:8px 11px;border-radius:10px;background:#09223f;color:white;font-size:12px;font-weight:900;border:1px solid rgba(255,255,255,.18)}
.size-ladder{position:absolute;right:20px;top:66px;display:flex;flex-direction:column;gap:8px}.size-ladder div{padding:7px 10px;border-radius:9px;background:rgba(7,17,31,.86);color:white;font-size:11px;font-weight:800;box-shadow:0 5px 16px rgba(0,0,0,.2)}
.scope{width:min(450px,90%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#e9f4ff 0 64%,#182a3d 65% 72%,#07111f 73%);position:relative;box-shadow:0 0 0 3px #6387aa,0 22px 60px rgba(0,0,0,.32)}.scope:before,.scope:after{content:"";position:absolute;inset:12%;border-radius:50%;background-image:linear-gradient(rgba(40,94,130,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(40,94,130,.15) 1px,transparent 1px);background-size:34px 34px}.particle{position:absolute;border-radius:50%;z-index:2}.particle.big{width:18px;height:18px;background:#ef5b6b}.particle.small{width:9px;height:9px;background:#7a4ed8}.scale5{position:absolute;bottom:20%;left:29%;z-index:3;color:#17314a;font-weight:900;font-size:15px;border-top:4px solid #17314a;padding-top:4px;width:90px;text-align:center}
.device{width:min(430px,88%);border-radius:28px;background:linear-gradient(145deg,#24374a,#101b28);border:2px solid #41627e;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}.deviceScreen{background:#061018;border-radius:16px;border:1px solid #38536b;padding:24px 20px;text-align:center}.deviceLabel{font-size:14px;color:#9db5c7;font-weight:800;letter-spacing:.08em}.deviceValue{font-size:76px;line-height:1;font-weight:900;margin:8px 0;color:var(--accent)}.deviceUnit{font-size:19px;color:#c6d8e7;font-weight:700}.deviceStatus{margin-top:14px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:900;font-size:17px}.deviceDots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.deviceDots div{height:44px;border-radius:10px;background:#0b1723;border:1px solid #29445b;display:grid;place-items:center;color:#8da4b8;font-size:11px;font-weight:900}.deviceDots div.on{background:color-mix(in srgb,var(--accent) 22%,#0b1723);color:white;border-color:var(--accent)}
.aqi{width:min(510px,94%)}.aqiGauge{height:260px;position:relative;overflow:hidden}.arc{position:absolute;width:420px;height:420px;border-radius:50%;left:50%;transform:translateX(-50%);top:35px;background:conic-gradient(from 270deg,#35c46b 0 10%,#84bf49 10% 20%,#e4c33b 20% 30%,#f09b3f 30% 40%,#e4524b 40% 50%,transparent 50%)}.arc:after{content:"";position:absolute;inset:56px;border-radius:50%;background:#0d1b2d}.needle{position:absolute;width:5px;height:145px;background:white;left:50%;bottom:-2px;transform-origin:50% 100%;transform:rotate(var(--needle));border-radius:5px;z-index:3;box-shadow:0 0 12px rgba(255,255,255,.5)}.hub{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--accent);z-index:4}.aqiValue{text-align:center;font-size:76px;font-weight:900;color:var(--accent);line-height:1}.aqiLabel{text-align:center;color:#d7e6f3;font-size:23px;font-weight:900;margin-top:6px}
@media(max-width:980px){body{overflow:auto}.topbar{height:auto;min-height:84px;padding:14px 18px;flex-wrap:wrap}.brand{min-width:220px}.topicnav{order:3;width:100%;justify-content:flex-start}.stage{height:auto;min-height:calc(100vh - 180px);padding:14px}.slide{grid-template-columns:1fr;min-height:850px}.visual{min-height:390px;border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}.content{padding:26px}.footer{position:sticky;bottom:0;padding:0 16px;z-index:5}.body{font-size:24px}.title{font-size:42px}}
@media print{body{overflow:visible;background:white}.topbar,.progressWrap,.footer{display:none}.stage{height:auto;padding:0;background:white}.slide{height:100vh;page-break-after:always;border:none;border-radius:0;box-shadow:none}.content{color:#07111f}.body{color:#18334a}.note{color:#234862;background:#eef6fb}.source{color:#557085}}
</style>

<script>
const topics=[
 {id:'pm',name:'Dimensiuni PM',icon:'🌫️',accent:'#7296ff'},
 {id:'conio',name:'Coniometrie',icon:'🔬',accent:'#b48cff'},
 {id:'sidepak',name:'SidePak AM510',icon:'📱',accent:'#27d3e2'},
 {id:'gaze',name:'Gaze toxice',icon:'☁️',accent:'#ff6478'},
 {id:'aqi',name:'Indice AQI',icon:'📊',accent:'#ffbc4a'}
];
const slides=[
 {topic:'pm',title:'Pulberi & Aerosoli — Termeni de bază',body:'<strong>Aerosoli</strong> = particule solide sau lichide dispersate în aer. <strong>Praf</strong> = pulberi cu dimensiuni mai mari, vizibile. Clasificarea după dimensiune explică <em>penetrarea</em> și <em>nocivitatea</em>.',note:'Surse: drumuri neasfaltate, construcții, arderi, industrie, praf natural (saharian, vulcanic), activitate biologică (polen).',source:'EPA · clasificare dimensională a particulelor'},
 {topic:'pm',title:'Particule >10 µm — Reținute în cavitatea nazală',body:'Particulele >10 µm sunt <strong>reținute în cavitatea nazală și faringe</strong> prin impactare inerțială. Sunt eficient filtrate de mucusul nazal și reprezintă <em>praful grosier</em> vizibil.',note:'Perii nazali + mucus = prima barieră de apărare. Praf de construcții, nisip, grăunțe de praf = exemple tipice.',result:['good','✅ >10 µm: filtrate eficient în cavitatea nazală'],source:'Anatomie respiratorie · mecanisme de clearance'},
 {topic:'pm',title:'PM2.5–10 µm — Bronhii și bronhiole',body:'Particulele 2.5–10 µm (<strong>PM10 fracția grosieră</strong>) depășesc filtrul nazal și ajung în bronhii și bronhiole. Clearance-ul mucociliar le elimină parțial, dar iritația bronșică persistă.',note:'PM10: surse principale = construcții, drumuri, industrie. Valoare-limită UE: 40 µg/m³ (medie anuală), 50 µg/m³ (24h, max. 35 depășiri/an).',source:'UE · PM10'},
 {topic:'pm',title:'PM2.5 — Alveolele pulmonare: 80–90% retenție',body:'PM2.5 (<2.5 µm) ajunge în <strong>alveolele pulmonare</strong> unde sunt reținute în proporție de <em>80–90%</em>. Nu pot fi eliminate prin tuse. Pot traversa bariera alveolară și ajunge în circulația sangvină.',note:'PM2.5 = carcinogen grupa 1 IARC (2013). Valoare-limită UE: 25 µg/m³ anual. OMS 2021: 5 µg/m³. Surse: arderi diesel, cărbune, lemn.',result:['positive','🔴 PM2.5 <2.5 µm: retenție alveolară foarte mare'],source:'IARC · WHO Air Quality Guidelines 2021'},
 {topic:'pm',title:'PM0.1 (<0.1 µm) — Particule ultrafine',body:'Particulele ultrafine PM0.1 au o <strong>comportare particulară</strong>: ajung în alveole, o parte se poate elimina cu aerul expirat, iar fracțiunea reținută poate <em>traversa bariera alveolară</em> și trece în sânge.',note:'PM0.1 nu are o reglementare UE specifică în materialul de curs. Surse: gaze de eșapament direct, nanoparticule industriale.',result:['warning','⚠️ PM0.1: efecte sistemice posibile — cardiovascular și neurologic'],source:'Material didactic LP1B'},
 {topic:'conio',title:'Coniometria — Ce și de ce?',body:'<strong>Coniometria</strong> = numărarea microscopică a particulelor de praf din aer. Spre deosebire de gravimetrie (greutate totală), coniometria oferă informații despre <em>distribuția dimensională</em> — esențială pentru evaluarea nocivității.',note:'Nocivitatea prafului NU depinde doar de cantitate (mg/m³), ci mai ales de procentul particulelor <5 µm care ajung profund în aparatul respirator.',source:'Metodă de laborator · coniometrie'},
 {topic:'conio',title:'Rețeaua micrometrică — Etalonul de 5 µm',body:'La <strong>coniometrul Zeiss</strong>, câmpul microscopic are o rețea etalonată. Particulele sunt comparate cu reperul de <em>5 µm</em> pentru clasificarea în >5 µm sau <5 µm.',note:'Pragul de 5 µm este important medical deoarece particulele fine au o penetrare respiratorie mai profundă.',source:'Coniometru Zeiss · obiectiv x40'},
 {topic:'conio',title:'Numărarea particulelor — 100–400 particule',body:'Se numără <strong>100–400 particule</strong> per probă, clasificate în <em>mari (>5 µm)</em> și <em>mici (<5 µm)</em>. Rezultatul este exprimat ca procent relativ al fiecărei clase.',note:'Exemplu: 12 particule >5 µm + 28 particule <5 µm din 40 totale → 30% mari, 70% fine.',result:['warning','⚠️ >50% particule <5 µm = praf cu nocivitate ridicată'],source:'Calcul procentual al fracțiilor dimensionale'},
 {topic:'conio',title:'Formula de praf & Conio-dispersiograma',body:'<strong>Dispersiograma</strong> = reprezentarea grafică a distribuției dimensionale a particulelor (% din fiecare clasă de dimensiune). Formula de praf sintetizează proporția claselor.',note:'Praful cu procent mare de particule fine <5 µm este mai nociv decât aceeași masă totală de praf grosier. Exemple: industria minieră, ciment, silice.',source:'Interpretare coniometrică'},
 {topic:'conio',title:'Determinarea compoziției chimice a pulberilor',body:'Unele componente cresc puternic nocivitatea: <strong>SiO₂ liber</strong> → silicoză; <strong>fibre de azbest</strong> → mezoteliom; <strong>plumb</strong> → intoxicație cronică; <strong>hidrocarburi aromatice</strong> → risc carcinogen.',note:'Analiza chimică poate folosi spectrometrie, fluorescență X și cromatografie, în funcție de contaminant.',result:['positive','🔴 SiO₂ + azbest + Pb = risc ocupațional major'],source:'Igiena muncii · analiza pulberilor'},
 {topic:'sidepak',title:'SidePak AM510 — Monitor personal pentru aerosoli',body:'<strong>SidePak AM510</strong> = monitor portabil pentru PM2.5 în timp real. Principiu: <em>împrăștierea luminii laser</em> — particulele sunt detectate prin lumina dispersată.',note:'Afișaj în timp real: µg/m³ · medie ponderată · valori min/max · data logger. Dispozitivul necesită calibrare conform aplicației și aerosolului măsurat.',source:'TSI SidePak AM510 · principiu light scattering'},
 {topic:'sidepak',title:'Scenariul 1 — Aer interior: 35 µg/m³',body:'PM2.5 = <strong>35 µg/m³</strong>. În materialul didactic este folosit ca exemplu de nivel urban interior fără o sursă specifică imediată. Valoarea depășește recomandarea anuală OMS 2021 de 5 µg/m³.',note:'Lecția principală: interpretarea unei măsurători trebuie raportată la perioada de mediere și la standardul folosit.',result:['warning','⚠️ 35 µg/m³: comparați cu ghidurile și durata măsurării'],source:'WHO Air Quality Guidelines 2021'},
 {topic:'sidepak',title:'Scenariul 2 — Gătit (prăjire): 85 µg/m³',body:'PM2.5 poate <strong>crește rapid în timpul prăjirii</strong>. Exemplul didactic: 85 µg/m³. Gătitul poate fi o sursă importantă de particule fine în interior, mai ales fără evacuare eficientă.',note:'Ventilația și hota cu evacuare externă reduc expunerea. Recircularea fără filtrare adecvată are eficiență limitată pentru particulele fine.',result:['positive','🔴 85 µg/m³: sursă indoor importantă — ventilați'],source:'Expunere indoor · scenariu practic'},
 {topic:'sidepak',title:'Scenariul 3 — Trafic intens: 150 µg/m³',body:'Exemplu didactic: PM2.5 = <strong>150 µg/m³</strong> lângă o stradă aglomerată. Efortul fizic crește ventilația pulmonară și poate crește doza inhalată.',note:'Pentru mers, alergare sau ciclism, alegerea unei rute mai puțin circulate poate reduce expunerea.',result:['positive','🔴 150 µg/m³: expunere ridicată — evitați efortul intens lângă trafic'],source:'Trafic rutier · expunere personală'},
 {topic:'sidepak',title:'Scenariul 4 — Episod sever: 260 µg/m³',body:'Exemplul de curs: PM2.5 = <strong>260 µg/m³</strong> într-un episod sever de poluare. La asemenea valori, expunerea trebuie redusă semnificativ, mai ales la persoanele vulnerabile.',note:'Pentru particule fine, măștile FFP2/N95 oferă protecție mai bună decât măștile chirurgicale, dacă sunt purtate corect.',result:['positive','🔴 260 µg/m³: nivel foarte ridicat — reduceți expunerea'],source:'Material didactic LP1B · protecție respiratorie'},
 {topic:'gaze',title:'Gaze toxice — Metode de detectare',body:'Gazele toxice se detectează prin <strong>metode rapide orientative</strong> (tuburi colorimetrice) și <strong>analizoare automate</strong> (senzori electrochimici, spectroscopie IR, cromatografie).',note:'Exposimetria biologică poate folosi biomarkeri: COHb pentru CO, metaboliți urinari pentru anumiți compuși organici.',source:'Metode de monitorizare a contaminanților gazoși'},
 {topic:'gaze',title:'Monoxid de carbon (CO) — „ucigașul tăcut”',body:'<strong>CO</strong> este incolor, inodor și insipid. Se leagă de hemoglobină cu afinitate mult mai mare decât O₂ → <em>carboxihemoglobină</em> → hipoxie tisulară.',note:'Surse: ardere incompletă, sobe și centrale defecte, motoare. Detectoarele de CO sunt esențiale în spațiile cu surse de combustie.',result:['warning','⚠️ CO detectat: identificați sursa și ventilați imediat'],source:'Toxicologia monoxidului de carbon'},
 {topic:'gaze',title:'Dioxid de azot (NO₂) — poluant al arderilor',body:'<strong>NO₂</strong> apare în special din <em>arderea la temperaturi înalte</em>: trafic rutier și procese de combustie. Este un iritant puternic al căilor respiratorii și poate contribui la inflamația pulmonară.',note:'În materialul de curs: valoare-limită UE anuală 40 µg/m³; ghid OMS 2021: 10 µg/m³ anual.',result:['positive','🔴 NO₂ crescut: evaluați traficul și sursele de combustie'],source:'UE · WHO Air Quality Guidelines 2021'},
 {topic:'gaze',title:'Dioxid de sulf (SO₂) — combustibili cu sulf',body:'<strong>SO₂</strong> provine din arderea combustibililor care conțin sulf. Este iritant respirator și poate produce <em>bronhospasm</em>, mai ales la persoanele cu astm.',note:'Emisiile de SO₂ au scăzut mult în Europa; sursele industriale și energetice rămân relevante local.',result:['positive','🔴 SO₂ crescut: suspectați o sursă industrială sau energetică'],source:'Poluarea aerului · oxizi de sulf'},
 {topic:'gaze',title:'Monitorizare multi-gaz — verificare simultană',body:'Gazometrul portabil poate monitoriza simultan <strong>CO, H₂S, NO₂ și O₂</strong>. Este utilizat în spații închise, industrie, laboratoare și intervenții unde atmosfera poate deveni periculoasă.',note:'Senzorii electrochimici necesită calibrare și testare funcțională conform producătorului.',result:['good','✅ Multi-gaz: monitorizarea simultană crește siguranța'],source:'Igiena muncii · monitorizare multi-gaz'},
 {topic:'aqi',title:'Indicele AQI — Ce este și cum se citește?',body:'<strong>AQI (Air Quality Index)</strong> sintetizează calitatea aerului într-un indice ușor de interpretat pe baza poluanților monitorizați. În practică, indicele general este determinat de <em>poluantul cu situația cea mai nefavorabilă</em>.',note:'Poluanți frecvent incluși: SO₂, NO₂, O₃, CO, PM10 și PM2.5. Metodologia exactă depinde de sistemul național folosit.',source:'calitateaer.ro · interpretarea indicelui de calitate'},
 {topic:'aqi',title:'AQI 3 — Bun',body:'<strong>AQI 3 = Bun</strong>. Activitatea obișnuită poate continua fără restricții importante. Exemplu didactic: zi cu dispersie bună a poluanților și fără episod major de poluare.',note:'Condițiile meteorologice — vântul, stabilitatea atmosferică și inversiunile — modifică rapid concentrațiile poluanților.',result:['good','✅ AQI 3: condiții bune pentru activitate exterioară'],source:'Exemplu didactic LP1B'},
 {topic:'aqi',title:'AQI 5 — Moderat',body:'<strong>AQI 5 = Moderat</strong>. Persoanele vulnerabile — astm, BPOC, boli cardiovasculare, copii mici și vârstnici — pot necesita reducerea efortului fizic intens în exterior.',note:'În orașe, nivelul poate fi influențat de PM10, NO₂ și O₃, în funcție de sezon și meteorologie.',result:['warning','⚠️ AQI 5: grupurile sensibile reduc efortul intens'],source:'Exemplu didactic LP1B'},

let index=0;
function topicOf(i){return topics.find(t=>t.id===slides[i].topic)}
function topicStart(id){const i=slides.findIndex(s=>s.topic===id);if(i>=0){index=i;render()}}
function topicStep(i){const id=slides[i].topic;return slides.slice(0,i+1).filter(s=>s.topic===id).length}
function topicCount(id){return slides.filter(s=>s.topic===id).length}
function renderNav(){const nav=document.getElementById('topicnav');nav.innerHTML=topics.map(t=>`<button data-topic="${t.id}" onclick="topicStart('${t.id}')">${t.icon} ${t.name}</button>`).join('')}
function resultHtml(r){return r?`<div class="result ${r[0]}">${r[1]}</div>`:''}
function pmVisual(step){
 const labels=['Clasificare dimensională','>10 µm · nas / faringe','PM2.5–10 · bronhii','PM2.5 · alveole','PM0.1 · ultrafine'];
 return `<div class="medical-card"><div class="zonebadge">${labels[step-1]}</div><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Diagram_showing_the_lungs_including_the_alveoli_CRUK_309.svg" alt="Anatomia plămânilor și alveolelor"><div class="size-ladder"><div>>10 µm</div><div>PM10</div><div>PM2.5</div><div>PM0.1</div></div><div class="medical-caption"><span>🫁 Aparatul respirator · bronhii · alveole</span><span>Cancer Research UK / Wikimedia Commons</span></div></div>`
}
function conioVisual(step){
 const pts=[[34,28,'big'],[56,20,'small'],[69,36,'small'],[42,50,'small'],[73,60,'big'],[25,62,'small'],[58,72,'small'],[35,77,'big'],[65,83,'small'],[48,35,'small'],[81,49,'small'],[21,43,'small']];
 return `<div class="scope">${pts.map((p,i)=>`<span class="particle ${p[2]}" style="left:${p[0]}%;top:${p[1]}%;opacity:${step>=3?1:.72}"></span>`).join('')}<div class="scale5">5 µm</div></div>`
}
function sideVisual(step){const vals=[0,35,85,150,260],v=vals[step-1],state=v<50?'MODERAT':v<100?'RIDICAT':v<200?'FOARTE RIDICAT':'SEVER';return `<div class="device"><div class="deviceScreen"><div class="deviceLabel">PM2.5 · µg/m³</div><div class="deviceValue">${v}</div><div class="deviceUnit">măsurare în timp real</div><div class="deviceStatus">${step===1?'SIDEPAK AM510':state}</div></div><div class="deviceDots"><div class="on">LASER</div><div class="${step>1?'on':''}">TWA</div><div class="${step>2?'on':''}">LOG</div><div class="${step>3?'on':''}">ALERT</div></div></div>`}
function gasVisual(step){const gas=[['MULTI','—'],['CO','25 ppm'],['NO₂','0.5 ppm'],['SO₂','2 ppm'],['4 GAZE','OK']][step-1];return `<div class="device"><div class="deviceScreen"><div class="deviceLabel">GAZOMETRU PORTABIL</div><div class="deviceValue" style="font-size:${gas[0].length>3?'54px':'76px'}">${gas[0]}</div><div class="deviceUnit">${gas[1]}</div><div class="deviceStatus">${step===5?'PARAMETRI NORMALI':step===1?'METODE DE DETECTARE':'MĂSURARE ACTIVĂ'}</div></div><div class="deviceDots"><div class="${step===2||step===5?'on':''}">CO</div><div class="${step===5?'on':''}">H₂S</div><div class="${step===3||step===5?'on':''}">NO₂</div><div class="${step===4||step===5?'on':''}">SO₂</div></div></div>`}
function aqiVisual(step){const vals=[1,3,5,8,10],labels=['DEFINIȚIE','BUN','MODERAT','RĂU','PERICULOS'];const rotations=[-82,-48,-12,42,82];return `<div class="aqi"><div class="aqiGauge"><div class="arc"></div><div class="needle" style="--needle:${rotations[step-1]}deg"></div><div class="hub"></div></div><div class="aqiValue">${vals[step-1]}</div><div class="aqiLabel">${labels[step-1]}</div></div>`}
function visualHtml(topic,step){if(topic==='pm')return pmVisual(step);if(topic==='conio')return conioVisual(step);if(topic==='sidepak')return sideVisual(step);if(topic==='gaze')return gasVisual(step);return aqiVisual(step)}
function render(){
 const s=slides[index],t=topicOf(index),step=topicStep(index),count=topicCount(s.topic);document.documentElement.style.setProperty('--accent',t.accent);
 document.querySelectorAll('#topicnav button').forEach(b=>b.classList.toggle('active',b.dataset.topic===s.topic));
 document.getElementById('visual').innerHTML=visualHtml(s.topic,step);
 document.getElementById('content').innerHTML=`<div class="kicker"><span class="num">${step}</span>${t.icon} ${t.name} · ${step}/${count}</div><h2 class="title">${s.title}</h2><p class="body">${s.body}</p>${s.note?`<div class="note"><b>De reținut:</b> ${s.note}</div>`:''}${resultHtml(s.result)}${s.source?`<div class="source">Sursă / reper didactic: ${s.source}</div>`:''}`;
 document.getElementById('counter').textContent=`LP1B · diapozitiv ${index+1} din ${slides.length}`;document.getElementById('progress').style.width=((index+1)/slides.length*100)+'%';
 document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('next').textContent=index===slides.length-1?'✓ Final':'Următorul →';
}
function go(d){const n=index+d;if(n>=0&&n<slides.length){index=n;render()}}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}}
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='f')toggleFullscreen();if(e.key==='Home'){index=0;render()}if(e.key==='End'){index=slides.length-1;render()}});
renderNav();render();
</script>
</body>
</html>
