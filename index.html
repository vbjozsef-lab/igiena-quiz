<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans','Segoe UI',system-ui,sans-serif;background:#F0F4FF;min-height:100vh;-webkit-tap-highlight-color:transparent}
  input,select,button,textarea{font-family:inherit}

  /* ── Input/select — mobile visible, dark-mode safe ── */
  input,select,textarea{
    -webkit-appearance:none;appearance:none;
    background:#fff !important;
    color:#1e293b !important;
    border:1.5px solid #c7d2fe !important;
    border-radius:10px;
    padding:14px 16px;
    font-size:16px !important; /* 16px prevents iOS zoom */
    width:100%;
    box-sizing:border-box;
    -webkit-text-fill-color:#1e293b !important;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:#6366f1 !important;
    box-shadow:0 0 0 3px rgba(99,102,241,0.15);
  }
  input::placeholder,textarea::placeholder{color:#94a3b8 !important;-webkit-text-fill-color:#94a3b8 !important}
  select option{background:#fff;color:#1e293b}

  /* ── Scrollbar ── */
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:#f0f4ff}
  ::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:3px}

  /* ── Animations ── */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 2s infinite}
  .spin{animation:spin 1s linear infinite;display:inline-block}
  #qr-canvas canvas,#qr-canvas img{width:200px!important;height:200px!important}

  /* ── AdminPanel nav — horizontal scroll on mobile ── */
  .admin-nav-tabs{
    display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none;flex-shrink:0;
  }
  .admin-nav-tabs::-webkit-scrollbar{display:none}

  /* ── HomePage — two column → single column ── */
  .home-layout{display:flex;min-height:100vh;overflow:hidden;position:relative}
  .home-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 56px;border-right:1px solid rgba(99,102,241,0.1)}
  .home-right{width:480px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 48px}

  @media(max-width:768px){
    .home-layout{flex-direction:column}
    .home-left{display:none} /* hide branding on mobile — just show login */
    .home-right{width:100%;padding:24px 20px;min-height:100vh;justify-content:flex-start;padding-top:48px}
    .home-mobile-logo{display:flex !important}
  }
  .home-mobile-logo{display:none}

  /* ── AdminPanel content — padding on mobile ── */
  .admin-content{max-width:1100px;margin:0 auto;padding:28px 24px;position:relative;z-index:1}
  @media(max-width:640px){
    .admin-content{padding:16px 12px}
  }

  /* ── QR tab grid — stack on mobile ── */
  .qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:760px){
    .qr-grid{grid-template-columns:1fr}
  }

  /* ── Results table — horizontal scroll ── */
  .results-table-wrap{overflow-x:auto;border-radius:14px;border:1px solid #e0e7ff;background:#fff;box-shadow:0 4px 16px rgba(99,102,241,0.06)}
  .results-table-wrap table{min-width:900px}

  /* ── Student screens — full mobile ── */
  .student-card{background:#fff;border:1px solid #e0e7ff;border-radius:20px;padding:32px 28px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(99,102,241,0.1)}
  @media(max-width:480px){
    .student-card{border-radius:16px;padding:24px 20px;box-shadow:none;border:none;max-width:100%}
  }

  /* ── Fisa screens ── */
  @media(max-width:640px){
    .fisa-grid-3{grid-template-columns:repeat(2,1fr) !important}
    .fisa-conc-grid{grid-template-columns:1fr !important}
  }
</style>

        {q:"Care este sursa probabilă a streptococilor crescuți? Explicați mecanismul.",h:"Turbina stomatologică generează aerosoli cu picături Flügge din cavitatea orală → streptococi viridans și hemolitici aeropurtați → sedimentare pe suprafețe și inhalare personal."},
        {q:"Alcoolul 70% este suficient pentru dezinfecția suprafețelor stomatologice? Argumentați.",h:"Insuficient pentru suprafețe poroase și instrumentar critic. Necesară dezinfecție niveluri: suprafețe = cloramină 1% sau glutaraldehidă. Instrumentar = autoclavare 134°C. Alcool 70% doar pe suprafețe mici, neted."},

    { id:"g4", emoji:"🏥", title:"Infecție nosocomială — investigație focar", color:"#b91c1c",
      caz:[{l:"Locație",v:"Secție chirurgie, spital regional"},{l:"Situație",v:"5 pacienți cu infecție plagă postoperatorie în 10 zile"},{l:"Agent",v:"Staphylococcus aureus meticilino-rezistent (MRSA)"},{l:"NTG aer sală operații",v:"420/m³ (norma <300)"},{l:"NTG mâini chirurgi",v:"32 UFC/mână (norma <15)"},{l:"HEPA filtru",v:"neverificat de 18 luni"}],
      qs:[
        {q:"Confirmați sau infirmați un focar nosocomial. Ce criterii folosiți?",h:"FOCAR CONFIRMAT: ≥2 cazuri cu același agent + legătură epidemiologică (aceeași sală, același chirurg, interval scurt). MRSA = agent de alarmă OMS. Anunț obligatoriu DSP."},
        {q:"Trasați lanțul epidemiologic al transmiterii MRSA în acest context.",h:"Sursă: personal purtător MRSA (nazofaringe/mâini) sau pacient colonizat. Cale: mâini nespălate, aerosoli, instrumentar. Poartă de intrare: plagă chirurgicală. Gazdă susceptibilă: pacient postoperator imunosupresat."},
        {q:"NTG mâini 32 UFC vs normă 15. Ce spune acest lucru despre tehnica de spălare?",h:"Tehnică insuficientă sau nesistematică. Posibil: timp scurt, omitere zone (degete, unghii, interdigital). Sau recontaminare după spălare (atingere robinet cu mâna). Necesară reauditare tehnică OMS 6 pași."},
        {q:"HEPA filtru neverificat 18 luni — ce risc specific implică pentru sala de operații?",h:"Filtru înfundat/deteriorat → pierdere eficiență filtrare → germeni aeropurtați inclusiv MRSA în sala sterilă. Laminar flow compromis → depunere pe câmp operator."},
        {q:"Ce investigații microbiologice ordonați pentru identificarea sursei?",h:"Tampoane nazale TOȚI chirurgii + anestezisti + instrumentiste. Culturi din toate plăgile. Tipizare moleculară PFGE/WGS pentru confirmare legătură clonală. Tampoane suprafețe + aer."},
        {q:"Ce măsuri de control al focarului impuneți în primele 24 ore?",h:"1. Carantinare sală operații. 2. Izolare contact 5 pacienți MRSA. 3. Screening personal. 4. Dezinfecție terminală. 5. Decontaminare portători (mupirocin nazal). 6. Verificare și înlocuire HEPA."},
      ], conc:["Confirmarea focarului (da/nu + criterii)","Sursa probabilă identificată","Prioritatea #1 în primele 24 ore"] },

    { id:"g5", emoji:"🌬️", title:"Sindromul Sick Building — clădire de birouri", color:"#0ea5e9",
      caz:[{l:"Locație",v:"Clădire birouri, 6 etaje, 280 angajați"},{l:"Simptome raportate",v:"65% angajați: cefalee, oboseală, ochi uscați, iritație nazală — simptome dispar weekend"},{l:"CO2",v:"2.400 ppm (norma: <1.000)"},{l:"Umiditate relativă",v:"22% (recomandat: 40-60%)"},{l:"COV total (TVOC)",v:"680 µg/m³ (norma: <300)"},{l:"Ventilare",v:"HVAC cu recirculare 90%, aport aer proaspăt minim"}],
      qs:[
        {q:"Stabiliți diagnosticul de Sick Building Syndrome. Ce criterii sunt îndeplinite?",h:"SBS = simptome >20% angajați + ameliorare la plecare din clădire + fără altă cauză identificată. Criterii îndeplinite: 65% simptomatici, ameliorare weekend, CO2/COV crescute."},
        {q:"Calculați depășirile pentru CO2, UR și TVOC față de normele recomandate.",h:"CO2: 2400/1000 = 2,4×. UR: 22% vs 40-60% = sub limita inferioară. TVOC: 680/300 = 2,27×. Trei parametri simultan = certitudine SBS."},
        {q:"De ce UR de 22% contribuie la simptome? Ce organe sunt afectate?",h:"Aer uscat → deshidratare mucoase nazale, oculare → iritație, creștere susceptibilitate infecții respiratorii. Mucoasa nazală = prima linie apărare împotriva agenților inhalați."},
        {q:"Recircularea 90% a aerului — ce risc specific generează în contextul COVID/influenza?",h:"Recirculare mare = redistribuire aerosoli infecțioși în întreaga clădire. Super-spreading posibil. Norma post-COVID: minim 10 ACH cu aer proaspăt sau filtrare HEPA H13 în circuit recirculat."},
        {q:"Ce modificări urgente ale sistemului HVAC recomandați?",h:"Creștere aport aer proaspăt la 30-40% (reducere recirculare). Adăugare umidificatoare (țintă UR 45%). Filtrare HEPA H13. Curățare canale HVAC (COV din depozite). Monitorizare CO2 continuă cu alarme."},
        {q:"Angajatorul are obligații legale? Ce reglementări invocați?",h:"Da: HG 1091/2006 (locuri de muncă). Legea 319/2006 SSM. Normativ I5 HVAC. Directiva 89/654/CEE. Risc: răspundere pentru cheltuieli medicale angajați afectați."},
      ], conc:["Diagnosticul stabilit și criteriile","Parametrul cel mai deviant","Modificarea HVAC prioritară"] },

    { id:"g6", emoji:"🧪", title:"Dezinfecția suprafețelor — protocol greșit", color:"#7c3aed",
      caz:[{l:"Locație",v:"Salon medical, 8 paturi"},{l:"Protocol actual",v:"ștergere cu alcool 70% o dată/zi"},{l:"NTG suprafețe",v:"18 UFC/cm² (norma max 5)"},{l:"Coliformi",v:"detectați pe bara patului (norma: 0)"},{l:"Frecvența curățare",v:"1×/zi dimineața"},{l:"Produsul folosit",v:"alcool izopropilic 70% — expirat de 4 luni"}],
      qs:[
        {q:"Identificați toate erorile din protocolul de dezinfecție actual.",h:"1. Frecvență insuficientă (1×/zi vs. după fiecare pacient). 2. Produs expirat = eficacitate redusă. 3. Alcool singur insuficient pentru coliformi. 4. Tehnica ștergere uscată vs. umedă cu timp de contact."},
        {q:"Coliformi pe bara patului — ce sursa indică și ce risc generează?",h:"Coliformi = contaminare fecală (mâini personal nespălate sau pacienți). Risc: transmitere E. coli, Klebsiella, C. difficile la pacienți imunocompromiși. Risc infecție urinară, digestivă."},
        {q:"Ce dezinfectant recomandați în locul alcoolului izopropilic? Justificați.",h:"Hipoclorit de sodiu 0,1% (1.000 ppm Cl activ) pentru suprafețe: spectru larg, activ vs. coliformi, C. difficile, SARS-CoV-2. Sau aldehide quaternare (Deconex). Alcool: ineficient pe materie organică."},
        {q:"Stabiliți frecvența corectă de dezinfecție pentru un salon cu 8 paturi.",h:"Minim: dimineața (curățenie generală) + după fiecare externare (dezinfecție terminală) + după orice contaminare vizibilă. Mânerele ușilor, barele paturilor, telecomenzi: de 3×/zi."},
        {q:"Ce tehnica corectă de ștergere dezinfectantă trebuie instruiți personalul?",h:"Suprafață umedă → timp contact 1-5 min → NU ștergeți imediat! Mișcări unidirectionale (nu circular — recontaminare). Mănuși de unică folosință. Schimb lavete la fiecare suprafață."},
        {q:"Ce fișă de supraveghere implementați pentru monitorizarea eficacității dezinfecției?",h:"Registru: data/ora, produs, lot, concentrație, suprafața tratată, responsabil. Verificare bacteriologică lunară. Indicatori colorimetrici pe suprafețe (test ATP bioluminiscență). Audit trimestrial protocol."},

        {q:"De ce nou-născuții sunt vulnerabili la acești parametri față de adulți?",h:"Raport suprafață/volum corp mare → pierdere căldură convectivă mult mai rapidă. Absența țesut adipos brun funcțional la prematuri. Termoreglare imatură. Hipotermie la nou-născut = risc letal imediat."},
        {q:"Calculați pierderea de căldură suplimentară cauzată de viteza curentului de 0,4 m/s.",h:"Temperatura echivalentă (windchill neonatal): T efect = T aer - 4°C × viteza. 19 - 4×0,4 = 17,4°C echivalent termic. Nou-născut 'simte' 17°C în loc de 19°C → hipotermie accelerată."},

        {q:"Ce mecanism fiziopatologic explică hernia de disc prin vibrații corp întreg?",h:"Vibrații 4-8 Hz → rezonanță vertebrală → compresia repetitivă și decompresie rapidă a discului intervertebral → degenerare fibrocartilaj → reducere înălțime disc → hernie nucleu pulpos."},

      qs:[
        {q:"Clasificați calitatea apei conform Directivei 2006/7/CE. Justificați.",h:"Clasa SLABĂ (necorespunzătoare): E.coli 850 > 900 (limita suficient), dar E. coli = 850 vs 100 (excelent) = 8,5×. Enterococi 320 > 200 = 1,6×. Ambii indicatori depășiți = clasificare 'insuficientă' sau 'slabă'."},
        {q:"Ce boli se pot transmite prin îmbăiere în această apă? Enumerați și clasificați.",h:"Digestive: gastroenterite (E. coli, Salmonella, norovirus). ORL: otite externe, conjunctivite. Cutanate: foliculite (Pseudomonas). Neurologice: Naegleria fowleri (rar, mortal). Leptospiroză (contact mucoase)."},
        {q:"Suspectați deversarea de canalizare — cum confirmați și ce probe recoltați?",h:"Profile E.coli aval/amonte de deversare. Markeri fecali umani: bacteriofagi F-specific, Bacteroides fragilis. Probe sediment. Inspecție conducte la fața locului. Notificare Apele Române."},
        {q:"Ce decizie luați privind plaja? Cum comunicați publicului?",h:"Interzicere imediată îmbăiere. Panouri vizibile 'Îmbăierea interzisă — apă neconformă'. Comunicat DSP public. Notificare Primărie. Estimare termen rezolvare. Evitare panică vs. informare corectă."},
        {q:"Ce măsuri preventive recomandați administrației stațiunii pe termen mediu?",h:"Canalizare cu tratare completă (nitrificare + dezinfecție). Monitorizare săptămânală în sezon. Plan de management calitate apă (Directiva 2006/7). Toalete ecologice pe plajă (reducere contaminare locală)."},
        {q:"Ce reglementare românească transpune Directiva europeană pentru apa de îmbăiere?",h:"HG 88/2004 privind calitatea apelor de îmbăiere (transpune 76/160/CEE). Înlocuit de HG 546/2008 (transpune 2006/7/CE). Clasificare anuală: excelentă/bună/suficientă/slabă. Raportare EEA obligatorie."},
      ], conc:["Clasificarea calității apei conform directivei","Decizia privind plaja","Sursa probabilă confirmată"] },

      caz:[{l:"Locație",v:"Rețea de distribuție, oraș mediu"},{l:"Clor rezidual liber",v:"0,05 mg/L (norma: 0,1-0,5 mg/L)"},{l:"pH",v:"8,9 (norma: 6,5-9,5)"},{l:"Turbiditate",v:"3,2 NTU (norma: max 1 NTU)"},{l:"Clor total",v:"0,12 mg/L"},{l:"Sesizări",v:"miros de mucegai și gust neplăcut la 120 de consumatori"}],
      qs:[
        {q:"Interpretați clorul rezidual liber 0,05 mg/L. Ce risc microbiologic implică?",h:"Sub norma 0,1 mg/L = dezinfecție insuficientă în rețea. Risc recontaminare bacteriană la distanță de stație. Formarea de biofilm în conducte. Posibil focar gastroenterite dacă E. coli prezent."},
        {q:"pH 8,9 — de ce afectează eficacitatea clorului?",h:"La pH >8, clorul activ (HOCl) se disociază în OCl- (70% la pH 8,9) cu eficiență dezinfectantă de 70× mai mică decât HOCl. Necesitar: pH 7,0-7,5 pentru eficiență maximă clorare."},
        {q:"Turbiditate 3,2 NTU — ce probleme specifice generează?",h:"Particulele suspendate protejează bacteriile de acțiunea clorului (shadowing). Turbiditate >1 NTU = indiciu contaminare sau tratare deficitară. Posibil: deteriorare filtru nisip sau coagulare insuficientă."},
        {q:"Mirosul de mucegai la 120 consumatori — ce substanțe pot fi implicate?",h:"Geosmina și 2-MIB (produși de cianobacterii și actinomicete) — prag olfactiv extrem de scăzut (5 ng/L). Sau compuși organici clorați (trihalometane) formați prin reacție clor + materie organică."},
        {q:"Ce investigații suplimentare ordonați la stația de tratare?",h:"Verificare doză clorare (ajustare la 0,3 mg/L liber rezidual). Determinare THM (trihalometane). Analiza microbiologică completă (E. coli, enterococi, Pseudomonas, Legionella). Control filtre și coagulare."},
        {q:"Ce notificări și termene de remediere stabiliți?",h:"Informare imediată primărie + DSP (risc sănătate publică). Dacă E. coli prezent: alertă publică + apă îmbuteliată. Termen remediere: 24h (clor). 7 zile (pH). 30 zile (turbiditate structurală). Raport conform HG 458/2002."},
      ], conc:["Parametrul cu risc microbiologic imediat","Cauza deficitului de dezinfecție","Termenul de remediere"] },

      qs:[

        {q:"Descrieți mecanismul patogenetic al fluorozei dentare și osoase.",h:"Fluorura înlocuiește OH- în hidroxiapatita (fluorapatita) → cristale mai dure dar mai fragile. Dentar: hipomineralizare smalț (pete albe/maro, porozitate). Osos: osteoscleroza + calcificări ligamente → rigiditate articulară."},
        {q:"Defluorarea — ce metode tehnice sunt fezabile pentru o comunitate rurală?",h:"Coagulare cu sulfat de aluminiu (Al(SO4)3) — eficiență 50-70%. Schimbători de ioni (selective fluor). Osmoza inversă — eficiență >95% dar costisitoare. Contactul cu os de animal calcinat (carbon osos)."},
        {q:"Copiii expuși de la naștere până la 8 ani — ce urmărire stomatologică propuneți?",h:"Examinare stomatologică anuală. Indexul Dean pentru gradul fluorozei. Evitare paste de dinți cu fluor (aport suplimentar). NU pastile sau soluții fluorură (contraindicație absolută la >1,5 mg/L în apă)."},
        {q:"Apa minerală comercializată local conține 0,3 mg/L fluor. O recomandați ca alternativă?",h:"DA — 0,3 mg/L e sub norma 1,5 mg/L și mult sub 2,8 mg/L local. Reduce fluoroza dacă înlocuiește apa de fântână. Atentie: soluție temporară, nu permanentă. Costul accesibilității pentru comunitate."},
        {q:"Ce reglementări specifice privind fluorul în apa potabilă invocați?",h:"HG 458/2002 (calitatea apei potabile, transpune 98/83/CE): limita 1,5 mg/L. Ordinul MS 561/2010. WHO Guidelines 2017: 1,5 mg/L. Notificare obligatorie când >1,5 mg/L: nu se folosește pentru preparare hrană sugari."},
      ], conc:["Corelația depășire fluor — prevalența fluorozei","Metoda de defluorare recomandată","Măsura imediată pentru copii"] },

        {q:"De ce copiii sub 5 ani și gravidele sunt populația de risc maxim?",h:"Copii: absorbție intestinală Pb de 40-50% (adulți: 5-15%). Bariera hematoencefalică imatură → neurotoxicitate. Nici un prag sigur (EFSA 2010). Gravide: Pb trece placenta, afectează neurodezv. fetală."},
        {q:"Ce sfaturi PRACTICE dați familiilor care locuiesc în apartament mâine dimineață?",h:"Purjare 2 minute apă rece înainte consum (elimină apa stagnantă). Nu folosi apă fierbinte pentru băut/gătit (Pb mai solubil). Filtru NSF/ANSI 53 (certificat reducere Pb). Nu fierbeți — concentrați Pb."},
        {q:"Ce investigare medicală recomandați copiilor și gravidelor?",h:"Plumburie (Pb sanguin): valori normale <5 µg/dL. >5 µg/dL = acțiune. >10 µg/dL = tratament chelator posibil. Neurodezvoltare copii: WPPSI, Denver. Gravide: ecografie fetală (restricție creștere)."},
        {q:"Cine este responsabil legal și cine suportă costul înlocuirii conductelor?",h:"Proprietarul imobilului (persoana fizică sau asociația de proprietari). Dacă clădire de stat: autoritatea locală. Sprijin: Programul național de îmbunătățire calitate apă (fonduri UE). Termen: max 5 ani conform Directivei 98/83/CE rev."},
        {q:"Ce plan de monitorizare implementați până la înlocuirea conductelor?",h:"Monitorizare Pb la robinet trimestrial. Informare scrisă rezidenți cu sfaturi practice. Distribuire filtre pentru familiile cu copii <5 ani și gravide. Reevaluare la 6 luni. Notificare DSP trimestrial."},

        {q:"De ce amoniul ridicat compromite eficiența clorării?",h:"Cl2 + NH4+ → cloramine (NH2Cl, NHCl2, NCl3). Cloraminele = dezinfectanți slabi (5-10× mai puțin eficienți decât HOCl). Necesară doză extra de clor pentru break-point chlorination."},

      caz:[{l:"Locație",v:"Hotel 4*, 150 camere, sistem termic central"},{l:"Situație",v:"3 oaspeți cu pneumonie atipică la 2-10 zile după sejur"},{l:"Agent confirmat",v:"Legionella pneumophila serogroup 1"},{l:"Temperatura apă caldă",v:"42°C (norma profilaxie: >60°C la boiler, >50°C la robinete)"},{l:"Stagnare",v:"48 de camere neocupate 3 săptămâni"},{l:"Aerosolizare",v:"sistem spa cu jacuzzi activ"}],

        {q:"Confirmați legătura dintre cazurile de pneumonie și hotel. Ce investigații diagnostice?",h:"Testul antigen urinar Legionella (rapid, 90% sensibilitate Sg1). Cultură sputăATF (laborator referință). Anticorpi serici (IFA) — perechi la 3-6 săptămâni. Tipizare moleculară (PFGE) pentru legătură cazuri-sursă."},
        {q:"Temperatura 42°C a apei calde — de ce favorizează multiplicarea Legionella?",h:"Zona de risc Legionella: 20-45°C. Optim multiplicare: 35-40°C. <20°C = dormantă. >60°C = moartă în 2 minute. 42°C = temperatură ideală pentru multiplicare rapidă. Biofilm în instalații = rezervor permanent."},
        {q:"Stagnarea 3 săptămâni în 48 de camere — ce risc specific generează?",h:"Stagnare → răcire apă din conducte locale spre T ambiantal (20-25°C) → multiplicare masivă Legionella în biofilm. Reocupare camere → purjare → aerosoli la duș → inhalare. Risc maxim la primele 10 minute."},
        {q:"Sistați activitatea hotelului? Ce protocol de decontaminare aplicați?",h:"Sistare spa/jacuzzi IMEDIAT. Hotelul poate funcționa cu restricții. Protocol: suprahiperclorare (50 mg/L clor, 24h) SAU șoc termic (70°C, 30 min, purjare din toate punctele). Culturi de control după tratament."},
        {q:"Jacuzzi activ — de ce este sursa cu risc maxim de aerosolizare?",h:"Jacuzzi = generator masiv de aerosoli fini (<5 µm) care pătrund în alveole. Temperatura optimă Legionella (36-40°C). Biofilm pe pereți și conducte. O singură sesiune de 15 minute = expunere majoră."},
        {q:"Ce plan HACCP pentru controlul Legionella impuneți hotelului?",h:"Monitorizare T apă caldă: 60°C boiler, 50°C robinete. Purjare camere neocupate >1 săptămână. Curățare anuală sisteme răcire + spa. Cultură Legionella trimestrial. Registru documentare. Conform HG 1030/2009."},
      ], conc:["Confirmarea sursei (da/nu)","Temperatura corectă de prevenire","Măsura imediată pentru spa"] },

    { id:"g3", emoji:"🔬", title:"Criptosporidioză — piscină publică", color:"#0369a1",
      caz:[{l:"Locație",v:"Piscină municipală, 500 îmbăietori/zi"},{l:"Situație",v:"127 cazuri diaree apoasă la îmbăietori în 10 zile"},{l:"Agent",v:"Cryptosporidium parvum (oociste detectate în apa piscinei)"},{l:"Clor rezidual",v:"0,5 mg/L (normă: 0,4-1,0 mg/L)"},{l:"pH",v:"7,2 (optim)"},{l:"Filtrare",v:"filter cu nisip, ciclu de backwash neefectuat 6 săptămâni"}],
      qs:[
        {q:"De ce Cryptosporidium rezistă la concentrația normală de clor din piscine?",h:"Criptosporidium = parazit cu oociste protejate de perete chitinos rezistent la clor. La 0,5 mg/L clor: E. coli moare în secunde, Criptosporidium supraviețuiește >10 zile. Necesită UV sau dioxid de clor pentru inactivare."},
        {q:"Filtrarea fără backwash 6 săptămâni — ce consecințe are asupra calității apei?",h:"Filtrul înfundat → by-pass (apa trece nefiltrată). Biofilm masiv în filtru = rezervor Cryptosporidium și Giardia. Backwash insuficient = contaminare persistentă. Turbiditate crescută → ineficiență clor."},
        {q:"Calculați rata de atac: 127 cazuri / estimat 5.000 expuși (10 zile). Interpretați.",h:"Rată atac: 127/5000 = 2,54%. Mare pentru o singură sursă = confirmare focar. Reproductibilitate: R0 >1. Distribuție temporală: vârf la 3-5 zile post-expunere (incubație Crypto: 2-10 zile)."},
        {q:"Ce protocol de decontaminare aplicați pentru piscina contaminată cu Criptosporidium?",h:"Golire completă piscină. Curățare mecanică suprafețe. Umplere + tratament UV (40 mJ/cm²) SAU hiperclorare la 20 mg/L × 8h (CT=160 mg·min/L pentru 99,9% inactivare). Filtru: curățare sau înlocuire. Backwash complet."},
        {q:"Ce investigații medicale pentru cei 127 de bolnavi? Tratament specific?",h:"Coproparazitologie: oociste Criptosporidium (colorație Ziehl-Neelsen modificată). Tratament: Nitazoxanid 500mg × 2/zi, 3 zile (imunocompetenți). Imunocompromiși: severă, necesită tratament antiretroviral dacă HIV+."},
        {q:"Ce modificări tehnice impuneți piscinei pentru prevenirea recurenței?",h:"Instalare UV obligatoriu (HG 546/2008 piscine). Backwash filtru: minimum săptămânal. Monitorizare turbiditate continuă (<0,5 NTU). Interzicere scutece în piscine principale. Piscine speciale copii cu dezinfecție separată."},
      ], conc:["Motivul rezistenței la clor","Modificarea tehnică obligatorie","Protocolul de decontaminare"] },

    { id:"g4", emoji:"🌿", title:"Nitriți în apă — accident tehnologic la stație", color:"#16a34a",
      caz:[{l:"Locație",v:"Stație de tratare apă, avarie pompe doze"},{l:"Nitrați inițiali",v:"45 mg/L"},{l:"Doze coagulant",v:"eroare: doză × 5 supradozare"},{l:"Nitriți post-accident",v:"0,8 mg/L (norma max: 0,5 mg/L)"},{l:"pH post-accident",v:"9,2 (urcare bruscă)"},{l:"Distribuție",v:"rețea livrată 3h înainte de detectare"}],
      qs:[
        {q:"Explicați cum a dus supradozarea coagulantului la creșterea nitriților.",h:"Coagulantul (sulfat de aluminiu) în exces acidifică apa → bacterii nitrificante inhibate → acumulare NH4+ → oxidare parțială → NO2-. SAU: contaminare încrucișată cu soluție nitrit din procese de curățare instalații."},
        {q:"Apa cu 0,8 mg/L nitriți a fost deja distribuită 3 ore. Ce acțiuni luați IMEDIAT?",h:"1. Întrerupere distribuție. 2. Alertă urgentă DSP. 3. Comunicat public via radio/TV/SMS. 4. Interdicție consum (în special sugari + gravide). 5. Distribuire apă de urgență (cisterne/îmbuteliată)."},
        {q:"Identificați populația cu risc major și explicați mecanismul de toxicitate.",h:"Sugari <6 luni: methemoglobinemie. NO2 → MetHb → cianoză → stop respirator la >30% MetHb. Gravide: MetHb fetală. Adulți imunocompromiși. Simptome: cianoză peribucală, oboseală extremă, 'copil albastru'."},
        {q:"Ce tratament aplicați la stație pentru a reduce rapid nitriții?",h:"Corecție pH la 7-7,5 (acid sulfuric). Clorare punctuală (oxidare NO2 → NO3). Diluție prin amestecare cu apă conformă. Filtrare suplimentară cu carbon activ. Verificare analitică înainte reintroducere în rețea."},
        {q:"Ce modificări procedurale implementați pentru prevenirea recurenței?",h:"Blocare automată distribuție la deviație parametri. Senzori in-line NO2/pH cu alarmă. Proceduri SOPs pentru dozare chimicale cu dublu control. Stocuri separate chimicale (prevenire confuzie). Instruire anuală personal."},
        {q:"Ce răspundere legală are directorul stației de tratare?",h:"Răspundere administrativă (HG 458/2002). Răspundere penală dacă se dovedesc neglijență sau daune (art. 359 Cod penal — zădărnicirea combaterii bolilor). Răspundere civilă dacă apar cazuri medicale. Notificare obligatorie MS + DSP."},
      ], conc:["Acțiunea imediată după detectare","Populația cu risc maxim","Modificarea de procedură pentru prevenire"] },

    { id:"g5", emoji:"💊", title:"Microcontaminanți farmaceutici în râu", color:"#8b5cf6",
      caz:[{l:"Locație",v:"Râu receptor — aval spital și stație epurare"},{l:"Diclofenac",v:"2,8 µg/L (norma orientativă EQS: 0,05 µg/L)"},{l:"Etinilestradiol (EE2)",v:"0,9 ng/L (EQS: 0,035 ng/L)"},{l:"Carbamazepina",v:"1,2 µg/L (persistentă)"},{l:"Sursă",v:"stație epurare nu elimină microcontaminanți"},{l:"Efecte observate",v:"pești cu intersex (feminizare masculi) 45%"}],
      qs:[
        {q:"Calculați factorii de depășire pentru fiecare contaminant față de normele EQS.",h:"Diclofenac: 2,8/0,05 = 56×. EE2: 0,9/0,035 = 25,7×. Ambii depășiți masiv. Carbamazepina: fără EQS stabilit dar persistent, bioaccumulare. EE2 = cel mai periculos endocrin disruptor."},
        {q:"Ce mecanism explică feminizarea la 45% din peștii masculi?",h:"EE2 (estrogen sintetic din contraceptive) = endocrin disruptor potent. Se leagă de receptorii estrogenici la pești (ER-α, ER-β). Induce producere vitelogenină la masculi (proteină exclusiv femelă). Intersex = malformații gonadale."},
        {q:"Stația de epurare clasică elimina acești compuși? De ce nu?",h:"Tratare convențională (decantare + filtrare biologică + clorare) elimină <20-40% din microcontaminanți. Compuși lipofili sau rezistenți degradare biologică. Soluții avansate: ozonare + carbon activ granular (GAC)."},
        {q:"Apa din râu este folosită pentru irigații agricole. Ce risc generează pentru consumator?",h:"Acumulare în sol → preluare în plante (legume frunzoase). EE2 și carbamazepina = bioaccumulare în lanțul trofic. Efect endocrin la om la expunere cronică: risc cancere hormono-dependente (sân, prostată)."},
        {q:"Ce măsuri preventive recomandați spitalului pentru reducerea emisiilor?",h:"Pre-tratare efluent spital înainte evacuare în canalizare (bioreaktor cu membrana MBR + UV). Protocol de eliminare medicamente expirate (NU la toaletă). Prescripție rațională (reducere consum = reducere emisii)."},
        {q:"Ce reglementare europeană abordează microcontaminanții farmaceutici?",h:"Directiva 2013/39/UE (substanțe prioritare în apă) — EQS. Directiva 2020/2184 (apă potabilă) — include microcontaminanți. Regulamentul 2024 farmaceutice în mediu. Strategia Farmaceutică UE 2020."},
      ], conc:["Contaminantul cu risc maxim și factorul de depășire","Mecanismul efectului ecotoxic","Tehnologia de tratare recomandată"] },

    { id:"g6", emoji:"🏗️", title:"Dezinfecție cu clor — subproduse periculoase", color:"#dc2626",
      caz:[{l:"Locație",v:"Stație tratare apă potabilă, oraș industrial"},{l:"Clor rezidual",v:"0,6 mg/L (normă: 0,1-0,5 mg/L) — ușor peste"},{l:"Trihalometane (THM)",v:"128 µg/L (norma max: 100 µg/L)"},{l:"Cloroform (principal THM)",v:"78% din THM total"},{l:"Materie organică naturală",v:"COT = 8,2 mg/L (crescut — apă din turbă)"},{l:"pH",v:"8,1 (alcalin — favorizează formare THM)"}],
      qs:[
        {q:"Explicați mecanismul formării THM și de ce pH 8,1 și COT 8,2 favorizează producerea lor.",h:"THM = reacție Cl2 + materie organică naturală (acizi humici/fulvici). La pH >7,5 predomină cloroformul. COT crescut = mai mult substrat pentru reacție. Temperatura >20°C și timp contact crescut = factor aditional."},
        {q:"Cloroformul 78% din THM — ce risc specific implică pentru consumatorii cronici?",h:"Cloroform (CHCl3): IARC Grupa 2B (posibil carcinogen). Hepatotoxic + nefrotoxic cronic. Risc cancer hepatic și vezică urinară la expunere >10 ani. Inhalare duș = cale suplimentară (volatilizare)."},
        {q:"Calculați excesul față de normă și estimați riscul de cancer pe 70 ani (model liniar).",h:"THM: 128/100 = 1,28× depășire. Risc incremental cancer: slope factor CHCl3 = 6,1×10-3 (mg/kg/zi). Doză: 2L/zi × 78µg/L / 70kg = 0,0022 mg/kg/zi. Risc = 0,0022 × 6,1×10-3 = 1,3×10-5/an (acceptabil <10-5)."},
        {q:"Ce modificări ale procesului de tratare reduc THM fără a compromite dezinfecția?",h:"Reducere doză clor (menținând >0,1 mg/L rezidual). Reducere COT: coagulare optimizată + carbon activ granular (GAC). Coborâre pH la 7,0-7,5 înainte clorare. Ozonare ca dezinfecție primară (nu formează THM). Cloramine în loc de clor liber."},
        {q:"Ce alternative la clorare există și ce avantaje/dezavantaje prezintă?",h:"Ozon: eficient vs. Crypto, nu THM, dar costisitor + formează bromate. UV: nu THM, eficient viral, dar fără rezidual în rețea. ClO2: eficient vs. biofilm, puțin THM, dar risc clorit. Combinație ozon + clor = standard modern."},
        {q:"Consumatorii trebuie informați? Ce recomandări practice le dați?",h:"Informare obligatorie dacă THM >100 µg/L. Recomandări: filtrare carbon activ la robinet (reduce THM >90%). Aerare apă 30 min înainte consum (volatilizare cloroform). Ducșuri scurte cu ventilație (reducere inhalare). Apă rece filtrată > apă caldă."},
      ], conc:["Cauza depășirii THM","Modificarea procesului prioritară","Recomandarea practică pentru consumatori"] },
  ],

        {q:"Calculați IMC și clasificați stadiul obezității conform OMS.",h:"IMC = 98/(1,62²) = 98/2,624 = 37,3 kg/m². Obezitate gradul II (clasa II): IMC 35-39,9. Risc cardiovascular ÎNALT."},
        {q:"Evaluați distribuția adipozității. Ce tip de obezitate este și ce risc implică?",h:"CA 107cm > 88cm (norma femei) = obezitate abdominală (viscerală). Grăsimea viscerală = metabolic activă → inflamație cronică → IR, DZ tip 2, risc CV. Mai periculoasă decât obezitatea gluteo-femurală."},
        {q:"Calculați necesitatarul caloric de bază (Harris-Benedict) și pentru scădere în greutate.",h:"BMR (femei) = 655 + 9,6×98 + 1,8×162 - 4,7×52 = 655+940,8+291,6-244,4 = 1643 kcal/bază. Activitate sedentară × 1,2 = 1971 kcal/zi necesar. Deficit 500 kcal/zi = 1471 kcal → 0,5 kg/săptămână pierdere."},

    { id:"g2", emoji:"📐", title:"Malnutriție proteino-calorică — pacient vârstnic spitalizat", color:"#dc2626",

      qs:[
        {q:"Stabiliți diagnosticul nutritional conform criteriilor GLIM (Global Leadership Initiative).",h:"GLIM: ≥1 criteriu fenotipic + ≥1 criteriu etiologic. Fenotipic: IMC 17,2 (<18,5) ✓, pierdere >5% în 3 luni ✓, reducere masă musculară ✓. Etiologic: aport <50% necesar >1 săptămână ✓. DIAGNOSTIC: Malnutriție severă."},
        {q:"Albumina 2,6 g/dL — ce semnifică și ce alte markeri proteici utilizați?",h:"Albumina <3,5 = hipoproteinemie. Semiviatà 21 zile = marker nutrițional tardiv (reflectă săptămâni). Markeri mai rapizi: prealbumina (t1/2 2 zile), transferina (t1/2 8 zile), proteina C reactivă (stres inflamator scade albumina indiferent de nutriție)."},
        {q:"Calculați necesarul caloric și proteic pentru acest pacient.",h:"Necesar kcal: 25-30 kcal/kg × estimat 50kg = 1250-1500 kcal/zi. Necesar proteine: 1,2-1,5 g/kg/zi (catabolism + vârstnic) = 60-75g/zi. Actual: 800 kcal + probabil 20-30g proteine = deficit sever."},
        {q:"Disfagia limitează alimentația orală. Ce căi alternative de nutriție propuneți?",h:"Dacă disfagie parțială: modificare consistență (pastă, piure), produse hipercalorice orale (Ensure, Nutridrink 300 kcal/250mL). Dacă insuficient: sondă nazogastrică (NG) enteral. Dacă tract digestiv nefuncțional: nutriție parenterală centrală."},
        {q:"Ce riscuri specifice implică reinițierea agresivă a nutriției? Cum le preveniți?",h:"Sindrom refeeding: hipofosforemie severă (la 12-72h renutrire) → insuficiență cardiacă + neurologică. Prevenire: monitorizare fosfor, K, Mg zilnic primele 5 zile. Creștere graduală aport (25% din necesar ziua 1, +25% zilnic). Tiamina 100mg/zi."},
        {q:"Ce echipă multidisciplinară necesită managementul nutrițional al acestui pacient?",h:"Medic internist/geriatru (diagnostic). Dietetician (plan nutrițional + monitorizare). Logoped (evaluare + tratament disfagie). Kinetoterapeut (refacere masă musculară). Asistentă (administrare nutriție enterală + monitorizare toleranță)."},
      ], conc:["Diagnosticul GLIM stabilit","Calea de nutriție aleasă și justificarea","Riscul principal de evitat la renutrire"] },

        {q:"Identificați dezechilibrele față de recomandările actuale și consecințele lor.",h:"Hipercaloric (+36% față de necesar femei) → obezitate. Hiperprotein + hiperlipidic → risc renal, cardiovascular. Hipoglucidic (glucide rafinate probable) → fluctuații glicemice. Fibre 12 vs 25g = 50% deficit → constipație, risc cancer colon."},
        {q:"Ce metode de anchetă alimentară ați utilizat? Avantaje și limite.",h:"Recall 24h: rapid, neinvaziv, limitat de memorie, o zi nu = obicei. FFQ (frecvența consumului): reflectă obiceiuri cronice dar estimare cantitativă slabă. Jurnal alimentar 7 zile: cel mai precis dar complet schimbă comportamentul (hawthorne)."},
        {q:"Propuneți 5 recomandări nutriționale concrete pentru această populație.",h:"1. Reducere porție (nu dietă restrictivă). 2. Înlocuire grăsimi saturate cu ulei masline. 3. Creștere fibre: legume+fructe+leguminoase zilnic. 4. Înlocuire pâine albă cu integrală. 5. Reducere carne roșie la 2×/săptămână."},
        {q:"Ce markeri biologici de monitorizare recomandați pentru un studiu longitudinal de 2 ani?",h:"Biochimici: lipide (LDL, HDL, TG), glicemie, HbA1c, PCR-hs (inflamație), homocisteină, vitamina D. Clinici: IMC, CA, TA, forța musculară. Nutriționali: albumina, feritina, B12, folat."},
        {q:"Ce intervenție nutrițională la nivel de politică publică recomandați ministerului?",h:"Etichetare Nutri-Score obligatorie. Taxă zahăr/grăsimi saturate produse procesate. Subvenții legume/fructe în piețe. Educație nutrițională în școli (program OMS). Reformulare produse (reducere sare/zahăr cu industria)."},

        {q:"Calculați necesarul caloric real pentru antrenament 2h/zi (MET maraton = 11).",h:"BMR = 10×72+6,25×180-5×28+5 = 1771 kcal. Factor activitate: 1,9 (atletism intensiv). Total: 1771×1,9 = 3365 kcal/zi. Sportivul consumă 3200 < 3365 = deficit 165 kcal/zi = RED-S incipient."},
        {q:"Explicați mecanismul deficitului de fier la alergătorii de fond.",h:"3 mecanisme: 1. Hemoliză prin impact (foot-strike hemolysis) — lizare eritrocite la contact talpă-sol. 2. Pierderi GI (microhemoragii). 3. Aport insuficient (dieta hiperglucidică, fără carne). 4. Hepcidina crescută post-efort = absorbție Fe redusă 24h."},
        {q:"Ce protocol de suplimentare cu fier recomandați? Cum monitorizați eficiența?",h:"Sulfat feros 200mg × 2/zi între mese (a jeun = +30% absorbție) + vitamina C 500mg concomitent. Evitare ceai/cafea 1h. Monitorizare: feritina la 4, 8, 12 săptămâni (target >30). Hb control lunar. Dacă feritina nu crește: investigare celiachie/sângerări oculte."},
        {q:"Ce plan de hidratare elaborați pentru zi de competiție maraton (42km, 25°C)?",h:"Pre-competiție: 500mL apă cu 2h înainte. În cursă: 150-200mL la fiecare 15-20 min (stații apă). Băuturi izosmotice cu electroliți (Na 40-50mEq/L) dacă cursă >90 min. Post: 1,5L/kg pierdut (cântărire pre/post). Sodiu în alimentație post (prevenire hiponatremie)."},
        {q:"Ce sfaturi dietetice specifice pentru creșterea absorbției fierului?",h:"Surse heme Fe (carne roșie, organe): 2-3×/săptămână (15-35% absorbție). Surse non-heme (leguminoase, spanac): combinate cu vitamina C. Evitare: ceai, cafea, calciu cu masa bogată în Fe. Gătire în vase fier (adăugare Fe elemental)."},
      ], conc:["Diagnosticul nutrițional specific sportivului","Cauza deficitului de fier","Ținta feritinei la 3 luni"] },

      caz:[{l:"Pacient",v:"Sugar 9 luni, băiat"},{l:"Greutate",v:"7,2 kg (P10 — sub P25 normal)"},{l:"Talie",v:"69 cm (P25)"},{l:"Alimentație",v:"formule de lapte 3 × 200mL/zi + diversificare neîncepută"},{l:"Vitamina D",v:"18 ng/mL (insuficiență: <20)"},{l:"Fier seric",v:"8 µmol/L (norma: 9-30)"},{l:"Semne clinice",v:"fontanelă anterioară larg deschisă, mușchi hipotoni"}],
      qs:[
        {q:"Evaluați creșterea ponderală față de curbele OMS. Există retard de creștere?",h:"P10 greutate la 9 luni normal este ~8,2 kg (mediana). 7,2 kg = sub P10 = subponderal. Curba ponderală sub P10 = risc falimentul creșterii (failure to thrive). Necesară analiză tendință (velocitate creștere)."},
        {q:"Ce indică fontanela larg deschisă la 9 luni + hipotonie + vitamina D 18 ng/mL?",h:"Rahitism carențial: triada: fontanela larg deschisă (întârziere osificare), hipotonie musculară, vitamina D insuficientă. Confirmare: radiografie mâini (metafize în formă de cupă), fosfataza alcalină crescută, Ca/P scăzute."},
        {q:"Diversificarea neîncepută la 9 luni — ce consecințe nutritionale implică?",h:"Pierderea ferestrei de diversificare (4-6 luni optim). Deficit Fe: formulele acoperă nevoile, dar diversificarea adaugă Fe heme. Risc alergie alimentară crescut dacă diversificare întârziată >12 luni. Deficit Zn, Cu, vitamine liposolubile."},
        {q:"Calculați necesarul de vitamina D și fier pentru acest sugar.",h:"Vit D: 400-1000 UI/zi preventiv (1500-2000 UI/zi terapeutic în rahitism). Fier: 11 mg/zi (9-12 luni). Formulele conțin ~0,7 mg Fe/100mL × 600mL = 4,2mg/zi = INSUFICIENT (necesar 11mg). Necesară suplimentare."},
        {q:"Elaborați un plan de diversificare alimentară urgent pentru 9-12 luni.",h:"Startul: papă de cereale cu fier (orez, porumb). Legume pasate: morcov, cartofi, dovleac. Carne pasată (sursă Fe heme): vițel, pui → 2-3×/săptămână. Fructe pasate. Ou (gălbenuș). Evitare: sare, zahăr, miere, lapte vaci <1 an, pește ≤12 luni."},
        {q:"Când trimiteți sugarul la specialist și care? Ce consultații sunt necesare?",h:"Pediatru urgentă (rahitism + subponderal). Dietetician pediatric (plan alimentar). Nefrolog dacă Ca urinar crescut (supradozare Vit D). Reevaluare antropometrică la 2, 4, 8 săptămâni. Dacă greutate nu crește: investigare cauze organice (celiachie, intoleranță lapte)."},
      ], conc:["Diagnosticul nutrițional principal","Suplimentarea urgentă necesară","Primul aliment de diversificare recomandat"] },

        {q:"Calculați impactul economic al malnutriției pentru o secție de 24 paturi cu DMS 7 zile.",h:"Malnutriți: 12 pacienți × (+35% DMS) = 12 × 7 × 0,35 = 29,4 zile-pat extra/ciclu de pacienți. Cost zi spitalizare estimat ~500 lei → 14.700 lei extra/ciclu. Prevenție (suport nutrițional) = cost mult mai mic."},
        {q:"Ce protocol de nutriție clinică implementați pentru secție?",h:"1. Screening NRS-2002 la toți pacienții în primele 24h. 2. Evaluare completă dacă scor ≥3 (dietetician sau medic antrenat). 3. Plan nutrițional individualizat. 4. Monitorizare săptămânală greutate + albumina. 5. Suport nutrițional: oral → enteral → parenteral."},

        {q:"Ce rol are medicul de gardă în gestionarea nutriției pacientului spitalizat?",h:"Completare screening la internare. Prescrierea suportului nutrițional de urgență (dacă dietetician indisponibil). Monitorizare aport + toleranță. Notificare dietetician dacă scor ≥3. Educarea rezidentilor privind nutriția clinică."},
        {q:"Ce indicatori de calitate pentru nutriția clinică monitorizați la nivel de secție?",h:"% pacienți cu screening la 24h. % pacienți cu plan nutrițional documentat. Rata malnutriție la externare vs. internare. DMS malnutriți vs. non-malnutriți. Rata complicații infecțioase (corelate cu starea nutrițională). Raportat trimestrial."},

  lp4b: [
    { id:"g1", emoji:"🥩", title:"Carne tocată — suspiciune de falsificare și contaminare", color:"#dc2626",
      caz:[{l:"Produs",v:"Carne tocată de porc, lot 2024-11-A"},{l:"Aspect",v:"culoare roz-palidă, miros ușor acid"},{l:"pH măsurat",v:"6,4 (norma carne proaspătă: 5,8-6,2)"},{l:"Reacție Nessler",v:"pozitivă (NH3 prezent)"},{l:"Temperatura depozitare",v:"8°C (norma: max 4°C)"},{l:"Suspiciune",v:"adăugare apă + aditivi nedeclarați"}],
      qs:[
        {q:"Interpretați pH 6,4 față de norma pentru carne proaspătă de porc. Ce semnifică?",h:"pH >6,2 = carne alterată sau în curs de alterare (autolizare proteică → amine biogene). pH optim proaspăt: 5,8-6,0. Reacție Nessler pozitivă confirmă NH3 din descompunere proteică."},
        {q:"Temperatura 8°C vs norma 4°C — calculați impactul asupra multiplicării bacteriene.",h:"Zona periculoasă: 4-60°C. La 8°C rată multiplicare ~2× mai rapid vs 4°C. Dacă E. coli O157: 10→100 CFU/g în 3-4h la 8°C. Risc EHEC, Salmonella, Listeria."},
        {q:"Ce analize de laborator ordonați pentru confirmare falsificare și contaminare?",h:"Falsificare: PCR specii (detecție carne cal, MDM). Proteine non-carne: ELISA soia/gluten. Apă adăugată: determinare azot proteic (NPN). Contamiare: NTG, coliformi, Salmonella, E. coli, Listeria monocytogenes."},
        {q:"Reacția Nessler pozitivă — ce compuși indică și ce risc implică?",h:"Nessler detectează NH3 liber. Surse: descompunere aminoacizi (Enterobacteriaceae) → cadaverină, putresceină, histamină. Histamina >200mg/kg = intoxicație scombroidă (urticarie, cefalee, hipotensiune)."},
        {q:"Formulați decizia de inspector DSP/DSVSA privind lotul respectiv.",h:"Lot RETRAS din comercializare imediat. Notificare RASFF (dacă lot distribuit interregional). Amendă producător (Reg. CE 853/2004). Investigare lanț de producție. Probe contraexpertize. Informare consumatori dacă risc public."},
        {q:"Ce temperaturi de depozitare și timpi maximi sunt reglementați pentru carne tocată?",h:"Reg. CE 853/2004: carne tocată refrigerată: ≤2°C, max 12h producere→vânzare. Congelată: ≤-18°C. Carne tocată refrigerată NU se recongelează. Etichetare obligatorie: data preparare + 'A se consuma în ziua preparării'."},
      ], conc:["Concluzia privind prospeția cărnii","Decizia de inspector (retras/aprobat)","Analiza prioritară de laborator"] },

    { id:"g2", emoji:"🐔", title:"Salmonella în carne de pasăre — investigație focar", color:"#f59e0b",
      caz:[{l:"Situație",v:"12 cazuri de gastroenterită acută după banchet"},{l:"Simptome",v:"diaree, febră 38,5-39°C, greață, debut la 12-24h"},{l:"Aliment suspect",v:"pui la grătar, servit la temperatura camerei 3h"},{l:"Cultura coprocultura",v:"Salmonella Enteritidis (3 probe pozitive)"},{l:"Temperatura puiului",v:"servit la 18°C — răcit necorespunzător"}],
      qs:[
        {q:"Confirmați focarul. Ce criterii epidemiologice sunt îndeplinite?",h:"Focar confirmat: ≥2 cazuri + agent comun (Salmonella Enteritidis) + aliment comun (pui) + interval incubație consistent (12-24h). Curba epidemică = vârf unic → sursă comună punctuală (one-shot outbreak)."},
        {q:"Intervalul de incubație 12-24h este compatibil cu Salmonella? Explicați.",h:"DA. Salmonella: incubație 6-72h, tipic 12-36h. Doza infectantă: 10⁵-10⁸ UFC (mai mică la copii și imunocompromiși). Simptome: 4-7 zile. Purtători cronici posibili (bilă)."},
        {q:"Puiul servit la 18°C după 3h la temperatura camerei — explicați multiplicarea bacteriană.",h:"La 18°C (zona periculoasă): dublare Salmonella la ~30 min. 3h = 6 cicluri = 64× mai mulți germeni. Dacă inițial 10³ UFC/g → 6,4×10⁴ UFC/g. Doza infectantă depășită → toți consumatorii expuși la risc."},
        {q:"Ce temperatura minimă de gătire este obligatorie pentru carne de pasăre și de ce?",h:"Min 74°C în centrul termic (HACCP). La 74°C: Salmonella inactivată în <1 min. Culoare roz în centru = insuficient gătit. Temperatura internă verificată cu termometru cu sondă."},
        {q:"Ce investigații epidemiologice efectuați pentru anchetă completă?",h:"Ancheta alimentară: meniu complet, cine a consumat ce. Coproculturi toate cazurile + 5 purtători asimptomatici (personal bucătărie). Probe aliment (dacă disponibil). Probe suprafețe + mâini personal. Lanț de frig (înregistrări temperaturi)."},
        {q:"Ce sancțiuni și măsuri corective aplicați unității de alimentație publică?",h:"Suspendare temporară activitate dacă igienă gravă deficitară. Amendă (Legea 150/2004). Obligare HACCP complet. Instruire personal (temperaturi, răcire rapidă). Reevaluare la 30 zile. Notificare DSVSA + DSP."},
      ], conc:["Confirmarea focarul și vehicolul","Eroarea critică identificată în lanțul alimentar","Temperatura minimă de gătire obligatorie"] },

    { id:"g3", emoji:"🥛", title:"Lapte crud — brucelloză și calitate microbiologică", color:"#0ea5e9",
      caz:[{l:"Produs",v:"Lapte crud de vacă, fermă mică"},{l:"NTG la 30°C",v:"4,2×10⁶ UFC/mL (norma Reg. CE 853: ≤100.000)"},{l:"Celule somatice",v:"820.000/mL (norma: ≤400.000)"},{l:"Brucella abortus",v:"test Rose Bengal: pozitiv la 3 vaci din 12"},{l:"Utilizare actuală",v:"vânzare directă consumatori fără pasteurizare"},{l:"Simptome la un client",v:"febră ondulantă, artralgii — de 3 săptămâni"}],
      qs:[
        {q:"NTG 4,2×10⁶ vs norma 100.000 UFC/mL. Ce depășire și ce surse probabile?",h:"Depășire: 4,2×10⁶ / 10⁵ = 42×. Surse: igienă necorespunzătoare mulgere, echipamente contaminate, răcire insuficientă (>10°C), mamită subclinică (celule somatice crescute)."},
        {q:"Celule somatice 820.000/mL — ce indică și ce impact are asupra calității laptelui?",h:"Celule somatice >400.000 = mamită subclinică (inflamație uger). Indică Staphylococcus aureus, Streptococcus agalactiae. Lapte cu mamită: activitate proteazică crescută → degradare cazeină, termen scurt valabilitate."},
        {q:"Test Rose Bengal pozitiv la 3 vaci — ce risc pentru consumatori și ce acțiune luați?",h:"Brucella abortus transmisă prin lapte crud, brânzeturi netraitamenate → febră ondulantă la om (boală profesională pentru fermieri, zoonoză). ACȚIUNE IMEDIATĂ: interzicere vânzare lapte crud. Notificare DSVSA + DSP + medicul veterinar oficial."},
        {q:"Consumatorul cu febră ondulantă 3 săptămâni — cum confirmați diagnosticul?",h:"Serologie: test Rose Bengal, Wright (aglutinare), ELISA IgM/IgG. Hemocultură (B. abortus). Valori: Wright ≥1/80 = semnificativ. Tratament: doxiciclina 6 săptămâni + rifampicina (obligatoriu prelungit)."},
        {q:"Ce măsuri de control la sursă propuneți pentru această fermă?",h:"Vaccinare obligatorie bovine (RB51 sau S19). Testare anuală serologică efectiv. Separare animale pozitive + sacrificare (eradicare). Pasteurizare lapte (72°C/15s sau 63°C/30min). Autorizare fermă conform Reg. CE 853/2004."},
        {q:"Pasteurizarea garantează inactivarea Brucella? La ce parametri?",h:"DA. Brucella abortus: inactivată la 72°C/15s (HTST) sau 63°C/30min (LTLT). Pasteurizare corectă = eliminare Brucella, Salmonella, Listeria, M. tuberculosis. Lapte pasteurizat ≠ steril (NTG max 50.000/mL post-pasteurizare)."},
      ], conc:["Riscul zoonotic principal (agentul + transmiterea)","Acțiunea imediată privind laptele crud","Parametrii de pasteurizare corecți"] },

    { id:"g4", emoji:"🥚", title:"Ouă cu Salmonella — trasabilitate lanț alimentar", color:"#f97316",
      caz:[{l:"Context",v:"Lot de ouă, categorie A, fermă avicol"},{l:"Salmonella Typhimurium",v:"izolată din 3/10 mostre ouă"},{l:"Distribuție lot",v:"4 județe, 12 magazine, 8.000 ouă"},{l:"Data recoltare probe",v:"lot deja distribuit de 5 zile"},{l:"Codificare ouă",v:"1-RO-12345-07 (cod incomplet — lipsă dată ambalare)"},{l:"Contaminare",v:"transovarienă (interior ou) + suprafață coajă"}],
      qs:[
        {q:"Decodificați codul '1-RO-12345-07' și identificați ce informație lipsește.",h:"1=sistem creștere (0=bio, 1=liber, 2=sol, 3=baterie). RO=țara. 12345=codul fermei. 07=codul unității de ambalare. LIPSĂ: data ambalării (obligatorie Reg. CE 589/2008) → imposibil determinare durată valabilitate."},
        {q:"Contaminarea transovarienă vs de suprafață — ce implică pentru tratamentul ouălor?",h:"Transovarienă (interior): Salmonella Typhimurium trece prin ovarul găinii → gălbenuș contaminat. NU eliminată prin spălare coajă. Necesară gătire completă (gălbenuș solidificat, >70°C). Suprafață: spălarea industrială reduce riscul dar poate fragiliza cuticula."},
        {q:"8.000 ouă distribuite în 4 județe — ce procedură de retragere activați?",h:"Alertă RASFF (Rapid Alert System Food and Feed) — notificare obligatorie 24h. Retragere voluntară producător (Reg. CE 178/2002). Notificare magazine pentru retragere de pe raft. Comunicat public dacă risc nu poate fi controlat. Trasabilitate completă înainte-înapoi."},
        {q:"Ce temperaturi de gătire inactivează Salmonella în produse pe bază de ouă?",h:"Gălbenuș solidificat: min 70°C/2min. Omletă: 74°C. Ouă fierte tari: 15min apă fierbinte. RISC: maioneză casnică (ou crud), tiramisu, mousse au chocolat → soluție: ouă pasteurizate sau preparate cu ou tratat termic."},
        {q:"Ce obligații are producătorul/distribuitorul conform Reg. CE 178/2002?",h:"Trasabilitate: un pas în față + un pas înapoi. Obligație retragere imediată produse neconforme. Informare DSVSA + DSP. Cooperare cu ancheta oficială. Dacă risc sănătate publică: retragere + informare consumatori + comunicat."},
        {q:"Ce program de biosecuritate recomandați fermei pentru prevenirea Salmonella?",h:"Vaccinare găini ouătoare (vaccin Salmonella Typhimurium + Enteritidis — obligatoriu EU). Monitoring lunar cloace + mediu. Igienă adăpost: dezinfecție golire + 2 săptămâni pauză. Controlul rozătoarelor (vector major). Apa potabilă verificată."},
      ], conc:["Tipul de contaminare și implicația pentru gătire","Procedura de retragere activată","Măsura de biosecuritate prioritară la fermă"] },

    { id:"g5", emoji:"🐟", title:"Pește — histamina și lanțul frigorific", color:"#0891b2",
      caz:[{l:"Produs",v:"Ton proaspăt, import, 200kg"},{l:"Histamina",v:"380 mg/kg (norma Reg. CE 2073: max 100 mg/kg)"},{l:"Temperatura la recepție",v:"6°C (norma pește proaspăt: 0-2°C)"},{l:"Temperatura în transport",v:"înregistrare data logger: max 11°C pe 8h"},{l:"Aspect",v:"normal — fără miros neplăcut evident"},{l:"Simptome raportate",v:"2 clienți: urticarie, cefalee, flush, greață la 30 min după consum"}],
      qs:[
        {q:"Confirmați intoxicația scombroidă. Ce legătură există între histamina crescută și simptome?",h:"Intoxicație scombroidă confirmată: histamina 380 mg/kg (>200 = toxicitate probabilă). Mecanism: histidina liberă din musculatura tonului → decarboxilare de bacterii histaminogene (Morganella, Proteus, Klebsiella) la T>4°C → histamina → eliberare mastocitară → simptome alergiforme."},
        {q:"Temperatura 11°C timp de 8h — calculați impactul asupra producției de histamină.",h:"Histamina se produce exponențial la >4°C. La 10-15°C: producție maximă (bacterii mezofile). 8h la 11°C = producție masivă histamina dacă nivel inițial bacterian ridicat. Histamina este TERMOREZISTENTĂ — gătirea/congelarea nu o distruge!"},
        {q:"Tonul arată normal fără miros — de ce este periculoasă această caracteristică?",h:"Histamina nu modifică aspect/miros la concentrații toxice. Peștele poate fi organoleptic 'normal' la >200mg/kg histamina. Imposibil de detectat vizual/olfactiv → singura metodă: analiză chimică (ELISA sau HPLC). Risc pentru consumator care apreciază 'freschețea' vizual."},
        {q:"Ce decizie luați privind întregul lot de 200kg? Justificați.",h:"Lot RESPINS integral. Histamina termorezistentă → gătire nu rezolvă problema. Trasabilitate: identificare furnizor + alte loturi. Notificare RASFF. Distrugere sub supraveghere oficială. Amendă importator (nerespectare lanț frigorific → Reg. CE 853/2004)."},
        {q:"Ce sistem de monitorizare al lanțului frigorific impuneți pentru import pește?",h:"Data logger obligatoriu în fiecare transport (înregistrare continuă). Verificare la recepție: temperatura externă + temperatura centru produs. HACCP punct critic: temperatura ≤2°C de la pescuit la vânzare. Documentație temperaturi arhivată 5 ani."},
        {q:"Ce tratament medical s-a aplicat celor 2 clienți? Ce prognoza au?",h:"Antihistaminice (cetirizina 10mg, difenhidramina) → ameliorare rapidă. Cazuri severe: adrenalina (anafilaxie). Prognoza excelentă — intoxicație scombroidă autolimitată 12-24h. NU alergice la pește (confirmat prin test cutanat după episod). Raportare DSVSA obligatorie."},
      ], conc:["De ce aspectul normal al peștelui nu garantează siguranța","Decizia privind lotul","Temperatura obligatorie de transport"] },

    { id:"g6", emoji:"🧀", title:"Brânzeturi — Listeria monocytogenes în produse maturate", color:"#7c3aed",
      caz:[{l:"Produs",v:"Brânză cu mucegai tip Brie, maturată 30 zile"},{l:"Listeria monocytogenes",v:"detectată: 1.200 UFC/g (norma: 0 UFC/g în produse RTE)"},{l:"Unitate producție",v:"temperaturi maturaree 12°C, umiditate 95%"},{l:"Populație cu risc",v:"gravidă 7 luni a consumat 50g cu 10 zile în urmă"},{l:"pH produs",v:"7,2 — favorabil multiplicare Listeria"},{l:"Lot distribuit",v:"3 județe, 450 pachete"}],
      qs:[
        {q:"Listeria în produs RTE (ready-to-eat) — de ce toleranța este zero (0 UFC/g)?",h:"RTE = consumat fără tratament termic ulterior. L. monocytogenes: doza infectantă mică (<1000 UFC) la gravide/imunocompromiși. Mortalitate listerioza: 20-30% (cea mai letală bacterie alimentară). Reg. CE 2073/2005: 0 UFC/g produse RTE pentru L. monocytogenes."},
        {q:"Gravida a consumat 50g cu 10 zile în urmă. Ce risc specific și ce acțiune luați?",h:"Risc: listerioza neonatală (prematuritate, avort, meningită neonatală). Incubație: 1-90 zile (medie 3 săptămâni). 10 zile = în fereastră de incubație. URGENT: contact medical imediat. Monitorizare fetală ecografică. Tratament profilactic: amoxicilina 3g/zi × 3 săptămâni dacă expunere confirmată."},
        {q:"Temperatura 12°C și umiditate 95% — de ce favorizează Listeria față de alți patogeni?",h:"Listeria: crește la 0-45°C, optim 30-37°C, dar multiplicare semnificativă și la 4°C (frigider!). Umiditate 95% + pH 7,2 = condiții optime. Spre deosebire de Salmonella (oprită la <7°C), Listeria este criofilă → risc specific în produse maturate la frig."},
        {q:"Ce modificări ale procesului de producție eliminați riscul de Listeria?",h:"Igienizare riguroasă suprafețe maturaree (biofilm Listeria persistent pe inox/lemn). Temperaturi maturaree ≤8°C (reduce multiplicare). Testare mediu de maturaree săptămânal. Tratament suprafață cu nisiprin, listerin sau UV. Verificare lunar NTG + Listeria în produs finit."},
        {q:"Ce protocol de retragere activați pentru cele 450 de pachete?",h:"Alertă RASFF imediată (L. monocytogenes în RTE = risc sever). Retragere piață + comunicat public (gravide + imunocompromiși). Blocare lot + distrugere supravegheată. Suspendare autorizare sanitară unitate până la remediere. Anchetă epidemiologică dacă alte cazuri."},
        {q:"Ce grupe de populație sfătuiți să evite brânzeturile cu mucegai extern și de ce?",h:"EVITARE absolută: gravide, imunocompromiși (HIV, chimioterapie, transplant), vârstnici >65 ani, sugari. Alternativă sigură: brânzeturi procesate termic (topite), brânzeturi proaspete pasteurizate. Campanie IEC (informare-educare-comunicare) de la DSP."},
      ], conc:["De ce toleranța zero pentru Listeria în RTE","Acțiunea urgentă pentru gravidă","Modificarea procesului prioritară"] },
  ],

  lp5a: [
    { id:"g1", emoji:"🥦", title:"Pesticide pe legume proaspete — piață agroalimentară", color:"#16a34a",
      caz:[{l:"Produs",v:"Căpșuni, lot 50kg, producător local"},{l:"Cloropirifos",v:"1,8 mg/kg (LMR: 0,01 mg/kg)"},{l:"Imidacloprid",v:"0,22 mg/kg (LMR: 0,05 mg/kg)"},{l:"Aspect",v:"normal, proaspete, fără urme vizibile"},{l:"Declarație producător",v:"'nu am folosit pesticide'"},{l:"Consum estimat",v:"copii 4-8 ani, 100-200g/zi"}],
      qs:[
        {q:"Calculați depășirile față de LMR pentru ambele substanțe. Ce clasificare au?",h:"Cloropirifos: 1,8/0,01 = 180× LMR. Imidacloprid: 0,22/0,05 = 4,4× LMR. Cloropirifos: IARC 2A (probabil carcinogen), neurotoxic (inhibă acetilcolinesteraza). Imidacloprid: neonicotinoid, neurotoxic, interzis outdoor UE din 2018."},
        {q:"De ce copiii de 4-8 ani sunt grupul de risc maxim pentru reziduuri de pesticide?",h:"Copii: greutate corporală mică → doză/kg mai mare. Aport fructe/kg corporală 3-5× mai mare decât adulți. Sistem nervos în dezvoltare → neurotoxicitate la doze mai mici. Metabolism mai lent al xenobioticelor. Consum mai mare timp indoor → acumulare."},
        {q:"Calculați doza zilnică pentru un copil de 20kg care consumă 150g căpșuni cu 1,8mg/kg cloropirifos.",h:"Aport zilnic = 150g × 1,8mg/kg / 1000 = 0,27 mg. Doza/kg = 0,27/20 = 0,0135 mg/kg/zi. ADI cloropirifos (EFSA 2019): 0,0001 mg/kg/zi (retras). Depășire ADI de 135×! → risc neurotoxic sever."},
        {q:"Ce acțiuni legale luați față de producătorul care declară 'nu am folosit pesticide'?",h:"Contradicție flagrantă cu analizele. Probe suplimentare sol + apă + alte culturi (posibil contaminare din vecinătate). Dacă pesticide aplicate: amendă + interdicție comercializare + sesizare MADR. Dacă contaminare de la vecini: anchetă + despăgubire. Notificare RASFF dacă lot distribuit larg."},
        {q:"Ce metode de reducere a reziduurilor de pesticide recomandați consumatorilor?",h:"Spălare sub jet apă curentă 30s: reduce 30-80% pesticide de suprafață. Periuță pentru fructe groase. Curățare coajă (reduce 80-90% dar pierde vitamine). Înmuiere în bicarbonat 0,1% 15min: eficient vs organofosfați. Cumpărare produse certificate ECO (control regulat)."},
        {q:"Ce sistem de monitorizare propuneți MADR pentru reziduuri de pesticide în piețe?",h:"Program PNCR (Plan Național Control Reziduuri) — obligatoriu UE. Sampling aleator 5% loturi. Laboratoare acreditate RENAR. Baza de date națională. Publicare anuală rezultate. Praguri de alertă pentru acțiune rapidă. Cooperare cu OLAF pentru importuri ilegale."},
      ], conc:["Depășirile față de LMR calculate","Riscul specific pentru copii","Metoda de reducere a reziduurilor la domiciliu"] },

    { id:"g2", emoji:"🌽", title:"Micotoxine în cereale — aflatoxine și fumonisine", color:"#d97706",
      caz:[{l:"Produs",v:"Porumb boabe, lot 2 tone, depozit"},{l:"Aflatoxina B1",v:"18 µg/kg (norma CE: max 5 µg/kg cereale alimentare)"},{l:"Fumonisine (B1+B2)",v:"3.200 µg/kg (norma CE: max 4.000 — în limită)"},{l:"Umiditate cereale",v:"19% (norma depozitare: max 14%)"},{l:"Temperatura depozit",v:"22°C, ventilare insuficientă"},{l:"Aspect",v:"mucegai vizibil pe 15% din boabe"}],
      qs:[
        {q:"Calculați depășirea aflatoxinei B1 față de normă. Ce risc specific implică?",h:"18/5 = 3,6× depășire. Aflatoxina B1: IARC Grupa 1 (carcinogen uman cert), cancerul hepatocelular. Doză cancerigenă la 1-10 ng/kg/zi expunere cronică. Și hepatotoxică acută la doze mari (aflatoxicoză). Termorezistentă — gătirea nu o distruge."},
        {q:"Umiditatea 19% — de ce favorizează producerea de micotoxine față de 14%?",h:"Aspergillus flavus (producător aflatoxine): crește la aw >0,80 (corespunde ~15% umiditate cereale). La 19%, aw ~0,90 = multiplicare rapidă + producție toxine accelerată. La <14% (aw <0,70): Aspergillus nu se multiplică. Umiditate = factor critic HACCP în silozuri."},
        {q:"Fumonisina la 3.200 µg/kg — aproape de limita 4.000. Ce organ-țintă vizează?",h:"Fumonisinele: inhibă sinteza sfingolipidelor. Organ țintă: ficat (hepatotoxice), rinichi (nefrotoxice). IARC Gr. 2B (posibil carcinogen). La animale: leucoencefalomacie la cai, edem pulmonar la porci. La om: corelat cu cancer esofagian în Africa de Sud (expunere cronică)."},
        {q:"Ce decizie luați privind cei 2 tone de porumb? Pot fi redirectionate ca furaj?",h:"RESPINS pentru consum uman (aflatoxina B1 18 > 5 µg/kg). Pentru furaj: norma UE este mai permisivă (aflatoxina B1 max 20 µg/kg). Dar fumonisine 3.200 > norma furaj vaci 50.000 → ok furaj. Decizie: redirecționare furaj posibilă NUMAI dacă aflatoxina <20. La 18 → posibil. Recomandare: distrugere dacă mucegai extins."},
        {q:"Ce condiții de depozitare impuneți silozului pentru prevenirea micotoxinelor?",h:"Uscare cereale la <14% umiditate ÎNAINTE depozitare. Temperatură depozit <15°C. Ventilare continuă (aerare activă). Monitoring umiditate + temperatură săptămânal. Fumigație preventivă. Inspecție vizuală lunară. HACCP specific depozitare cereale."},
        {q:"Ce informații trebuie incluse în eticheta lotului de cereale tratat cu aflatoxine?",h:"Lotul cu aflatoxine >5 µg/kg NU poate fi etichetat pentru consum uman — retras. Pentru furaj: notă 'pentru uz furajier'. Trasabilitate obligatorie: număr lot, dată recoltă, umiditate la recoltă, condiții depozitare. Documentație raportata ANSVSA."},
      ], conc:["Decizia privind lotul (consum uman/furaj/distrugere)","Factorul de risc principal în depozitare","Organul-țintă specific al aflatoxinei"] },

    { id:"g3", emoji:"🌿", title:"Nitrați în legume cu frunze — spanac baby", color:"#059669",
      caz:[{l:"Produs",v:"Spanac baby, ambalat, seră"},{l:"Nitrați",v:"4.800 mg/kg (norma UE spanac seră: max 3.000 mg/kg)"},{l:"Nitriți",v:"35 mg/kg (norma UE: max 0,2 mg/kg procesate!)"},{l:"Vânzare",v:"piureuri pentru sugari — PERICOL!"},{l:"Sezon",v:"iarnă — lumina redusă, fertilizare N intensivă"},{l:"pH piureu",v:"6,8 — favorizează conversia NO3→NO2"}],
      qs:[
        {q:"Calculați depășirile și explicați de ce nitritul (35 mg/kg) este mai periculos decât nitratul.",h:"Nitrați: 4800/3000 = 1,6×. Nitriți: 35/0,2 = 175× depășire! Nitritul oxidează Hb→MetHb direct (fără transformare bacteriană necesară ca pentru nitrați). Doză periculoasă NoAEL nitrit la sugar: 0,1 mg/kg/zi. PERICOL IMEDIAT."},
        {q:"De ce spanacul de seră în iarnă acumulează mai mulți nitrați decât vara?",h:"Lumina scăzută iarnă → reducere nitrați în plantă prin fotosinteză insuficientă (nitrat reductaza necesită lumină). Fertilizare N intensivă în seră → acumulare NO3 în vacuole celulare. Spanacul, salata, sfecla = acumulatori de nitrați."},
        {q:"Piureuri pentru sugari din spanac cu 35 mg/kg nitriți — ce risc acut?",h:"Methemoglobinemie acută la sugar (sindromul 'copilului albastru'). Semne: cianoză centrală, tahicardie, letargie, SpO2 scăzut. LA 35 mg/kg × 150g piureu/zi = 5,25 mg nitrit/zi. Sugar 5kg → 1,05 mg/kg/zi vs NoAEL 0,1 = 10,5× doza periculoasă."},
        {q:"Ce acțiuni imediate luați față de producătorul care vinde piureuri de spanac pentru sugari?",h:"RETRAGERE IMEDIATĂ + alertă RASFF. Interzicere comercializare. Comunicat public urgent (gravitate maximă). Sesizare ANSVSA + DSP. Dacă cazuri de methemoglobinemie: anchetă epidemiologică urgentă. Amenzi maxime + suspendare activitate."},
        {q:"Ce recomandări practice privind spanacul dați părinților?",h:"NU spanac proaspăt la sugari <6 luni. NU piureu spanac >1 dată/zi la 6-12 luni. Spanac proaspăt: fierbere + aruncarea apei de fierbere (reduce NO3 cu 50%). Preferabil spanac de vară (lumina normală). Verificare etichetă 'pentru sugari' = norme mai stricte."},
        {q:"Ce măsuri agrotehnice reduc conținutul de nitrați în spanacul de seră?",h:"Reducere doza de N cu 30% ultimele 2 săptămâni înainte recoltare. Iluminare artificială (lampi sodiu) în seră iarna. Recoltare dimineața (nitrați mai scăzuți după noapte). Irigare suficientă (diluție). Rotarea parcelelor."},
      ], conc:["Riscul specific pentru sugari (mecanism)","Acțiunea imediată privind piureurile","Recomandarea practică pentru părinți"] },

    { id:"g4", emoji:"🍄", title:"Ciuperci sălbatice — intoxicație cu amanitine", color:"#854d0e",
      caz:[{l:"Pacienți",v:"Familie 4 persoane, spitalizate"},{l:"Simptome",v:"Faza I (0-24h): greață, vărsături, diaree. Faza II (24-72h): ameliorare aparentă. Faza III: insuficiență hepato-renală acută"},{l:"Anamneza",v:"consum ciuperci culese din pădure, identificate ca 'hriburi'"},{l:"Analize",v:"ALT 1.840 UI/L, AST 2.100 UI/L, INR 4,2"},{l:"Agent suspectat",v:"Amanita phalloides (pălăria morții)"}],
      qs:[
        {q:"Descrieți evoluția în 3 faze a intoxicației cu Amanita phalloides. De ce Faza II este înșelătoare?",h:"Faza I: sindrom gastrointestinal (0-24h) — amatoxine nu au ajuns la ficat. Faza II: ameliorare aparentă (24-72h) — amatoxinele se fixează pe hepatocite, sunt silențios distructive. Faza III: citoliză masivă (ALT >1000×), insuficiență hepato-renală, CID. Mortalitate 10-30%."},
        {q:"ALT 1.840 și AST 2.100 UI/L — interpretați și ce implică pentru prognostic.",h:"ALT/AST normale: <40 UI/L. ALT 1840 = 46× normal. AST 2100 = 52× normal. Hepatocitoliză masivă. INR 4,2 (normal <1,2) = insuficiență hepatică severă (factor V <20% = candidat transplant hepatic urgentă). Fără tratament: deces în 5-7 zile."},
        {q:"Identificați Amanita phalloides morfologic și explicați confuzia cu hribii.",h:"A. phalloides: pălărie verde-gălbuie, lamele albe (nu brune ca hribii), volva în sol (baza bulboasă), inel. Confuzie cu Agaricus campestris (ciupercă de câmp) sau Boletus (hribi). RISC: o singură ciupercă (30g) = doza letală pentru adult."},
        {q:"Ce tratament de urgență aplicați în primele 24h de la consum?",h:"Spălătură gastrică (dacă <4h post-consum). Cărbune activat 50g × 4/zi (adsoarbe amatoxine în intestin). Penicilina G IV 10⁶ UI/kg/zi (blochează captarea hepatică). N-acetilcisteina IV. Silibinina IV (Legalon SIL) — reduce recaptarea amatoxinelor de către hepatocite. Monitorizare funcție hepatică la 6h."},
        {q:"Familia a mai oferit ciuperci unor vecini. Ce acțiuni luați?",h:"Identificare urgentă toți consumatori ciupercilor (inclusiv asimptomatici — pot fi în Faza I sau II). Internare TOȚI pentru monitoring hepatic 72h (chiar asimptomatici). Dacă ciuperci rămase: identificare micologică urgentă. Alertă DSP + spital."},
        {q:"Ce campanie de prevenție propuneți pentru reducerea intoxicațiilor cu ciuperci sălbatice?",h:"Educație: 'Culegeti NUMAI ciuperci cunoscute cu certitudine' — regula de aur. Poster cu specii periculoase în farmacii, cabinete. Aplicație mobilă identificare (cu rezerve!). Centre de consultanță micologică la DSP. Informare că fierberea NU distruge amatoxinele!"},
      ], conc:["Faza clinică critică și de ce este înșelătoare","Tratamentul de urgență în primele 24h","Regula de aur în culegerea ciupercilor"] },

    { id:"g5", emoji:"🥕", title:"Alergeni nedeclarați în produse vegetale procesate", color:"#ea580c",
      caz:[{l:"Produs",v:"Supa cremă de legume, ambalată, restaurant"},{l:"Incident",v:"Client cu alergie la arahide — șoc anafilactic sever după consum"},{l:"Etichetă",v:"nu menționează arahide"},{l:"Investigare rețetă",v:"ulei de arahide folosit la sotare"},{l:"EpiPen",v:"pacientul nu îl avea la el"},{l:"Stare",v:"ATI, stabil după adrenalina administrată de ambulanță"}],
      qs:[
        {q:"Ce obligații legale are restaurantul privind declararea alergenilor?",h:"Reg. UE 1169/2011: 14 alergeni majori obligatoriu declarați (inclusiv arahide). Pentru alimentație colectivă: informare verbală sau scrisă disponibilă pentru fiecare preparat. Sancțiune: amendă 5.000-10.000 lei + răspundere civilă pentru daune."},
        {q:"Descrieți mecanismul șocului anafilactic și de ce arahidele sunt alergeni potanți.",h:"IgE specific arahide → mastocite + bazofile → degranulare → histamina + triptaza + leucotriene → vasodilatație masivă + bronhospasm + edem laringian + hipotensiune → colaps cardiovascular în minute. Proteinele arahidelor (Ara h 1-9) = alergene extrem de stabile termic."},
        {q:"Uleiul de arahide rafinat este alergen? Explicați și ce înseamnă pentru etichetare.",h:"Ulei arahide RAFINAT: proteine reziduale minime → risc redus (tolerați de 85% alergici). Ulei NERAFINAT (crud, 'virgin'): conține proteine → ALERGEN! Reg. 1169/2011: uleiul rafinat de arahide ESTE EXCEPTAT de la declarare obligatorie. Dar dacă există risc: declararea voluntară = bună practică."},
        {q:"Ce pași urmăriți în ancheta de securitate alimentară post-incident?",h:"Investigare rețetă completă (toți ingredienții). Verificare etichetare furnizori ingrediente (contaminare încrucișată). Probe produse pentru analiză alergeni (ELISA kit arahide). Raport DSP. Suspendare preparat până clarificare. Verificare registru alergeni restaurant (obligatoriu conform Ord. MS)."},
        {q:"Ce protocol de urgență pentru anafilaxie trebuie implementat de restaurant?",h:"Personal instruit să recunoască anafilaxia. EpiPen disponibil (kit urgență). Protocol: 1) Adrenalina 0,3-0,5mg IM coapsă. 2) Apel 112. 3) Decubit dorsal + picioare ridicate. 4) Oxigen. Instructaj anual personal + afișaj vizibil. Nu substituibil cu antihistaminice (nu tratează șocul anafilactic)."},
        {q:"Cum reduceți riscul de contaminare încrucișată cu alergeni în bucătărie?",h:"Spații separate pentru preparare alergeni majori. Ustensile dedicate (culori diferite). Spălare termică 85°C/30s a suprafețelor + ustensile (proteine alergice rezistente la detergent obișnuit). Instruire personal — 'may contain' vs 'contains'. Aprovizionare: fișe tehnice cu toți alergenii de la furnizori."},
      ], conc:["Obligația legală de declarare a alergenilor","Mecanismul anafilaxiei (simplificat)","Protocolul de urgență pentru personal"] },

    { id:"g6", emoji:"🫙", title:"Conserve de legume — botulism", color:"#991b1b",
      caz:[{l:"Produs",v:"Conserve de fasole verde, casnice, lot 50 borcane"},{l:"Situație",v:"2 cazuri de botulism confirmat după consum — paralizie flască, diplopie, disfagie"},{l:"Aspectul conservelor",v:"capace bombate, miros sulfhidric la deschidere"},{l:"Sterilizare",v:"fierte 30 min la 100°C — insuficient!"},{l:"pH",v:"5,8 — favorabil Clostridium botulinum tip A"}],
      qs:[
        {q:"De ce sterilizarea la 100°C/30min este insuficientă pentru conserve de legume?",h:"C. botulinum: spori rezistenti la 100°C (supraviețuiesc ore). Inactivare sigură: 121°C/3min (autoclavare). La domiciliu fără autoclavă: sporii supraviețuiesc → germinare în conservă → toxina botulinică (cel mai toxic compus natural: LD50 1-2 ng/kg). 100°C/30min = INSUFICIENT pentru spori."},
        {q:"pH 5,8 favorabil — la ce pH este inhibat C. botulinum și ce implicație practică are?",h:"C. botulinum: inhibat sub pH 4,6 (acid). Dacă pH <4,6 → spori nu germinează → toxina nu se produce. Legumele: pH 5-7 = favorabil. De aceea: murături în oțet (pH <4,5) = SIGURE la sterilizare clasică. Legumele nesărate/neacidulate = risc botulism."},
        {q:"Descrieți simptomele botulismului și explicați mecanismul neurofiziologic.",h:"Paralizie flască descendentă: diplopia → disfagie → disartrie → insuficiență respiratorie. Mecanism: toxina botulinică blochează eliberarea acetilcolinei la joncțiunea neuromusculară (clivează SNAP-25/VAMP). Fără antitoxină: paralizie respiratorie → deces (mortalitate 5-10% cu tratament)."},
        {q:"Cei 2 pacienți sunt diagnosticați. Ce tratament specific și ce suport intensiv necesită?",h:"Antitoxina botulinică heptavalentă (A-G) IV — URGENT, eficientă dacă adm. înainte legare toxina. Intubație + ventilație mecanică dacă capacitate vitală <30%. NU neostigmina (ineficientă). Recuperare: luni (regenerare axoni). ATI prelungit. Notificare urgentă DSP + CDC."},
        {q:"Cei 50 de borcane au fost distribuiți la rude. Ce acțiuni luați în primele 2 ore?",h:"Identificare urgentă toți primitorii (ancheta socială rapidă). Internare preventivă asimptomatici (toxina poate fi absorbită înainte simptomelor). Recuperare și distrugere borcane (NOT prin scurgerea în chiuvetă — mediu!). Alertă DSP. Notificare ECDC dacă peste granițe."},
        {q:"Ce recomandări practice privind conservele casnice dați populației?",h:"Legume în conserve: obligatoriu autoclavă (121°C) sau acidulare cu oțet/lămâie. NU consuma conserve cu capac bombat, miros ciudat. Fierberea 10 min înainte servire distruge toxina (nu sporii!). Dacă dubii: aruncă fără gust. Murăturile în saramură (pH 3,5) = sigure."},
      ], conc:["Temperatura de sterilizare corectă și de ce","Mecanismul toxinei botulinice (simplificat)","Recomandarea pentru conserve casnice sigure"] },
  ],

  lp5b: [
    { id:"g1", emoji:"🧫", title:"E. coli O157:H7 — carne de hamburger școală", color:"#dc2626",
      caz:[{l:"Situație",v:"18 elevi internați cu diaree sanguinolentă, 3 cu SHU"},{l:"Agent confirmat",v:"E. coli O157:H7 (STEC) în coprocultură"},{l:"Aliment vehicul",v:"hamburger insuficient gătit, cantina școlii"},{l:"Temperatura centru",v:"62°C la servire (norma carne tocată: min 74°C)"},{l:"Lot carne",v:"distribuit la 5 școli din județ"},{l:"SHU",v:"3 copii 5-9 ani: anemie hemolitică, trombocitopenie, IRA"}],
      qs:[
        {q:"Confirmați focarul și estimați amploarea reală (18 internați din câți expuși?)",h:"Focar STEC confirmat: E. coli O157:H7 + aliment comun + distribuție temporală. Estima expuși: toți elevii care au consumat hamburger (probabil 150-300). Rata atac la STEC: 3-15%. 18/expuși = rata reală. Anchetă: câți au simptome ușoare și nu s-au prezentat la medic?"},
        {q:"Ce este Sindromul Hemolitic Uremic (SHU) și de ce apare la copii mici?",h:"SHU = triada: anemie hemolitică microangiopatică + trombocitopenie + insuficiență renală acută. Mecanism: shigatoxina (Stx1, Stx2) → lezare endoteliu renal → microangiopatie trombotică. Copii <10 ani: receptor GB3 mai exprimat pe celulele endoteliale renale → vulnerabilitate maximă."},
        {q:"Temperatura 62°C vs norma 74°C pentru carne tocată — ce risc specific?",h:"La 62°C: E. coli O157:H7 nu este inactivat complet (D62 = 2,4 min → trebuie 3,5 min minim). La 74°C: inactivare în <1 sec (D74 = 0,05 min). Carne tocată = mai periculos decât bucată întreagă (contaminare internalizată în procesul de tocare). Eroare critică HACCP."},
        {q:"Lotul distribuit la 5 școli — ce protocol activați în primele 4 ore?",h:"Alertă RASFF + SNSPMPDSB (Centrul Național). Retragere lot din toate școlile. Internare preventivă toți simptomatici. Screening coproculturi elevi asimptomatici expuși. Notificare DSP județean. Inspecție urgentă cantina. Anchetă epidemiologică cu harta cazurilor."},

async function uploadFile(teacher, labId, file) {
  const safeName = teacher.replace(/[^a-zA-Z0-9]/g, "_");
  const path = `${labId}/${safeName}/${Date.now()}_${file.name}`;
  const res = await fetch(`${SB_STORAGE}/object/materiale/${encodeURIComponent(path)}`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": file.type || "application/octet-stream", "x-upsert": "false" },
    body: file
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return path;
}
async function listFiles(teacher, labId) {
  // Own files only (for upload/delete)
  const safeName = teacher.replace(/[^a-zA-Z0-9]/g, "_");
  const prefix = `${labId}/${safeName}/`;
  const res = await fetch(`${SB_STORAGE}/object/list/materiale`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix, limit: 100, sortBy: { column: "created_at", order: "desc" } })
  });
  const own = res.ok ? (await res.json() || []) : [];
  return own.map(f => ({
    name: f.name.replace(/^\d+_/, ""),
    path: prefix + f.name,
    url: `${SB_STORAGE}/object/public/materiale/${encodeURIComponent(prefix + f.name)}`,
    size: f.metadata?.size || 0,
    created: f.created_at,
    isOwn: true,
    uploaderDisplay: teacher
  }));
}
async function listAllFiles(labId) {
  // All teachers' files for a lab
  const prefix = `${labId}/`;
  const res = await fetch(`${SB_STORAGE}/object/list/materiale`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix, limit: 500 })
  });
  if (!res.ok) return [];
  const folders = (await res.json() || []).filter(f => !f.name.includes("."));
  const allFiles = [];
  for (const folder of folders) {
    const sub = `${labId}/${folder.name}/`;
    const r2 = await fetch(`${SB_STORAGE}/object/list/materiale`, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: sub, limit: 100, sortBy: { column: "created_at", order: "desc" } })
    });
    if (!r2.ok) continue;
    const files = await r2.json() || [];
    const uploader = folder.name.replace(/_/g, " ");
    files.forEach(f => allFiles.push({
      name: f.name.replace(/^\d+_/, ""),
      path: sub + f.name,
      url: `${SB_STORAGE}/object/public/materiale/${encodeURIComponent(sub + f.name)}`,
      size: f.metadata?.size || 0,
      created: f.created_at,
      isOwn: false,
      uploaderDisplay: uploader
    }));
  }
  return allFiles;
}
async function deleteFile(path) {
  const res = await fetch(`${SB_STORAGE}/object/materiale/${encodeURIComponent(path)}`, {
    method: "DELETE",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
  });
  return res.ok;
}
function getFileIcon(name) {
  const ext = name.split(".").pop().toLowerCase();
  if (["pdf"].includes(ext)) return "📄";
  if (["ppt","pptx"].includes(ext)) return "📊";
  if (["doc","docx"].includes(ext)) return "📝";
  if (["mp4","mov","avi"].includes(ext)) return "🎬";
  if (["png","jpg","jpeg","gif"].includes(ext)) return "🖼️";
  return "📎";
}

function generateToken() {
  return Math.random().toString(36).substr(2,6).toUpperCase() + Date.now().toString(36).toUpperCase();
}

function generateQRDataURL(text) {
  return new Promise((resolve) => {
    const div = document.getElementById("qr-canvas");
    div.innerHTML = "";
    try {
      new QRCode(div, {text, width:200, height:200, colorDark:"#0a2a18", colorLight:"#ffffff"});
      setTimeout(() => {
        const canvas = div.querySelector("canvas");
        if (canvas) resolve(canvas.toDataURL("image/png"));
        else {
          const img = div.querySelector("img");
          if (img) resolve(img.src);
          else resolve(null);
        }
      }, 300);
    } catch(e) { resolve(null); }
  });
}

// Fisher-Yates shuffle + random pick
function shufflePick(arr, n) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return n ? a.slice(0, n) : a;
}
