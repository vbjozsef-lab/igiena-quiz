async function uploadFile(teacher, labId, file) {
  const safeName = teacher.replace(/[^a-zA-Z0-9]/g, "_");
  const path = `${labId}/${safeName}/${Date.now()}_${file.name}`;
  const res = await fetch(`${SB_STORAGE}/object/materiale/${encodeURIComponent(path)}`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": file.type || "application/octet-stream", "x-upsert": "false" },
    body: file
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return path;
}
async function listFiles(teacher, labId) {
  // Own files only (for upload/delete)
  const safeName = teacher.replace(/[^a-zA-Z0-9]/g, "_");
  const prefix = `${labId}/${safeName}/`;
  const res = await fetch(`${SB_STORAGE}/object/list/materiale`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix, limit: 100, sortBy: { column: "created_at", order: "desc" } })
  });
  const own = res.ok ? (await res.json() || []) : [];
  return own.map(f => ({
    name: f.name.replace(/^\d+_/, ""),
    path: prefix + f.name,
    url: `${SB_STORAGE}/object/public/materiale/${encodeURIComponent(prefix + f.name)}`,
    size: f.metadata?.size || 0,
    created: f.created_at,
    isOwn: true,
    uploaderDisplay: teacher
  }));
}
async function listAllFiles(labId) {
  // All teachers' files for a lab
  const prefix = `${labId}/`;
  const res = await fetch(`${SB_STORAGE}/object/list/materiale`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix, limit: 500 })
  });
  if (!res.ok) return [];
  const folders = (await res.json() || []).filter(f => !f.name.includes("."));
  const allFiles = [];
  for (const folder of folders) {
    const sub = `${labId}/${folder.name}/`;
    const r2 = await fetch(`${SB_STORAGE}/object/list/materiale`, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: sub, limit: 100, sortBy: { column: "created_at", order: "desc" } })
    });
    if (!r2.ok) continue;
    const files = await r2.json() || [];
    const uploader = folder.name.replace(/_/g, " ");
    files.forEach(f => allFiles.push({
      name: f.name.replace(/^\d+_/, ""),
      path: sub + f.name,
      url: `${SB_STORAGE}/object/public/materiale/${encodeURIComponent(sub + f.name)}`,
      size: f.metadata?.size || 0,
      created: f.created_at,
      isOwn: false,
      uploaderDisplay: uploader
    }));
  }
  return allFiles;
}
async function deleteFile(path) {
  const res = await fetch(`${SB_STORAGE}/object/materiale/${encodeURIComponent(path)}`, {
    method: "DELETE",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
  });
  return res.ok;
}
function getFileIcon(name) {
  const ext = name.split(".").pop().toLowerCase();
  if (["pdf"].includes(ext)) return "📄";
  if (["ppt","pptx"].includes(ext)) return "📊";
  if (["doc","docx"].includes(ext)) return "📝";
  if (["mp4","mov","avi"].includes(ext)) return "🎬";
  if (["png","jpg","jpeg","gif"].includes(ext)) return "🖼️";
  return "📎";
}

function generateToken() {
  return Math.random().toString(36).substr(2,6).toUpperCase() + Date.now().toString(36).toUpperCase();

function generateQRDataURL(text) {
  return new Promise((resolve) => {
    const div = document.getElementById("qr-canvas");
    div.innerHTML = "";
    try {
      new QRCode(div, {text, width:200, height:200, colorDark:"#0a2a18", colorLight:"#ffffff"});
      setTimeout(() => {
        const canvas = div.querySelector("canvas");
        if (canvas) resolve(canvas.toDataURL("image/png"));
        else {
          const img = div.querySelector("img");
          if (img) resolve(img.src);
          else resolve(null);
        }
      }, 300);
    } catch(e) { resolve(null); }
  });
}

// Fisher-Yates shuffle + random pick
function shufflePick(arr, n) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return n ? a.slice(0, n) : a;
}

      const session = { token, labId: selLab.id, labTitle: selLab.title, labCode: fisaCode, duration, expiresAt, createdAt: Date.now(), usedBy:[], teacher: teacherName, semester: semester.trim() };

      const url = `${getBaseURL()}?token=${token}`;
      const dataURL = await generateQRDataURL(url);
      setQrDataURL(dataURL);
      setActiveSession(session);
      setTimeLeft(duration * 60);

      (specFilter==="all"||r.specialization===specFilter) &&

    const rows = toExport.map(r=>`"${r.semester||""}","${r.specialization||""}","${r.teacher||""}","${r.name}","${r.group||""}","${r.labCode||""}","${r.moduleTitle||""}",${r.score}/${r.total},${r.pct}%,${r.timeUsed}s,"${new Date(r.timestamp).toLocaleString("ro-RO")}"`).join("\n");
    const blob = new Blob(["\uFEFF"+header+rows],{type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`igiena_rezultate_${new Date().toISOString().slice(0,10)}.csv`; a.click();

  const allGroups = [...new Set(results.map(r=>r.group).filter(Boolean))].sort();
  const allSemesters = [...new Set(results.map(r=>r.semester).filter(Boolean))].sort().reverse();
  const allSpecs = [...new Set(results.map(r=>r.specialization).filter(Boolean))].sort();
  const filteredResults = results
    .filter(r => labFilter==="all"||r.labId===labFilter)
    .filter(r => grpFilter==="all"||r.group===grpFilter)
    .filter(r => semFilter==="all"||r.semester===semFilter)
    .filter(r => specFilter==="all"||r.specialization===specFilter)

              {id:"results", icon:"📊", label:"Rezultate"},
              {id:"prezentari",icon:"📽️",label:"Prezentări"},
              {id:"fisiere", icon:"📁", label:"Fișiere"},

              Ieși

          </div>
        </div>

                </div>
              ) : (
                <>
                  {/* countdown ring */}
                  <div style={{position:"relative",width:220,height:220,marginBottom:16}}>
                    <svg style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}} width="220" height="220">
                      <circle cx="110" cy="110" r="105" fill="none" stroke="#f0f9f4" strokeWidth="8"/>
                      <circle cx="110" cy="110" r="105" fill="none" stroke={timerColor} strokeWidth="8"
                        strokeDasharray={`${2*Math.PI*105}`}

                        : <div style={{width:180,height:180,background:"#f0f9f4",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
                            <span className="spin" style={{fontSize:24}}>⏳</span>
                          </div>
                      }
                    </div>
                  </div>

                  {/* timer */}
                  <div style={{textAlign:"center",marginBottom:16}}>
                    <div style={{fontFamily:"monospace",fontSize:32,fontWeight:800,color:timerColor,letterSpacing:".05em"}}>{fmt(timeLeft)}</div>
                    <p style={{color:"#94a3b8",fontSize:12,margin:"4px 0 0"}}>timp rămas</p>
                  </div>

                  {/* session info */}
                  <div style={{background:"#F8FAFF",border:"1px solid #e0e7ff",borderRadius:10,padding:"10px 16px",width:"100%",marginBottom:12}}>
                    <p style={{color:"#1e1b4b",fontSize:13,fontWeight:600,margin:"0 0 4px"}}>{selLab.icon} {selLab.code} – {selLab.title}</p>
                    <p style={{color:"#4a9a6a",fontSize:12,margin:"0 0 4px"}}>Token: <code style={{background:"#dcfce7",padding:"1px 6px",borderRadius:4,color:"#15803d",fontSize:11}}>{activeSession.token}</code></p>
                    <p style={{color:"#4a9a6a",fontSize:12,margin:0}}>

                    </p>
                  </div>

                  {/* print button */}
                  {qrDataURL && (
                    <a href={qrDataURL} download={`QR_${selLab.code}_${activeSession.token}.png`}
                      style={{display:"block",textAlign:"center",background:"#F8FAFF",border:"1px solid #e0e7ff",color:"#6366f1",borderRadius:8,padding:"8px 16px",fontSize:13,textDecoration:"none",fontWeight:600}}>
                      💾 Descarcă imaginea QR
                    </a>
                  )}
                </>
              )}
            </div>
          </div>
        )}

        {/* ── RESULTS TAB ── */}
        {tab==="preview" && (
          <QuizPreviewTab selLab={selLab} onSelectLab={lab=>setSelLab(lab)}/>
        )}

        {tab==="results" && (
          <div>
            {/* summary cards */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
              {[
                {label:"Total răspunsuri",value:results.length,icon:"📋",color:"#10b981"},
                {label:"Studenți unici",  value:[...new Set(results.map(r=>r.name))].length,icon:"👥",color:"#3b82f6"},
                {label:"Medie generală",  value:results.length?`${Math.round(results.reduce((s,r)=>s+r.pct,0)/results.length)}%`:"–",icon:"📈",color:"#f59e0b"},
                {label:"Lab-uri active",  value:LABS.filter(l=>l.ready).length,icon:"🧪",color:"#8b5cf6"},
              ].map(c=>(
                <div key={c.label} style={{background:"#fff",border:"1px solid #e0e7ff",borderRadius:12,padding:14,boxShadow:"0 2px 8px rgba(99,102,241,0.06)"}}>
                  <div style={{fontSize:22,marginBottom:4}}>{c.icon}</div>
                  <div style={{color:c.color,fontSize:22,fontWeight:700}}>{c.value}</div>
                  <div style={{color:"#64748b",fontSize:11}}>{c.label}</div>

              ))}

              <select style={{...S.input,width:"auto",minWidth:140}} value={semFilter} onChange={e=>setSemFilter(e.target.value)}>
                <option value="all">📅 Toate semestrele</option>
                {allSemesters.map(s=><option key={s} value={s}>{s}</option>)}
                <option value="">Fără semestru</option>
              </select>
              <select style={{...S.input,width:"auto",minWidth:150}} value={specFilter} onChange={e=>setSpecFilter(e.target.value)}>
                <option value="all">🎓 Toate specializările</option>
                {allSpecs.map(s=><option key={s} value={s}>{s}</option>)}
                <option value="">Fără specializare</option>
              </select>
              <select style={{...S.input,width:"auto",minWidth:120}} value={grpFilter} onChange={e=>setGrpFilter(e.target.value)}>
                <option value="all">Toate grupele</option>

              <select style={{...S.input,width:"auto",minWidth:120}} value={labFilter} onChange={e=>setLabFilter(e.target.value)}>

                  <div style={{fontSize:13,fontWeight:700,color:"#0a2a18"}}>Scor AI: {selectedResult.score}/{selectedResult.total} puncte</div>
                  <div style={{fontSize:12,color:"#4a9a6a"}}>{selectedResult.pct>=80?"Excelent":selectedResult.pct>=60?"Bun":"Necesită îmbunătățiri"}</div>
                </div>
              </div>
              {qaBlocks.length>0 ? qaBlocks.map((block,i)=>{
                const nl=block.indexOf("\nA: ");
                if(nl===-1) return null;
                const question=block.slice(block.indexOf(": ")+2,nl);
                const answer=block.slice(nl+4)||"(fara raspuns)";
                const isEmpty=answer.trim()==="(fara raspuns)"||answer.trim()==="";
                return (
                  <div key={i} style={{marginBottom:10,borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0"}}>

                    </div>
                    <div style={{padding:"9px 14px",fontSize:13,color:isEmpty?"#94a3b8":"#1e293b",fontStyle:isEmpty?"italic":"normal",lineHeight:1.6,background:isEmpty?"#fafafa":"#fff"}}>
                      {answer}
                    </div>
                  </div>
                );
              }) : (
                <div style={{color:"#94a3b8",fontSize:13,textAlign:"center",padding:20}}>Nu exista raspunsuri stocate pentru aceasta intrare.</div>
              )}
            </div>
          </div>
        );
      })()}
      </div>
    </div>
  );
}

// NOMENCLATOR EDITOR
// ════════════════════════════════════════════════════════════
function NomenclatorEditor({nomenclator, onChange}) {
  const [newSpec, setNewSpec] = useState("");
  const [newYear, setNewYear] = useState("");
  const [newMod,  setNewMod]  = useState("");

  const addItem = (key, val, reset) => {
    const v = val.trim();
    if (!v) return;
    if (nomenclator[key].includes(v)) return;
    onChange({...nomenclator, [key]: [...nomenclator[key], v]});
    reset("");
  };
  const removeItem = (key, val) => {
    onChange({...nomenclator, [key]: nomenclator[key].filter(x=>x!==val)});
  };
  const reset = () => { onChange(DEFAULT_NOMENCLATOR); saveNomenclator(DEFAULT_NOMENCLATOR); };

  const Section = ({title, icon, itemKey, items, newVal, setNewVal, placeholder}) => (
    <div style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:14,padding:20,marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:14,color:"#1a3a28",marginBottom:12}}>{icon} {title}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
        {items.map(item=>(
          <span key={item} style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:20,padding:"4px 10px",fontSize:12,color:"#166534",display:"flex",alignItems:"center",gap:6}}>
            {item}
            <button onClick={()=>removeItem(itemKey,item)} style={{background:"none",border:"none",cursor:"pointer",color:"#dc2626",fontSize:14,lineHeight:1,padding:0}}>×</button>
          </span>
        ))}
        {items.length===0 && <span style={{color:"#94a3b8",fontSize:12}}>Nicio valoare adăugată</span>}
      </div>
      <div style={{display:"flex",gap:8}}>
        <input value={newVal} onChange={e=>setNewVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem(itemKey,newVal,setNewVal)}
          style={{flex:1,padding:"8px 12px",border:"1.5px solid #b2ddc8",borderRadius:9,fontSize:13}} placeholder={placeholder}/>
        <button onClick={()=>addItem(itemKey,newVal,setNewVal)} style={{padding:"8px 14px",background:"#10b981",color:"#fff",border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer"}}>+</button>
      </div>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <h3 style={{color:"#0a2a18",fontSize:17,margin:"0 0 4px"}}>🗂️ Nomenclator Clasificare</h3>
          <p style={{color:"#4a9a6a",fontSize:13,margin:0}}>Valorile apar în dropdown-urile de clasificare la generarea sesiunii QR.</p>
        </div>
        <button onClick={reset} style={{padding:"8px 14px",background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer"}}>↺ Reset</button>
      </div>
      <Section title="Specializări" icon="🎓" itemKey="specializations" items={nomenclator.specializations} newVal={newSpec} setNewVal={setNewSpec} placeholder="ex: Medicină Generală"/>
      <Section title="Ani de studiu" icon="📅" itemKey="years" items={nomenclator.years} newVal={newYear} setNewVal={setNewYear} placeholder="ex: Anul I"/>
      <Section title="Module" icon="📚" itemKey="modules" items={nomenclator.modules} newVal={newMod} setNewVal={setNewMod} placeholder="ex: Semestrul 1"/>
    </div>
  );
}

              <div key={i} style={{display:"flex",gap:10,fontSize:13,color:"#166534",lineHeight:1.5}}>
                <span style={{fontWeight:700,minWidth:24,color:f.color}}>{i+1}.</span>

          Am înțeles cazul — Încep să răspund →
        </button>
      </div>
    </div>
  );

  // ── QUESTIONS PHASE ──────────────────────────────────────
  const answered = f ? f.qs.filter((_,i) => (answers[i]||"").trim().length > 2).length : 0;

  if (phase === "questions") return (
    <div style={FS.page}>
      <div style={FS.hdr}>
        <span style={{fontSize:22}}>{f.emoji}</span>
        <div style={{flex:1}}>

      </div>

        <div style={{height:"100%",background:"linear-gradient(90deg,"+f.color+",#10b981)",width:(answered/f.qs.length*100)+"%",transition:"width .4s"}}/>

      <div style={{maxWidth:680,margin:"0 auto",padding:"16px 14px 100px"}}>

        {/* Cazul rezumat — compact, collapsible */}

          <summary style={{background:"white",border:"1.5px solid "+f.color+"44",borderRadius:10,padding:"10px 16px",

            <span>{f.emoji}</span> 📋 Recitește cazul (apasă pentru a deschide)

          <div style={{background:"white",border:"1.5px solid "+f.color+"44",borderTop:"none",borderRadius:"0 0 10px 10px",padding:"12px 16px"}}>

          </div>
        </details>

        {/* Questions */}
        {f.qs.map((q,i) => (
          <div key={i} style={{...FS.qCard,borderLeft:"4px solid "+((answers[i]||"").trim().length>2?f.color:"#cbd5e1"),marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <span style={{background:(answers[i]||"").trim().length>2?f.color:"#e2e8f0",color:(answers[i]||"").trim().length>2?"white":"#94a3b8",

              <span style={{fontSize:15,fontWeight:700,color:"#0d2040",lineHeight:1.4}}>{q.q}</span>
            </div>
            <textarea style={FS.ta} placeholder="Scrieți răspunsul grupei dvs. aici…"

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {f.conc.map((label,i)=>(

                <textarea style={{...FS.ta,minHeight:55,borderColor:"#bbf7d0"}}

        </div>
      </div>

      {/* Float bar */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"white",borderTop:"1.5px solid #e2e8f0",padding:"10px 16px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 -4px 20px rgba(0,0,0,.08)"}}>

          <div style={{fontSize:13,fontWeight:700,color:answered>=f.qs.length?"#16a34a":f.color}}>{answered} / {f.qs.length} răspunsuri</div>

        </div>

      </div>

  );

  // ── EVALUATING ───────────────────────────────────────────
  if (phase === "evaluating") return (

    </div>
  );

  // ── DONE ─────────────────────────────────────────────────
  if (phase === "done" && evalResults) {
    const {evaluations,totalScore,maxScore,pct} = evalResults;
    const sc = pct>=80?"#16a34a":pct>=60?"#d97706":"#dc2626";
    return (
      <div style={FS.page}>
        <div style={FS.hdr}>
          <span style={{fontSize:22}}>✅</span>
          <div>

        </div>
        <div style={{maxWidth:620,margin:"20px auto",padding:"0 14px 40px"}}>

            <div style={{width:100,height:100,borderRadius:"50%",border:"6px solid "+sc,margin:"0 auto 14px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:30,fontWeight:800,color:sc,lineHeight:1}}>{totalScore}</span>
              <span style={{fontSize:12,color:sc,opacity:.7}}>/{maxScore}</span>
            </div>
            <h3 style={{color:"#0d2040",margin:"0 0 4px"}}>{pct>=80?"Excelent! 🎉":pct>=60?"Bun! 👍":"Necesită îmbunătățiri"}</h3>
            <p style={{color:"#64748b",fontSize:13}}>{student?.name} · Grupa {student?.group} · {f.title}</p>

          {/* Case recap in results */}
          <div style={{background:"white",borderRadius:12,border:"1.5px solid "+f.color+"44",padding:"14px 18px",marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:f.color,marginBottom:8}}>📋 Cazul analizat</div>
            <div style={{fontSize:13,color:"#475569"}}>{f.caz.filter(i=>i.v).map(i=>i.l+": "+i.v).join(" · ")}</div>
          </div>

          {f.qs.map((q,i)=>{
            const ev=evaluations[i]||{score:0,feedback:"Fără evaluare"};
            const cc=ev.score===2?"#16a34a":ev.score===1?"#d97706":"#dc2626";
            return (
              <div key={i} style={{...FS.card,marginBottom:10,borderLeft:"4px solid "+cc}}>
                <div style={{fontSize:11,fontWeight:700,color:cc,textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>Întrebarea {i+1}</div>
                <div style={{fontSize:13,fontWeight:600,color:"#0d2040",marginBottom:6}}>{q.q}</div>
                <div style={{fontSize:13,color:"#475569",background:"#f8fafc",borderRadius:7,padding:"7px 10px",marginBottom:7,borderLeft:"3px solid #e2e8f0"}}>{answers[i]||"(fără răspuns)"}</div>
                <div style={{fontSize:13,background:ev.score===2?"#f0fdf4":ev.score===1?"#fffbeb":"#fef2f2",borderLeft:"3px solid "+cc,padding:"8px 10px",borderRadius:7,lineHeight:1.6}}>
                  🤖 <strong>Evaluare AI:</strong> {ev.feedback}
                </div>
                <span style={{background:ev.score===2?"#dcfce7":ev.score===1?"#fef9c3":"#fee2e2",color:cc,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,display:"inline-block",marginTop:6}}>
                  {ev.score===2?"✅ 2/2":ev.score===1?"⚠️ 1/2":"❌ 0/2"} puncte
                </span>
              </div>
            );
          })}
          <div style={{background:"#eff6ff",borderRadius:12,padding:"12px 16px",marginTop:8,fontSize:13,color:"#1e40af"}}>
            <strong>⏱️ Urmează:</strong> Prezentați cazul și concluziile grupei în <strong>maximum 2 minute</strong>.
          </div>
          <button onClick={onBack} style={{width:"100%",padding:14,background:"#0d2040",color:"white",border:"none",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer",marginTop:14}}>
            🏠 Înapoi la pagina principală
          </button>
        </div>
      </div>
    );
  }
  return null;
}


async function submitFisaGrup(f,answers,concluzii,student,session,setPhase,setEvalResults) {
  setPhase("evaluating");
  const cazStr = f.caz.map(i=>i.l+": "+i.v).join(", ");
  const qStr = f.qs.map((q,i)=>"Intrebarea "+(i+1)+": "+q.q+"\nRaspuns: "+(answers[i]||"(fara raspuns)")).join("\n\n");
  const prompt = "Esti profesor de igiena. Evalueaza raspunsurile unui student la fisa \""+f.title+"\"."
    +"\nContext: "+cazStr+"\n\n"+qStr
    +"\n\nAcorda scor (0,1,2) si feedback scurt pentru fiecare din cele "+f.qs.length+" intrebari."
    +"\nCriterii: 2p=corect complet, 1p=partial, 0p=incorect."
    +'\nRaspunde NUMAI cu JSON: {"evaluations":[{"score":2,"feedback":"..."}]}'
    +"\nAray-ul trebuie sa contina EXACT "+f.qs.length+" obiecte.";
  let evaluations=[];
  try {
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const data=await res.json();
    const parsed=JSON.parse((data.content?.[0]?.text||"{}").replace(/```json|```/g,"").trim());
    evaluations=parsed.evaluations||[];
  } catch(e){
    evaluations=f.qs.map(()=>({score:1,feedback:"Raspuns inregistrat — evaluare manuala."}));
  }
  const totalScore=evaluations.reduce((s,e)=>s+(e.score||0),0);
  const maxScore=f.qs.length*2;
  const pct=Math.round(totalScore/maxScore*100);
  const answersText=f.qs.map((q,i)=>"Q"+(i+1)+": "+q.q+"\nA: "+(answers[i]||"(fara raspuns)")).join("\n\n");
  const SB="https://hgknirjorjvlofhngvcp.supabase.co";
  const SK="sb_publishable_PnUOkG2Tpw3wKa9hTZc3Yw_T0bnhFAO";
  try {
    await fetch(SB+"/rest/v1/results",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SK,"Authorization":"Bearer "+SK,"Prefer":"return=minimal"},
      body:JSON.stringify({
        session_id:session?.token||null,name:student?.name,grp:student?.group,
        lab_id:session?.labId,lab_code:session?.labCode,
        module:"fisa_"+f.id,
        module_title:"Fisa Grupa: "+f.title+"\n---\n"+answersText,
        score:totalScore,total:maxScore,pct,time_used:0,
        teacher:session?.teacher||"",semester:session?.semester||"",
        specialization:student?.spec||""
      })
    });
  } catch(e){console.error("save error",e);}
  setEvalResults({evaluations,totalScore,maxScore,pct});
  setPhase("done");
}

// QUIZ PREVIEW TAB — teacher sees all questions per lab/module

    lp1a:{q:LP1A_QUESTIONS,m:LP1A_MODULES},
    lp1b:{q:LP1B_QUESTIONS,m:LP1B_MODULES},
    lp2a:{q:LP2A_QUESTIONS,m:LP2A_MODULES},
    lp2b:{q:LP2B_QUESTIONS,m:LP2B_MODULES},
    lp3a:{q:LP3A_QUESTIONS,m:LP3A_MODULES},
    lp3b:{q:LP3B_QUESTIONS,m:LP3B_MODULES},
    lp4a:{q:LP4A_QUESTIONS,m:LP4A_MODULES},
    lp4b:{q:LP4B_QUESTIONS,m:LP4B_MODULES},
    lp5a:{q:LP5A_QUESTIONS,m:LP5A_MODULES},
    lp5b:{q:LP5B_QUESTIONS,m:LP5B_MODULES},
    lp6a:{q:LP6A_QUESTIONS,m:LP6A_MODULES},
    lp6b:{q:LP6B_QUESTIONS,m:LP6B_MODULES},

  const [selModId, setSelModId] = useState(null);
  const [expandedQ, setExpandedQ] = useState(null);

  React.useEffect(()=>{ setSelModId(null); setExpandedQ(null); setSearch(""); }, [selLab?.id]);

  const selMod = modules.find(m=>m.id===selModId);
  const rawQs = selModId ? (questions[selModId]||[]) : [];
  const filteredQs = search.trim()
    ? rawQs.filter(q=>(q.q+q.o?.join("")+q.e).toLowerCase().includes(search.toLowerCase()))
    : rawQs;

  const totalQ = Object.values(questions).reduce((s,arr)=>s+arr.length,0);

  return (
    <div>

          <h3 style={{color:"#1e1b4b",fontSize:18,margin:"0 0 2px",fontWeight:800}}>👁️ Previzualizare Quiz</h3>
          <p style={{color:"#64748b",fontSize:13,margin:0}}>Vizualizați toate întrebările disponibile per modul, cu răspunsuri și explicații</p>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,background:"#EEF2FF",border:"1px solid #c7d2fe",borderRadius:20,padding:"6px 14px"}}>
          <span style={{fontSize:18}}>{selLab?.icon}</span>
          <span style={{fontSize:13,fontWeight:700,color:"#6366f1"}}>{selLab?.code}</span>
          <span style={{fontSize:12,color:"#94a3b8"}}>· {totalQ} întrebări totale</span>
        </div>
      </div>

      {/* Lab selector */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
        {LABS.map(lab=>{
          const lq = LAB_Q_MAP[lab.id];
          const cnt = lq ? Object.values(lq.q).reduce((s,a)=>s+a.length,0) : 0;
          const active = selLab?.id===lab.id;
          return (
            <button key={lab.id} onClick={()=>{onSelectLab(lab);setSelModId(null);}}
              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:10,
                border:`1.5px solid ${active?"#a5b4fc":"#e0e7ff"}`,
                background:active?"#EEF2FF":"#fff",
                cursor:"pointer",transition:"all .15s"}}>
              <span style={{fontSize:16}}>{lab.icon}</span>
              <span style={{fontSize:13,fontWeight:active?700:500,color:active?"#6366f1":"#475569"}}>{lab.code}</span>
              {cnt>0 && <span style={{fontSize:11,color:active?"#818cf8":"#94a3b8",background:active?"#e0e7ff":"#f1f5f9",borderRadius:10,padding:"1px 7px"}}>{cnt}Q</span>}
              {!lab.ready && <span style={{fontSize:10,color:"#f59e0b",background:"#fffbeb",borderRadius:8,padding:"1px 6px"}}>draft</span>}
            </button>
          );
        })}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:16,alignItems:"start"}}>

        {/* Left: module list */}
        <div style={{background:"#fff",borderRadius:14,border:"1px solid #e0e7ff",overflow:"hidden",boxShadow:"0 2px 8px rgba(99,102,241,0.06)"}}>
          <div style={{padding:"12px 16px",borderBottom:"1px solid #e0e7ff",background:"#F8FAFF"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#6366f1",textTransform:"uppercase",letterSpacing:".1em"}}>Module — {selLab?.code}</div>
          </div>
          {modules.length===0
            ? <div style={{padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>Niciun modul disponibil</div>
            : modules.map(m=>{
              const cnt=(questions[m.id]||[]).length;
              const active=selModId===m.id;
              return (
                <button key={m.id} onClick={()=>{setSelModId(m.id);setExpandedQ(null);setSearch("");}}
                  style={{width:"100%",textAlign:"left",padding:"12px 16px",border:"none",borderBottom:"1px solid #f1f5f9",
                    background:active?"#EEF2FF":"transparent",cursor:"pointer",transition:"background .1s",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:20}}>{m.icon}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:active?700:500,color:active?"#6366f1":"#1e293b",lineHeight:1.3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.title}</div>

                <div style={{flex:1}}>
                  <div style={{fontSize:16,fontWeight:800,color:"#1e1b4b"}}>{selMod?.title}</div>
                  <div style={{fontSize:12,color:"#64748b",marginTop:2}}>{selMod?.sub} · {rawQs.length} întrebări · {selMod?.time} min recomandat</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:24,fontWeight:900,color:"#6366f1"}}>{rawQs.length}</div>
                  <div style={{fontSize:11,color:"#94a3b8"}}>întrebări</div>
                </div>
              </div>

              {/* Search */}

                        <div style={{padding:"0 16px 16px",borderTop:"1px solid #f1f5f9"}}>

                              return (
                                <div key={j} style={{
                                  display:"flex",alignItems:"center",gap:10,
                                  padding:"10px 14px",borderRadius:9,
                                  background:isCorrect?"#F0FDF4":"#F8FAFF",
                                  border:`1.5px solid ${isCorrect?"#86efac":"#e0e7ff"}`,
                                }}>
                                  <div style={{width:22,height:22,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
                                    background:isCorrect?"#16a34a":"#e0e7ff",
                                    fontSize:11,fontWeight:800,color:isCorrect?"#fff":"#94a3b8"}}>
                                    {String.fromCharCode(65+j)}
                                  </div>
                                  <span style={{fontSize:13,color:isCorrect?"#15803d":"#475569",fontWeight:isCorrect?700:400}}>{opt}</span>
                                  {isCorrect && <span style={{marginLeft:"auto",fontSize:11,color:"#16a34a",fontWeight:700,background:"#dcfce7",padding:"2px 8px",borderRadius:10}}>✓ Corect</span>}

          )}
        </div>

// FILE MANAGER
// ════════════════════════════════════════════════════════════
function FileManager({teacherName, selLab}) {
  const [files, setFiles]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [uploading, setUploading] = React.useState(false);
  const [msg, setMsg]             = React.useState({type:"", text:""});
  const fileRef = React.useRef();

  const load = () => {
    setLoading(true);
    Promise.all([
      listFiles(teacherName, selLab.id),
      listAllFiles(selLab.id)
    ]).then(([own, all]) => {
      const ownPaths = new Set(own.map(f=>f.path));
      const merged = [
        ...own.map(f=>({...f, isOwn:true})),
        ...all.filter(f=>!ownPaths.has(f.path)).map(f=>({...f, isOwn:false}))
      ];
      setFiles(merged);
      setLoading(false);
    }).catch(()=>setLoading(false));
  };

  React.useEffect(()=>{load();},[selLab.id]);

  const upload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true); setMsg({type:"",text:""});
    try {
      await uploadFile(teacherName, selLab.id, file);
      setMsg({type:"ok", text:"Fișier încărcat cu succes!"});
      load();
    } catch(err) {
      setMsg({type:"err", text:"Eroare la încărcare: "+err.message});
    }
    setUploading(false);
  };

  const del = async (path) => {
    if (!confirm("Ștergeți acest fișier?")) return;
    try {
      await deleteFile(path);
      setMsg({type:"ok", text:"Fișier șters."});
      load();
    } catch(err) {
      setMsg({type:"err", text:"Eroare la ștergere."});
    }
  };

  const SB_STORAGE = "https://hgknirjorjvlofhngvcp.supabase.co/storage/v1";

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <h3 style={{color:"#0a2a18",fontSize:17,margin:"0 0 4px"}}>📁 Fișiere mele — {selLab.code}</h3>
          <p style={{color:"#4a9a6a",fontSize:13,margin:0}}>Încarcă PDF-uri, prezentări sau alte materiale pentru studenți.</p>
        </div>
        <div>
          <input ref={fileRef} type="file" style={{display:"none"}} onChange={upload}
            accept=".pdf,.pptx,.ppt,.docx,.doc,.xlsx,.xls,.png,.jpg,.jpeg,.gif,.zip"/>
          <button onClick={()=>fileRef.current.click()} disabled={uploading}
            style={{padding:"10px 18px",background:"linear-gradient(135deg,#10b981,#059669)",color:"white",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer"}}>
            {uploading?"⏳ Se încarcă…":"📤 Încarcă fișier"}
          </button>
        </div>
      </div>
      {msg.text && <div style={{padding:"10px 14px",borderRadius:9,marginBottom:14,fontSize:13,fontWeight:600,
        background:msg.type==="ok"?"#dcfce7":"#fee2e2",color:msg.type==="ok"?"#16a34a":"#dc2626"}}>
        {msg.type==="ok"?"✅":"❌"} {msg.text}
      </div>}
      {loading ? <div style={{textAlign:"center",padding:30,color:"#94a3b8"}}>Se încarcă fișierele…</div>
      : files.length===0 ? (
        <div style={{background:"#f0fdf4",border:"1.5px solid #b2ddc8",borderRadius:12,padding:24,textAlign:"center",color:"#4a9a6a"}}>
          <div style={{fontSize:32,marginBottom:8}}>📂</div>
          <p style={{fontWeight:600,marginBottom:4}}>Niciun fișier încărcat pentru {selLab.code}</p>
          <p style={{fontSize:13}}>Apăsați butonul de mai sus pentru a încărca primul fișier.</p>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {files.map((f,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"#fff",border:"1.5px solid #b2ddc8",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,.05)"}}>
              <span style={{fontSize:24}}>{getFileIcon(f.name)}</span>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontWeight:600,fontSize:14,color:"#0a2a18",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</p>
                <p style={{fontSize:11,color:"#94a3b8",margin:"2px 0 0"}}>{f.isOwn?"Fișierul tău":"Alt profesor"} · {Math.round((f.size||0)/1024)} KB</p>
              </div>
              <a href={SB_STORAGE+"/object/public/materiale/"+f.path} target="_blank" rel="noreferrer"
                style={{padding:"6px 12px",background:"#f0fdf4",color:"#16a34a",border:"1px solid #86efac",borderRadius:8,fontSize:12,fontWeight:700,textDecoration:"none"}}>
                ⬇️ Descarcă
              </a>
              {f.isOwn && <button onClick={()=>del(f.path)}
                style={{padding:"6px 10px",background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",borderRadius:8,fontSize:12,cursor:"pointer"}}>
                🗑️
              </button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// TOKEN JOIN
// ════════════════════════════════════════════════════════════
function TokenJoin({token, onValid, onInvalid}) {
  React.useEffect(()=>{
    if (!token) { onInvalid("Token lipsă."); return; }
    getSession(token).then(s=>{
      if (!s) { onInvalid("Cod QR invalid sau expirat."); return; }
      if (Date.now() > s.expiresAt) { onInvalid("Sesiunea a expirat. Cereți un cod nou de la profesor."); return; }
      onValid(s);
    }).catch(()=>onInvalid("Eroare de rețea. Verificați conexiunea."));
  },[]);
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:48,height:48,border:"5px solid #e2e8f0",borderTopColor:"#10b981",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/>
        <p style={{color:"#4a9a6a",fontSize:15}}>Se verifică codul QR…</p>
      </div>
    </div>
  );
}

  const [name, setName]   = useState("");

    onLogin(name.trim(), group, spec);

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(150deg,#F0F4FF,#F5F3FF)",padding:"24px 16px",display:"flex",alignItems:"center",justifyContent:"center"}}>

          value={name} onChange={e=>{setName(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&go()}/>
        <label style={S.label}>Grupa</label>
        <input style={{...S.input,marginBottom:12}} placeholder="ex. 214"

      </div>
    </div>
  );
}

function QuizScreen({studentName, studentGroup, studentSpec, labId, module, onFinish, sessionTeacher, sessionSemester}) {
  const _labQMap = {
    lp1a:LP1A_QUESTIONS, lp1b:LP1B_QUESTIONS,
    lp2a:LP2A_QUESTIONS, lp2b:LP2B_QUESTIONS,
    lp3a:LP3A_QUESTIONS, lp3b:LP3B_QUESTIONS,
    lp4a:LP4A_QUESTIONS, lp4b:LP4B_QUESTIONS,
    lp5a:LP5A_QUESTIONS, lp5b:LP5B_QUESTIONS,
    lp6a:LP6A_QUESTIONS, lp6b:LP6B_QUESTIONS,
  };
  const _allQs = (_labQMap[labId] || LP4B_QUESTIONS)[module.id] || [];
  const [qs]          = useState(() => shufflePick(_allQs, module.count || _allQs.length));
  const [cur, setCur] = useState(0);
  const [sel, setSel] = useState(null);
  const [ans, setAns] = useState([]);
  const [startT]      = useState(Date.now());
  const [showExp, setShowExp] = useState(false);
  const [confirmed, setConfirmed] = useState(false);

  const q = qs[cur];
  if (!q) return null;

  const confirm = () => {
    if (sel===null) return;
    setConfirmed(true);
    setShowExp(true);
  };

  const next = () => {
    const newAns = [...ans, {q:q.q, chosen:sel, correct:q.c, options:q.o, explanation:q.e||""}];
    if (cur+1 >= qs.length) {
      const score = newAns.filter(a=>a.chosen===a.correct).length;
      const pct = Math.round(score/qs.length*100);
      const timeUsed = Math.round((Date.now()-startT)/1000);
      const entry = {
        name:studentName, group:studentGroup, spec:studentSpec||"",
        labId, labCode:module.labCode||(LABS.find(l=>l.id===labId)||{}).code,
        module:module.id, moduleTitle:module.title,
        score, total:qs.length, pct, timeUsed,
        timestamp:Date.now(),
        teacher:sessionTeacher||"", semester:sessionSemester||"",
        specialization:studentSpec||""
      };
      addResult(entry).catch(()=>{});
      onFinish(entry, newAns, qs);
    } else {
      setAns(newAns);
      setCur(cur+1);
      setSel(null);
      setShowExp(false);
      setConfirmed(false);
    }
  };

  const pct = Math.round((cur)/qs.length*100);
  const pctColor = (p) => p>=80?"#16a34a":p>=60?"#ca8a04":"#dc2626";

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",padding:"16px"}}>
      <div style={{maxWidth:680,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,background:"#fff",borderRadius:14,padding:"12px 16px",border:"1.5px solid #b2ddc8"}}>
          <div style={{flex:1}}>
            <p style={{fontWeight:700,color:module.color,fontSize:13,margin:"0 0 2px"}}>{module.icon} {module.title}</p>
            <p style={{color:"#4a9a6a",fontSize:12,margin:0}}>{studentName} · Î{cur+1}/{qs.length}</p>
          </div>
          <div style={{textAlign:"right"}}>
            <p style={{fontWeight:800,color:pctColor(pct),fontSize:16,margin:"0 0 2px"}}>{cur}/{qs.length}</p>
            <p style={{color:"#94a3b8",fontSize:11,margin:0}}>răspunsuri</p>
          </div>
        </div>
        <div style={{height:6,background:"#e2e8f0",borderRadius:3,marginBottom:16,overflow:"hidden"}}>
          <div style={{height:"100%",background:"linear-gradient(90deg,"+module.color+",#10b981)",width:pct+"%",transition:"width .4s",borderRadius:3}}/>
        </div>
        {q.s && <div style={{background:"#fef9c3",border:"1px solid #fde68a",borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#92400e"}}>📊 {q.s}</div>}
        <div style={{background:"#fff",border:"1.5px solid #b2ddc8",borderRadius:16,padding:"20px",marginBottom:16,boxShadow:"0 2px 12px rgba(0,0,0,.06)"}}>
          <p style={{fontWeight:700,fontSize:16,color:"#0a2a18",lineHeight:1.5,margin:"0 0 16px"}}>{q.q}</p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {q.o.map((opt,i)=>{
              let bg="#f8fdfb", border="1.5px solid #b2ddc8", color="#0a2a18", fw=400;
              if (confirmed) {
                if (i===q.c) { bg="#dcfce7"; border="2px solid #16a34a"; color="#166534"; fw=700; }
                else if (i===sel && i!==q.c) { bg="#fee2e2"; border="2px solid #dc2626"; color="#991b1b"; }
              } else if (sel===i) { bg=module.dim; border="2px solid "+module.color; color=module.color; fw=700; }
              return (
                <button key={i} onClick={()=>{if(!confirmed){setSel(i);}}}
                  style={{padding:"12px 16px",borderRadius:10,border,background:bg,color,fontWeight:fw,fontSize:14,textAlign:"left",cursor:confirmed?"default":"pointer",transition:"all .15s"}}>
                  <span style={{opacity:.6,marginRight:8}}>{String.fromCharCode(65+i)}.</span>{opt}
                </button>
              );
            })}
          </div>
        </div>
        {showExp && q.e && (
          <div style={{background:"#eff6ff",border:"1.5px solid #bfdbfe",borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#1e40af",lineHeight:1.6}}>
            💡 {q.e}
          </div>
        )}
        {!confirmed
          ? <button style={{...S.btnG,opacity:sel===null?.4:1}} onClick={confirm} disabled={sel===null}>Confirmă răspunsul</button>
          : <button style={S.btnG} onClick={next}>{cur+1>=qs.length?"Finalizează testul →":"Următoarea întrebare →"}</button>
        }
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// RESULT SCREEN
// ════════════════════════════════════════════════════════════
function ResultScreen({studentName, studentGroup, labId, module, entry, answers, qs, onRestart, onModules}) {
  const pctColor = (p) => p>=80?"#16a34a":p>=60?"#ca8a04":"#dc2626";
  const pc = pctColor(entry.pct);
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",padding:"24px 16px"}}>
      <div style={{maxWidth:680,margin:"0 auto"}}>
        <div style={{background:"#fff",border:"1.5px solid #b2ddc8",borderRadius:20,padding:"28px 24px",marginBottom:20,textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,.08)"}}>
          <div style={{width:88,height:88,borderRadius:"50%",border:"5px solid "+pc,margin:"0 auto 14px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:26,fontWeight:800,color:pc,lineHeight:1}}>{entry.score}</span>
            <span style={{fontSize:12,color:pc,opacity:.7}}>/{entry.total}</span>
          </div>
          <h2 style={{color:"#0a2a18",fontSize:22,margin:"0 0 4px"}}>{entry.pct}% — {entry.pct>=80?"Excelent! 🎉":entry.pct>=60?"Bun! 👍":"Mai încearcă! 💪"}</h2>
          <p style={{color:"#4a9a6a",fontSize:14,margin:"0 0 4px"}}>{studentName} · {module.title}</p>
          <p style={{color:"#94a3b8",fontSize:12,margin:0}}>Timp: {entry.timeUsed}s · {new Date().toLocaleString("ro-RO")}</p>
        </div>
        <div style={{display:"flex",gap:10,marginBottom:20}}>
          <button style={{...S.btnG,flex:1}} onClick={onRestart}>🔄 Reîncepe</button>
          <button style={{...S.btnW,flex:1}} onClick={onModules}>← Module</button>
        </div>
        <h3 style={{color:"#0a2a18",fontSize:16,marginBottom:12}}>Răspunsuri detaliate</h3>
        {answers.map((a,i)=>{
          const correct = a.chosen===a.correct;
          return (
            <div key={i} style={{background:"#fff",border:"1.5px solid "+(correct?"#86efac":"#fca5a5"),borderRadius:12,padding:"14px 16px",marginBottom:10}}>
              <p style={{fontWeight:700,fontSize:14,color:"#0a2a18",margin:"0 0 8px"}}>{i+1}. {a.q}</p>
              <p style={{fontSize:13,color:correct?"#16a34a":"#dc2626",fontWeight:600,margin:"0 0 4px"}}>{correct?"✅":"❌"} {a.options[a.chosen]}</p>
              {!correct && <p style={{fontSize:13,color:"#16a34a",margin:"0 0 4px"}}>✓ Corect: {a.options[a.correct]}</p>}
              {a.explanation && <p style={{fontSize:12,color:"#4a9a6a",margin:"4px 0 0",lineHeight:1.5}}>{a.explanation}</p>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// ERROR SCREEN
// ════════════════════════════════════════════════════════════
function ErrorScreen({message, onBack}) {
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{...S.card,maxWidth:380,textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:10}}>⚠️</div>
        <h2 style={{color:"#0a2a18",margin:"0 0 8px"}}>Eroare</h2>
        <p style={{color:"#4a9a6a",fontSize:14,margin:"0 0 20px"}}>{message}</p>
        <button style={S.btnG} onClick={onBack}>← Înapoi acasă</button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [screen,      setScreen]      = useState("home");
  const [session,     setSession]     = useState(null);
  const [student,     setStudent]     = useState(null);
  const [module,      setModule]      = useState(null);
  const [result,      setResult]      = useState(null);
  const [answers,     setAnswers]     = useState(null);
  const [quizQs,      setQuizQs]      = useState([]);
  const [teacherName, setTeacherName] = useState("");
  const [showDemo,    setShowDemo]    = useState(false);
  const [errMsg,      setErrMsg]      = useState("");
  const [pendingToken,setPendingToken]= useState(null);

  const handleJoinToken = token => { setPendingToken(token); setScreen("tokenJoin"); };

  if (screen==="home")        return <HomePage onAdminLogin={(t)=>{setTeacherName(t);setScreen("admin");}} onJoinToken={handleJoinToken}/>;
  if (screen==="adminLogin")  return <AdminLogin onSuccess={(t)=>{setTeacherName(t);setScreen("admin");}} onBack={()=>setScreen("home")}/>;
  if (screen==="admin")       return <AdminPanel teacherName={teacherName} onBack={()=>setScreen("home")}/>;
  if (screen==="tokenJoin")   return (
    <TokenJoin token={pendingToken}
      onValid={s=>{setSession(s);setScreen("studentLogin");}}
      onInvalid={msg=>{setErrMsg(msg);setScreen("error");}}/>
  );
  if (screen==="error")       return <ErrorScreen message={errMsg} onBack={()=>{setScreen("home");window.history.pushState({},"",window.location.pathname);}}/>;
  if (screen==="studentLogin")return <StudentLogin session={session} onLogin={(n,g,sp)=>{setStudent({name:n,group:g,spec:sp||""});setScreen("labRouter");}}/>;

  if (screen==="labRouter") {
    if (session?.labCode?.endsWith("-FISA")) { setScreen("fisa_grup"); }
    else if (session?.labId==="lp1a") setScreen("lp1a_modules");
    else if (session?.labId==="lp1b") setScreen("lp1b_modules");
    else if (session?.labId==="lp2a") setScreen("lp2a_modules");
    else if (session?.labId==="lp2b") setScreen("lp2b_modules");
    else if (session?.labId==="lp3a") setScreen("lp3a_modules");
    else if (session?.labId==="lp3b") setScreen("lp3b_modules");
    else if (session?.labId==="lp6a") setScreen("lp6a_modules");
    else if (session?.labId==="lp6b") setScreen("lp6b_modules");
    else if (session?.labId==="lp4a") setScreen("lp4a_modules");
    else if (session?.labId==="lp4b") setScreen("lp4b_modules");
    else if (session?.labId==="lp5a") setScreen("lp5a_modules");
    else if (session?.labId==="lp5b") setScreen("lp5b_modules");
    else { setErrMsg("Practica "+session?.labCode+" nu are quiz activ inca."); setScreen("error"); }
    return null;
  }

  if (screen==="fisa_grup") return (
    <FisaGrupScreen session={session} student={student} onBack={()=>setScreen("home")}/>
  );
  if (screen==="lp1a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp1a")} modules={LP1A_MODULES} questions={LP1A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp1b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp1b")} modules={LP1B_MODULES} questions={LP1B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp2a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp2a")} modules={LP2A_MODULES} questions={LP2A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp2b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp2b")} modules={LP2B_MODULES} questions={LP2B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp3a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp3a")} modules={LP3A_MODULES} questions={LP3A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp3b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp3b")} modules={LP3B_MODULES} questions={LP3B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp6a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp6a")} modules={LP6A_MODULES} questions={LP6A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp6b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp6b")} modules={LP6B_MODULES} questions={LP6B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp5b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp5b")} modules={LP5B_MODULES} questions={LP5B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp5a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp5a")} modules={LP5A_MODULES} questions={LP5A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp4a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp4a")} modules={LP4A_MODULES} questions={LP4A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp4b_modules") return <LP4BModuleSelect studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (showDemo) return <DemoScreen lab={LABS.find(l=>l.id===session?.labId)} onBack={()=>setShowDemo(false)}/>;
  if (screen==="quiz" && module) return (
    <QuizScreen studentName={student?.name} studentGroup={student?.group} studentSpec={student?.spec||""}
      labId={session?.labId} module={module} sessionTeacher={session?.teacher||""} sessionSemester={session?.semester||""}
      onFinish={(e,a,q)=>{setResult(e);setAnswers(a);setQuizQs(q);setScreen("result");}}/>
  );
  if (screen==="result" && result) return (
    <ResultScreen studentName={student?.name} studentGroup={student?.group}
      labId={session?.labId} module={module} entry={result} answers={answers} qs={quizQs||[]}
      onRestart={()=>{setResult(null);setAnswers(null);setScreen("quiz");}}
      onModules={()=>{setResult(null);setAnswers(null);setModule(null);setScreen((session?.labId||"lp4b")+"_modules");}}/>
  );
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
