async function uploadFile(teacher, labId, file) {
  const safeName = teacher.replace(/[^a-zA-Z0-9]/g, "_");
  const path = `${labId}/${safeName}/${Date.now()}_${file.name}`;
  const res = await fetch(`${SB_STORAGE}/object/materiale/${encodeURIComponent(path)}`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": file.type || "application/octet-stream", "x-upsert": "false" },
    body: file
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return path;
}
async function listFiles(teacher, labId) {
  // Own files only (for upload/delete)
  const safeName = teacher.replace(/[^a-zA-Z0-9]/g, "_");
  const prefix = `${labId}/${safeName}/`;
  const res = await fetch(`${SB_STORAGE}/object/list/materiale`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix, limit: 100, sortBy: { column: "created_at", order: "desc" } })
  });
  const own = res.ok ? (await res.json() || []) : [];
  return own.map(f => ({
    name: f.name.replace(/^\d+_/, ""),
    path: prefix + f.name,
    url: `${SB_STORAGE}/object/public/materiale/${encodeURIComponent(prefix + f.name)}`,
    size: f.metadata?.size || 0,
    created: f.created_at,
    isOwn: true,
    uploaderDisplay: teacher
  }));
}
async function listAllFiles(labId) {
  // All teachers' files for a lab
  const prefix = `${labId}/`;
  const res = await fetch(`${SB_STORAGE}/object/list/materiale`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix, limit: 500 })
  });
  if (!res.ok) return [];
  const folders = (await res.json() || []).filter(f => !f.name.includes("."));
  const allFiles = [];
  for (const folder of folders) {
    const sub = `${labId}/${folder.name}/`;
    const r2 = await fetch(`${SB_STORAGE}/object/list/materiale`, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: sub, limit: 100, sortBy: { column: "created_at", order: "desc" } })
    });
    if (!r2.ok) continue;
    const files = await r2.json() || [];
    const uploader = folder.name.replace(/_/g, " ");
    files.forEach(f => allFiles.push({
      name: f.name.replace(/^\d+_/, ""),
      path: sub + f.name,
      url: `${SB_STORAGE}/object/public/materiale/${encodeURIComponent(sub + f.name)}`,
      size: f.metadata?.size || 0,
      created: f.created_at,
      isOwn: false,
      uploaderDisplay: uploader
    }));
  }
  return allFiles;
}
async function deleteFile(path) {
  const res = await fetch(`${SB_STORAGE}/object/materiale/${encodeURIComponent(path)}`, {
    method: "DELETE",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
  });
  return res.ok;
}
function getFileIcon(name) {
  const ext = name.split(".").pop().toLowerCase();
  if (["pdf"].includes(ext)) return "📄";
  if (["ppt","pptx"].includes(ext)) return "📊";
  if (["doc","docx"].includes(ext)) return "📝";
  if (["mp4","mov","avi"].includes(ext)) return "🎬";
  if (["png","jpg","jpeg","gif"].includes(ext)) return "🖼️";
  return "📎";
}

function generateToken() {
  return Math.random().toString(36).substr(2,6).toUpperCase() + Date.now().toString(36).toUpperCase();
}

function generateQRDataURL(text) {
  return new Promise((resolve) => {
    const div = document.getElementById("qr-canvas");
    div.innerHTML = "";
    try {
      new QRCode(div, {text, width:200, height:200, colorDark:"#0a2a18", colorLight:"#ffffff"});
      setTimeout(() => {
        const canvas = div.querySelector("canvas");
        if (canvas) resolve(canvas.toDataURL("image/png"));
        else {
          const img = div.querySelector("img");
          if (img) resolve(img.src);
          else resolve(null);
        }
      }, 300);
    } catch(e) { resolve(null); }
  });
}

// Fisher-Yates shuffle + random pick
function shufflePick(arr, n) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return n ? a.slice(0, n) : a;
}

  );

// NOMENCLATOR EDITOR
// ════════════════════════════════════════════════════════════
function NomenclatorEditor({nomenclator, onChange}) {
  const [newSpec, setNewSpec] = useState("");
  const [newYear, setNewYear] = useState("");
  const [newMod,  setNewMod]  = useState("");

  const addItem = (key, val, reset) => {
    const v = val.trim();
    if (!v) return;
    if (nomenclator[key].includes(v)) return;
    onChange({...nomenclator, [key]: [...nomenclator[key], v]});
    reset("");
  };
  const removeItem = (key, val) => {
    onChange({...nomenclator, [key]: nomenclator[key].filter(x=>x!==val)});
  };
  const reset = () => { onChange(DEFAULT_NOMENCLATOR); saveNomenclator(DEFAULT_NOMENCLATOR); };

  const Section = ({title, icon, itemKey, items, newVal, setNewVal, placeholder}) => (
    <div style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:14,padding:20,marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,color:"#1a3a28",marginBottom:12}}>{icon} {title}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
        {items.map(item=>(
          <div key={item} style={{display:"flex",alignItems:"center",gap:6,background:"#f0fdf4",border:"1px solid #86efac",borderRadius:20,padding:"4px 10px 4px 12px"}}>
            <span style={{fontSize:13,color:"#166534",fontWeight:500}}>{item}</span>
            <button onClick={()=>removeItem(itemKey,item)}
              style={{background:"none",border:"none",cursor:"pointer",color:"#dc2626",fontSize:14,lineHeight:1,padding:"0 2px"}}>×</button>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8}}>
        <input style={{...S.input,flex:1,marginBottom:0}} placeholder={placeholder}
          value={newVal} onChange={e=>setNewVal(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&addItem(itemKey,newVal,setNewVal)}/>
        <button onClick={()=>addItem(itemKey,newVal,setNewVal)}
          style={{padding:"10px 18px",background:"#10b981",color:"#fff",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:13,whiteSpace:"nowrap"}}>
          + Adaugă
        </button>
      </div>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <h3 style={{color:"#0a2a18",fontSize:16,margin:"0 0 4px"}}>🗂️ Nomenclator</h3>
          <p style={{color:"#4a9a6a",fontSize:13,margin:0}}>Gestionează specializările, anii și modulele disponibile</p>
        </div>
        <button onClick={reset}
          style={{padding:"8px 14px",background:"#fff",border:"1.5px solid #fca5a5",borderRadius:8,color:"#dc2626",fontSize:12,cursor:"pointer",fontWeight:600}}>
          ↺ Reset implicit
        </button>
      </div>

      <Section title="Specializări" icon="🎓" itemKey="specializations"
        items={nomenclator.specializations} newVal={newSpec} setNewVal={setNewSpec}
        placeholder="ex. Farmacie" />
      <Section title="Ani" icon="📆" itemKey="years"
        items={nomenclator.years} newVal={newYear} setNewVal={setNewYear}
        placeholder="ex. 2027" />
      <Section title="Module" icon="📚" itemKey="modules"
        items={nomenclator.modules} newVal={newMod} setNewVal={setNewMod}
        placeholder="ex. Modul 5" />

      <p style={{fontSize:12,color:"#94a3b8",marginTop:8}}>
        💾 Salvat automat în browser. Modificările sunt vizibile imediat în generarea QR.
      </p>
    </div>
  );
}

// Fisa styles
const FS = {
  page: {minHeight:"100vh",background:"linear-gradient(135deg,#f0f4f8,#e8f0f8)",padding:"0 0 80px"},
  card: {background:"#fff",borderRadius:14,padding:"20px 18px",boxShadow:"0 2px 12px rgba(0,0,0,.07)"},
  qCard: {background:"#fff",borderRadius:12,padding:"16px 16px 12px",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,.05)"},
  ta: {width:"100%",minHeight:80,padding:"9px 12px",border:"1.5px solid #cbd5e1",borderRadius:9,fontSize:14,fontFamily:"inherit",resize:"vertical",lineHeight:1.6,color:"#1e293b",background:"#f8fafc"},
  hdr: {background:"#0d2040",color:"white",padding:"14px 18px",position:"sticky",top:0,zIndex:100,display:"flex",alignItems:"center",gap:12,boxShadow:"0 2px 12px rgba(0,0,0,.3)"},
};

function FisaGrupScreen({session, student, onBack}) {
  const labId = session?.labId || "lp1a";
  const allFise = FISE_DATA[labId] || FISE_DATA.lp1a;

  const [selectedFisa, setSelectedFisa] = useState(null);
  const [answers, setAnswers] = useState({});
  const [concluzii, setConcluzii] = useState({});
  const [phase, setPhase] = useState("select"); // select | fill | evaluating | done
  const [evalResults, setEvalResults] = useState(null);
  const [progress, setProgress] = useState(0);

  // ── GRUP SELECT ──────────────────────────────────────────
  if (phase === "select") return (
    <div style={FS.page}>
      <div style={FS.hdr}>
        <span style={{fontSize:24}}>📋</span>
        <div>
          <div style={{fontWeight:700,fontSize:16}}>Fișe de Lucru — {session?.labCode?.replace("-FISA","")}</div>
          <div style={{fontSize:12,color:"#90b4d8"}}>{student?.name} · Grupa {student?.group}</div>
        </div>
      </div>
      <div style={{maxWidth:600,margin:"24px auto",padding:"0 16px"}}>
        <div style={{...FS.card,marginBottom:16,background:"#fef9c3",border:"1.5px solid #fde68a"}}>
          <p style={{color:"#92400e",fontSize:13,margin:0,lineHeight:1.7}}>
            <strong>📌 Instrucțiune:</strong> Selectați fișa grupei voastre, analizați cazul, răspundeți la întrebări,
            trimiteți răspunsurile. La final prezentați concluziile în <strong>2 minute</strong>.
          </p>
        </div>
        <h3 style={{color:"#0d2040",fontSize:16,margin:"0 0 14px",fontWeight:700}}>Selectați fișa grupei:</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {allFise.map((f,i) => (
            <button key={f.id} onClick={()=>{setSelectedFisa(f);setPhase("fill");}}
              style={{padding:"14px 8px",borderRadius:12,border:`2px solid ${f.color}30`,background:`${f.color}10`,
                cursor:"pointer",textAlign:"center",transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center",gap:6}}
              onMouseOver={e=>{e.currentTarget.style.borderColor=f.color;e.currentTarget.style.background=`${f.color}20`;}}
              onMouseOut={e=>{e.currentTarget.style.borderColor=`${f.color}30`;e.currentTarget.style.background=`${f.color}10`;}}>
              <span style={{fontSize:26}}>{f.emoji}</span>
              <span style={{fontSize:12,fontWeight:700,color:f.color}}>Grupa {i+1}</span>
              <span style={{fontSize:10,color:"#64748b",lineHeight:1.3}}>{f.title.split(" — ")[0]}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  // ── FILL PHASE ───────────────────────────────────────────
  const f = selectedFisa;
  const answered = f ? f.qs.filter((_,i) => (answers[i]||"").trim().length > 10).length : 0;
  const canSubmit = f && answered >= Math.ceil(f.qs.length / 2);

  if (phase === "fill") return (
    <div style={FS.page}>
      <div style={FS.hdr}>
        <span style={{fontSize:22}}>{f.emoji}</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:15}}>Grupa {allFise.indexOf(f)+1} — {f.title.split(" — ")[0]}</div>
          <div style={{fontSize:11,color:"#90b4d8"}}>{student?.name} · {answered}/{f.qs.length} completate</div>
        </div>
        <button onClick={()=>setPhase("select")}
          style={{padding:"6px 12px",background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.3)",
            borderRadius:8,color:"white",fontSize:12,cursor:"pointer"}}>← Înapoi</button>
      </div>
      {/* Progress */}
      <div style={{height:3,background:"#e2e8f0"}}>
        <div style={{height:"100%",background:"linear-gradient(90deg,#2E86DE,#10b981)",width:`${answered/f.qs.length*100}%`,transition:"width .4s"}}/>
      </div>
      <div style={{maxWidth:680,margin:"0 auto",padding:"16px 14px 90px"}}>
        {/* Case */}
        <div style={{...FS.card,marginBottom:16,background:"#eff6ff",border:"1.5px solid #bfdbfe"}}>
          <div style={{fontSize:12,fontWeight:700,color:"#1e40af",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>📁 Cazul prezentat</div>
          {f.caz.map((item,i) => (
            <div key={i} style={{display:"flex",gap:8,padding:"4px 0",borderBottom:i<f.caz.length-1?"1px solid #dbeafe":"none"}}>
              <span style={{fontSize:13,color:"#64748b",flex:1}}>{item.l}:</span>
              <span style={{fontSize:13,fontWeight:700,color:"#0d2040",fontFamily:"monospace"}}>{item.v}</span>
            </div>
          ))}
        </div>
        {/* Questions */}
        {f.qs.map((q,i) => (
          <div key={i} style={{...FS.qCard, borderLeft:`4px solid ${(answers[i]||"").trim().length>10?f.color:"#cbd5e1"}`}}>
            <div style={{fontSize:11,fontWeight:700,color:(answers[i]||"").trim().length>10?f.color:"#94a3b8",textTransform:"uppercase",letterSpacing:".07em",marginBottom:5}}>
              {(answers[i]||"").trim().length>10?"✓ ":""}Întrebarea {i+1}
            </div>
            <div style={{fontSize:15,fontWeight:600,color:"#0d2040",marginBottom:8,lineHeight:1.4}}>{q.q}</div>
            <textarea style={FS.ta} placeholder={"💡 " + q.h}
              value={answers[i]||""}
              onChange={e=>{const na={...answers};na[i]=e.target.value;setAnswers(na);}}
            />
            <div style={{textAlign:"right",fontSize:11,color:"#94a3b8",marginTop:3}}>{(answers[i]||"").length} caractere</div>
          </div>
        ))}
        {/* Concluzie */}
        <div style={{...FS.card,background:"#f0fdf4",border:"1.5px solid #bbf7d0",marginTop:8}}>
          <div style={{fontSize:12,fontWeight:700,color:"#16a34a",textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>✅ Concluzia grupei</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {f.conc.map((label,i)=>(
              <div key={i}>
                <div style={{fontSize:12,fontWeight:600,color:"#4a9a6a",marginBottom:3}}>{label}:</div>
                <textarea style={{...FS.ta,minHeight:55,borderColor:"#bbf7d0"}}
                  placeholder="Concluzie scurtă…"
                  value={concluzii[i]||""}
                  onChange={e=>{const nc={...concluzii};nc[i]=e.target.value;setConcluzii(nc);}}
                />
              </div>
            ))}
          </div>
        </div>
      </div>
      {/* Float bar */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"white",borderTop:"1.5px solid #e2e8f0",padding:"10px 16px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 -4px 20px rgba(0,0,0,.08)"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:700,color:"#16a34a"}}>{answered} / {f.qs.length} întrebări</div>
          <div style={{fontSize:11,color:"#94a3b8"}}>completate</div>
        </div>
        <button disabled={!canSubmit} onClick={()=>submitFisaGrup(f,answers,concluzii,student,session,setPhase,setEvalResults)}
          style={{padding:"12px 22px",background:canSubmit?"linear-gradient(135deg,#10b981,#059669)":"#e2e8f0",
            color:canSubmit?"white":"#94a3b8",border:"none",borderRadius:11,fontSize:15,fontWeight:700,cursor:canSubmit?"pointer":"default",transition:"all .2s"}}>
          ✉️ Trimite răspunsurile
        </button>
      </div>
    </div>
  );

  // ── EVALUATING ───────────────────────────────────────────
  if (phase === "evaluating") return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#f0f4f8,#e8f0f8)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{...FS.card,maxWidth:440,textAlign:"center",padding:"40px 28px"}}>
        <div style={{width:60,height:60,border:"5px solid #e2e8f0",borderTopColor:"#2E86DE",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 20px"}}/>
        <h2 style={{color:"#0d2040",fontSize:20,margin:"0 0 8px"}}>Se evaluează răspunsurile…</h2>
        <p style={{color:"#64748b",fontSize:14,lineHeight:1.7}}>Claude AI analizează fiecare răspuns în raport cu cunoștințele de igienă.</p>
      </div>
    </div>
  );

  // ── RESULTS ─────────────────────────────────────────────
  if (phase === "done" && evalResults) {
    const {evaluations, totalScore, maxScore, pct} = evalResults;
    const scoreColor = pct>=80?"#16a34a":pct>=60?"#d97706":"#dc2626";
    return (
      <div style={FS.page}>
        <div style={FS.hdr}>
          <span style={{fontSize:22}}>✅</span>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>Rezultate — {f.title.split(" — ")[0]}</div>
            <div style={{fontSize:11,color:"#90b4d8"}}>{student?.name} · Trimis profesorului</div>
          </div>
        </div>
        <div style={{maxWidth:620,margin:"20px auto",padding:"0 14px 40px"}}>
          {/* Score hero */}
          <div style={{...FS.card,textAlign:"center",marginBottom:16,padding:"28px 20px"}}>
            <div style={{background:"#dcfce7",color:"#16a34a",fontSize:12,fontWeight:700,padding:"5px 14px",borderRadius:20,display:"inline-block",marginBottom:14}}>
              ✅ Răspunsuri trimise profesorului
            </div>
            <div style={{width:100,height:100,borderRadius:"50%",border:`6px solid ${scoreColor}`,margin:"0 auto 14px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:30,fontWeight:800,color:scoreColor,lineHeight:1}}>{totalScore}</span>
              <span style={{fontSize:12,color:scoreColor,opacity:.7}}>/{maxScore}</span>
            </div>
            <h3 style={{color:"#0d2040",margin:"0 0 4px"}}>{pct>=80?"Excelent! 🎉":pct>=60?"Bun! 👍":"Necesită îmbunătățiri"}</h3>
            <p style={{color:"#64748b",fontSize:13}}>{student?.name} · Grupa {student?.group}</p>
          </div>
          {/* Feedback per question */}
          {f.qs.map((q,i)=>{
            const ev = evaluations[i] || {score:0,feedback:"Fără evaluare"};
            const cls = ev.score===2?"good":ev.score===1?"partial":"bad";
            const clsBg = ev.score===2?"#f0fdf4":ev.score===1?"#fffbeb":"#fef2f2";
            const clsColor = ev.score===2?"#16a34a":ev.score===1?"#d97706":"#dc2626";
            return (
              <div key={i} style={{...FS.card,marginBottom:10,borderLeft:`4px solid ${clsColor}`}}>
                <div style={{fontSize:13,fontWeight:600,color:"#0d2040",marginBottom:6}}>Î{i+1}. {q.q}</div>
                <div style={{fontSize:13,color:"#475569",background:"#f8fafc",borderRadius:7,padding:"7px 10px",marginBottom:7,borderLeft:"3px solid #e2e8f0"}}>
                  {answers[i]||"(fără răspuns)"}
                </div>
                <div style={{fontSize:13,background:clsBg,borderLeft:`3px solid ${clsColor}`,padding:"8px 10px",borderRadius:7,lineHeight:1.6}}>
                  🤖 <strong>Evaluare AI:</strong> {ev.feedback}
                </div>
                <div style={{marginTop:6}}>
                  <span style={{background:ev.score===2?"#dcfce7":ev.score===1?"#fef9c3":"#fee2e2",color:clsColor,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
                    {ev.score===2?"✅ 2/2 puncte":ev.score===1?"⚠️ 1/2 puncte":"❌ 0/2 puncte"}
                  </span>
                </div>
              </div>
            );
          })}
          <div style={{background:"#eff6ff",borderRadius:12,padding:"12px 16px",marginTop:8,fontSize:13,color:"#1e40af"}}>
            <strong>⏱️ Urmează:</strong> Prezentați concluziile grupei în <strong>maximum 2 minute</strong>.
          </div>
          <button onClick={onBack} style={{width:"100%",padding:14,background:"#0d2040",color:"white",border:"none",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer",marginTop:14}}>
            🏠 Înapoi la pagina principală
          </button>
        </div>
      </div>
    );
  }

  return null;
}

// ── AI Submit function ──────────────────────────────────────
async function submitFisaGrup(f, answers, concluzii, student, session, setPhase, setEvalResults) {
  setPhase("evaluating");

  const prompt = `Ești profesor de igienă. Evaluează răspunsurile unui student la fișa de lucru "${f.title}".

Context caz: ${f.caz.map(i=>`${i.l}: ${i.v}`).join(", ")}

${f.qs.map((q,i)=>`Întrebarea ${i+1}: ${q.q}
Răspuns: ${answers[i]||"(fără răspuns)"}`).join("

")}

Acordă scor (0, 1 sau 2 puncte) și feedback scurt (1-2 prop.) în română pentru fiecare din cele ${f.qs.length} întrebări.
Criterii: 2p=corect complet cu termeni specifici, 1p=parțial/direcție bună, 0p=incorect/absent.
Răspunde NUMAI cu JSON valid, fără markdown: {"evaluations":[{"score":2,"feedback":"..."},...]}
Array-ul trebuie să conțină EXACT ${f.qs.length} obiecte.`;

  let evaluations = [];
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text || "{}";
    const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
    evaluations = parsed.evaluations || [];
  } catch(e) {
    evaluations = f.qs.map(()=>({score:1,feedback:"Răspuns înregistrat — evaluare manuală de profesor."}));
  }

  const totalScore = evaluations.reduce((s,e)=>s+(e.score||0),0);
  const maxScore = f.qs.length * 2;
  const pct = Math.round(totalScore/maxScore*100);

  // Save to Supabase
  const SB_URL = "https://hgknirjorjvlofhngvcp.supabase.co";
  const SB_KEY = "sb_publishable_PnUOkG2Tpw3wKa9hTZc3Yw_T0bnhFAO";
  try {
    await fetch(`${SB_URL}/rest/v1/results`, {
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Prefer":"return=minimal"},
      body:JSON.stringify({
        session_id: session?.token||null, name:student?.name, grp:student?.group,
        lab_id: session?.labId, lab_code: session?.labCode,
        module:`fisa_${f.id}`, module_title:`Fișă Grupă: ${f.title}`,
        score:totalScore, total:maxScore, pct, time_used:0,
        teacher:session?.teacher||"", semester:session?.semester||"",
        specialization:student?.spec||""
      })
    });
  } catch(e) { console.error("Supabase save error:", e); }

  setEvalResults({evaluations, totalScore, maxScore, pct});
  setPhase("done");
}

function FileManager({teacherName, selLab}) {
  const [files, setFiles]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [uploading, setUploading] = React.useState(false);
  const [msg, setMsg]             = React.useState({type:"", text:""});
  const fileRef = React.useRef();

  const load = () => {
    setLoading(true);
    Promise.all([
      listFiles(teacherName, selLab.id),
      listAllFiles(selLab.id)
    ]).then(([own, all]) => {
      const ownPaths = new Set(own.map(f => f.path));
      const others   = all.filter(f => !ownPaths.has(f.path));
      const merged   = [...own, ...others].sort((a,b) => new Date(b.created) - new Date(a.created));
      setFiles(merged);
      setLoading(false);
    }).catch(() => setLoading(false));
  };

  React.useEffect(() => { load(); }, [teacherName, selLab.id]);

  const onUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { setMsg({type:"err", text:"Fișierul e prea mare (max 50MB)"}); return; }
    setUploading(true); setMsg({type:"", text:""});
    try {
      await uploadFile(teacherName, selLab.id, file);
      setMsg({type:"ok", text:"✅ " + file.name + " — încărcat cu succes!"});
      load();
    } catch(e) {
      setMsg({type:"err", text:"❌ Eroare: " + e.message});
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = "";
  };

  const onDelete = async (path, name) => {
    if (!confirm("Ștergi " + name + "?")) return;
    await deleteFile(path);
    setMsg({type:"ok", text:"🗑️ " + name + " — șters."});
    load();
  };

  const fmt = (n) => n > 1048576 ? (n/1048576).toFixed(1)+"MB" : n > 1024 ? (n/1024).toFixed(0)+"KB" : n+"B";

  return (
    <div>
      <h3 style={{color:"#0a2a18",fontSize:16,margin:"0 0 4px"}}>{"📁 Fișiere — " + selLab.code}</h3>
      <p style={{color:"#4a9a6a",fontSize:13,margin:"0 0 16px"}}>{"PDF, PPT, Word pentru " + selLab.title + " — vizibile tuturor profesorilor"}</p>

      <div style={{background:"#f0fdf4",border:"2px dashed #86efac",borderRadius:12,padding:20,textAlign:"center",marginBottom:16,cursor:"pointer"}}
           onClick={() => fileRef.current && fileRef.current.click()}>
        <input ref={fileRef} type="file" style={{display:"none"}}
          accept=".pdf,.ppt,.pptx,.doc,.docx,.png,.jpg,.mp4"
          onChange={onUpload} />
        {uploading ? (
          <div>
            <div className="spin" style={{fontSize:28,display:"inline-block"}}>⏳</div>
            <p style={{color:"#16a34a",marginTop:8,fontWeight:600}}>Se încarcă...</p>
          </div>
        ) : (
          <div>
            <div style={{fontSize:32,marginBottom:6}}>📤</div>
            <p style={{color:"#16a34a",fontWeight:700,marginBottom:2}}>Click pentru a încărca</p>
            <p style={{color:"#4a9a6a",fontSize:12}}>PDF, PPT, PPTX, DOC, imagini (max 50MB)</p>
          </div>
        )}
      </div>

      {msg.text && (
        <p style={{color: msg.type==="err" ? "#dc2626" : "#16a34a", fontSize:13, fontWeight:600, marginBottom:8}}>
          {msg.text}
        </p>
      )}

      {loading ? (
        <div style={{textAlign:"center",padding:24,color:"#4a9a6a"}}>Se încarcă lista...</div>
      ) : files.length === 0 ? (
        <div style={{background:"#f8fafc",border:"1.5px solid #e2e8f0",borderRadius:10,padding:20,textAlign:"center",color:"#64748b"}}>
          <p style={{fontSize:28,marginBottom:8}}>📂</p>
          <p style={{fontWeight:600}}>{"Niciun fișier pentru " + selLab.code}</p>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {files.map((f, i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,background:"#fff",border:"1.5px solid #e2e8f0",borderLeft:"3px solid " + (f.isOwn ? "#16a34a" : "#94a3b8"),borderRadius:10,padding:"12px 14px"}}>
              <span style={{fontSize:22,flexShrink:0}}>{getFileIcon(f.name)}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:14,color:"#1a3a28",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div>
                <div style={{fontSize:11,color:"#64748b",marginTop:2}}>
                  <span style={{background: f.isOwn ? "#dcfce7" : "#f1f5f9", color: f.isOwn ? "#16a34a" : "#475569", borderRadius:4, padding:"1px 6px", marginRight:6, fontWeight:600}}>
                    {"👤 " + (f.isOwn ? "Eu" : f.uploaderDisplay)}
                  </span>
                  {fmt(f.size) + " · " + new Date(f.created).toLocaleDateString("ro-RO")}
                </div>
              </div>
              <a href={f.url} target="_blank" rel="noreferrer"
                style={{padding:"6px 12px",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:7,fontSize:12,fontWeight:600,color:"#16a34a",textDecoration:"none",flexShrink:0}}>
                ↗ Deschide
              </a>
              {f.isOwn ? (
                <button onClick={() => onDelete(f.path, f.name)}
                  style={{padding:"6px 10px",background:"#fff1f2",border:"1px solid #fca5a5",borderRadius:7,fontSize:12,color:"#dc2626",cursor:"pointer",flexShrink:0}}>
                  🗑
                </button>
              ) : null}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ④ TOKEN JOIN — validate QR and route to correct lab
// ════════════════════════════════════════════════════════════
function TokenJoin({token, onValid, onInvalid}) {
  useEffect(() => {
    getSession(token).then(session => {
      if (!session) { onInvalid("Cod QR invalid sau inexistent."); return; }
      if (Date.now() > session.expiresAt) { onInvalid("Codul QR a expirat. Cereți un cod nou de la profesor."); return; }
      onValid(session);
    }).catch(e => { console.error("getSession error:", e); onInvalid("Eroare de conexiune. Verificați internetul."); });
  }, [token]);

  return (
    <div style={S.page}>
      <div style={{...S.card, textAlign:"center"}}>
        <div className="spin" style={{fontSize:40, marginBottom:16}}>⏳</div>
        <p style={{color:"#2a7a50"}}>Se verifică codul QR...</p>
      </div>
    </div>
  );
}

function StudentLogin({session, onLogin}) {
  const [name, setName]           = useState("");
  const [group, setGroup]         = useState("");
  const [spec, setSpec]           = useState("");
  const [err, setErr]             = useState("");
  const lab = LABS.find(l=>l.id===session.labId) || {};

  const go = () => {
    if (name.trim().length < 3) { setErr("Introduceți numele complet (min. 3 caractere)."); return; }
    if (!group) { setErr("Selectați grupa!"); return; }
    if (!spec) { setErr("Selectați specializarea!"); return; }
    markSessionUsed(session.token, name.trim());
    onLogin(name.trim(), group, spec);
  };

  return (
    <div style={S.page}>
      <div style={S.card}>
        {/* Lab banner */}
        <div style={{background:lab.dim||"#f0f9f4",border:`1.5px solid ${lab.border||"#b2ddc8"}`,borderRadius:12,padding:"12px 16px",marginBottom:20,textAlign:"center"}}>
          <span style={{fontSize:32}}>{lab.icon}</span>
          <p style={{color:lab.color||"#10b981",fontSize:11,fontWeight:700,textTransform:"uppercase",margin:"4px 0 2px"}}>{lab.code}</p>
          <p style={{color:"#0a2a18",fontSize:14,fontWeight:600,margin:0}}>{lab.title}</p>
        </div>

        <label style={S.label}>Nume și prenume</label>
        <input style={{...S.input,marginBottom:14}} placeholder="ex. Ionescu Maria"
          value={name} onChange={e=>{setName(e.target.value);setErr("")}}
          onKeyDown={e=>e.key==="Enter"&&go()}/>

        <label style={S.label}>Grupă</label>
        <select style={{...S.input,marginBottom:14,cursor:"pointer",color:group?"#1a3a28":"#6a9a80"}}
          value={group} onChange={e=>{setGroup(e.target.value);setErr("")}}>
          <option value="">— Selectează grupa —</option>
          {GROUPS.map(g=><option key={g} value={g}>{g}</option>)}
        </select>

        <label style={S.label}>Specializare</label>
        <select style={{...S.input,marginBottom:4,cursor:"pointer",color:spec?"#1a3a28":"#6a9a80"}}
          value={spec} onChange={e=>{setSpec(e.target.value);setErr("")}}>
          <option value="">— Selectează specializarea —</option>
          {SPECIALIZATIONS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>

        {err && <p style={{color:"#dc2626",fontSize:13,margin:"8px 0 0",fontWeight:600}}>{err}</p>}
        <button style={{...S.btnG,marginTop:16}} onClick={go}>Intră la practică →</button>
      </div>
    </div>
  );
}

              <div style={{position:"absolute",top:0,left:0,right:0,height:4,background:`linear-gradient(90deg,${m.color},transparent)`}}/>

                  <div style={{display:"flex",gap:8}}>

                  </div>

          ))}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// ⑦ QUIZ SCREEN
// ════════════════════════════════════════════════════════════
function QuizScreen({studentName, studentGroup, studentSpec, labId, module, onFinish, sessionTeacher, sessionSemester}) {
  const _labQMap = {
    lp1a:LP1A_QUESTIONS, lp1b:LP1B_QUESTIONS,
    lp2a:LP2A_QUESTIONS, lp2b:LP2B_QUESTIONS,
    lp3a:LP3A_QUESTIONS, lp3b:LP3B_QUESTIONS,
    lp4a:LP4A_QUESTIONS, lp4b:LP4B_QUESTIONS,
    lp5a:LP5A_QUESTIONS, lp5b:LP5B_QUESTIONS,
    lp6a:LP6A_QUESTIONS, lp6b:LP6B_QUESTIONS,
  };
  const _allQs = (_labQMap[labId] || LP4B_QUESTIONS)[module.id] || [];
  const [qs] = useState(() => shufflePick(_allQs, module.count || _allQs.length));
  const [cur, setCur]         = useState(0);
  const [sel, setSel]         = useState(null);
  const [showExp, setShowExp] = useState(false);
  const [answers, setAnswers] = useState([]);
  const [timeLeft, setTimeLeft] = useState(module.time*60);
  const timerRef   = useRef();
  const answersRef = useRef([]);

  useEffect(()=>{
    timerRef.current = setInterval(()=>setTimeLeft(t=>{
      if(t<=1){clearInterval(timerRef.current);finish(answersRef.current, qs);return 0;}
      return t-1;
    }),1000);
    return()=>clearInterval(timerRef.current);
  },[]);

  const pick = i => { if(sel!==null)return; setSel(i); setShowExp(true); };
  const next = () => {
    const na=[...answersRef.current,{sel,correct:qs[cur].c}];
    answersRef.current=na; setAnswers(na);
    if(cur+1>=qs.length){clearInterval(timerRef.current);finish(na, qs);}
    else{setCur(c=>c+1);setSel(null);setShowExp(false);}
  };
  const finish = (fa, finalQs) => {
    clearInterval(timerRef.current);
    const score=fa.filter(a=>a.sel===a.correct).length;
    const pct=Math.round(score/qs.length*100);
    const entry={
      name:studentName, group:studentGroup, labId,
      labCode: LABS.find(l=>l.id===labId)?.code||"",
      module:module.id, moduleTitle:module.title,
      score, total:qs.length, pct,
      timestamp:Date.now(), timeUsed:module.time*60-timeLeft,
      teacher: sessionTeacher || "",
      semester: sessionSemester || "",
      specialization: studentSpec || "",
    };
    addResult(entry).catch(e => console.error("DB save error:", e));
    onFinish(entry, fa, finalQs);
  };

  const q=qs[cur]; const prog=(cur/qs.length)*100;
  const tc=timeLeft<60?"#dc2626":timeLeft<120?"#ca8a04":module.color;

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",padding:16}}>
      <div style={{maxWidth:720,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <span style={{...S.chip,background:module.dim,color:module.color,border:`1px solid ${module.border}`}}>{module.icon} {module.title}</span>
            <span style={{...S.chip,background:"#e8f5ee",color:"#1a6a40",border:"1px solid #b2ddc8"}}>👤 {studentName}</span>
            <span style={{...S.chip,background:"#eff6ff",color:"#1d4ed8",border:"1px solid #bfdbfe"}}>🏫 {studentGroup}</span>
          </div>
          <span style={{fontFamily:"monospace",fontSize:20,fontWeight:700,color:tc}}>⏱ {fmt(timeLeft)}</span>
        </div>
        <div style={{height:5,background:"#d4eddf",borderRadius:3,overflow:"hidden",marginBottom:4}}>
          <div style={{height:"100%",width:`${prog}%`,background:`linear-gradient(90deg,${module.color},${module.color}99)`,transition:"width .4s"}}/>
        </div>
        <p style={{color:"#4a9a6a",fontSize:12,textAlign:"right",marginBottom:14}}>{cur+1} / {qs.length}</p>

        <div style={{background:"#fff",border:`2px solid ${module.border}`,borderRadius:18,padding:"22px 20px",boxShadow:"0 4px 16px rgba(0,0,0,0.07)"}}>
          <span style={{color:module.color,fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:700}}>Întrebarea {cur+1}</span>
          {q.s && <div style={{background:"#f0f9f4",border:"1.5px solid #b2ddc8",borderRadius:10,padding:"11px 14px",margin:"10px 0 12px",color:"#1a4a30",fontSize:14,lineHeight:1.6}}>{q.s}</div>}
          <p style={{color:"#0a2a18",fontSize:15,lineHeight:1.65,margin:"8px 0 16px",fontWeight:600}}>{q.q}</p>

          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
            {q.o.map((opt,i)=>{
              let bg="#f8fdfb",brd="1.5px solid #d4eddf",col="#1a3a28";
              if(sel!==null){
                if(i===q.c){bg="#dcfce7";brd="2px solid #16a34a";col="#14532d";}
                else if(i===sel){bg="#fee2e2";brd="2px solid #dc2626";col="#7f1d1d";}
              }
              return(
                <button key={i} onClick={()=>pick(i)}
                  style={{display:"flex",alignItems:"center",gap:11,background:bg,border:brd,borderRadius:10,padding:"10px 14px",color:col,fontSize:14,cursor:sel===null?"pointer":"default",textAlign:"left",transition:"all .15s"}}>
                  <span style={{width:26,height:26,borderRadius:"50%",
                    background:sel===null?module.dim:(i===q.c?"#bbf7d0":i===sel?"#fecaca":"#f1f5f9"),
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,
                    color:sel===null?module.color:(i===q.c?"#15803d":i===sel?"#dc2626":"#64748b")}}>
                    {LETTERS[i]}
                  </span>{opt}
                </button>
              );
            })}
          </div>
          {showExp && (
            <div style={{background:sel===q.c?"#dcfce7":"#fef9c3",border:`1.5px solid ${sel===q.c?"#86efac":"#fde047"}`,borderRadius:10,padding:"11px 14px",marginBottom:12,fontSize:13,color:"#1a3a10",lineHeight:1.65}}>
              <strong style={{display:"block",marginBottom:3,fontSize:14}}>{sel===q.c?"✅ Corect!":"❌ Incorect."}</strong>{q.e}
            </div>
          )}
          {sel!==null && (
            <button style={{...S.btnG,background:`linear-gradient(135deg,${module.color},${module.color}cc)`}} onClick={next}>
              {cur+1<qs.length?"Următoarea →":"Finalizează ✓"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// ⑧ RESULT SCREEN
// ════════════════════════════════════════════════════════════
function ResultScreen({studentName, studentGroup, labId, module, entry, answers, qs, onRestart, onModules}) {
  // qs passed as prop from QuizScreen (already shuffled)
  const [showDisc,setShowDisc]=useState(false);
  const col=pctColor(entry.pct);
  const grade=entry.pct>=90?"Excelent 🏆":entry.pct>=70?"Bine 🎯":entry.pct>=50?"Suficient 📚":"Necesită studiu 💪";

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",padding:"20px 16px"}}>
      <div style={{maxWidth:680,margin:"0 auto"}}>
        <div style={{background:"#fff",border:`2px solid ${module.border}`,borderRadius:18,padding:"26px 22px",textAlign:"center",marginBottom:14,boxShadow:"0 4px 16px rgba(0,0,0,0.07)"}}>
          <span style={{color:module.color,fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:700}}>{module.icon} {module.title}</span>
          <h2 style={{color:col,fontSize:26,margin:"10px 0 4px"}}>{grade}</h2>
          <div style={{fontSize:52,fontWeight:900,color:"#0a2a18",lineHeight:1,margin:"10px 0 4px"}}>{entry.pct}%</div>
          <p style={{color:"#2a6a40",margin:"0 0 6px"}}>{entry.score}/{entry.total} corecte · {fmt(entry.timeUsed)}</p>
          <p style={{color:"#1a6a40",fontSize:12}}>👤 {studentName} · 🏫 {studentGroup}</p>
          <p style={{color:"#16a34a",fontSize:13,fontWeight:600,marginTop:8}}>✅ Rezultat salvat</p>
        </div>

        <div style={{background:"#fffbeb",border:"1.5px solid #fcd34d",borderRadius:14,padding:"14px 18px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <h3 style={{color:"#92400e",fontSize:15,margin:"0 0 3px"}}>🤝 Discuție în grupă</h3>
              <p style={{color:"#78350f",fontSize:13,margin:0}}>Compară răspunsurile și discutați greșelile.</p>
            </div>
            <button onClick={()=>setShowDisc(!showDisc)}
              style={{background:"#fef3c7",border:"1.5px solid #fcd34d",borderRadius:8,padding:"6px 14px",color:"#92400e",fontSize:13,cursor:"pointer",fontWeight:600}}>
              {showDisc?"Ascunde ▲":"Deschide ▼"}
            </button>
          </div>
          {showDisc&&(
            <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:8}}>
              {answers.map((a,i)=>{
                const q=qs[i]; const ok=a.sel===a.correct;
                return(
                  <div key={i} style={{background:ok?"#f0fdf4":"#fff7f7",border:`1.5px solid ${ok?"#86efac":"#fca5a5"}`,borderRadius:10,padding:"11px 14px"}}>
                    <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                      <span style={{flexShrink:0}}>{ok?"✅":"❌"}</span>
                      <div style={{flex:1}}>
                        <p style={{color:"#0a2a18",fontSize:13,margin:"0 0 5px",lineHeight:1.5}}><strong>Î{i+1}:</strong> {q.q}</p>
                        {!ok&&<div style={{display:"flex",gap:8,marginBottom:5,flexWrap:"wrap"}}>
                          <span style={{background:"#fee2e2",color:"#dc2626",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>Tău: {a.sel!==null?LETTERS[a.sel]:"–"}</span>
                          <span style={{background:"#dcfce7",color:"#16a34a",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>Corect: {LETTERS[a.correct]}</span>
                        </div>}
                        <p style={{color:"#1a4a28",fontSize:12,margin:0,lineHeight:1.5}}>💬 {q.e}</p>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div style={{display:"flex",gap:10}}>
          <button style={{...S.btnG,flex:1}} onClick={onModules}>← Alte module</button>
          <button style={{...S.btnW,flex:1}} onClick={onRestart}>🔄 Repetă</button>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// ⑩ MAIN APP ROUTER
// ════════════════════════════════════════════════════════════
function App() {
  const [screen,      setScreen]      = useState("home");
  const [session,     setSession]     = useState(null);
  const [student,     setStudent]     = useState(null);
  const [module,      setModule]      = useState(null);
  const [result,      setResult]      = useState(null);
  const [answers,     setAnswers]     = useState(null);
  const [quizQs,      setQuizQs]      = useState([]);
  const [teacherName, setTeacherName] = useState("");
  const [showDemo,    setShowDemo]    = useState(false);
  const [errMsg,      setErrMsg]      = useState("");
  const [pendingToken, setPendingToken] = useState(null);

  const handleJoinToken = token => {
    setPendingToken(token);
    setScreen("tokenJoin");
  };

  if (screen==="home")        return <HomePage onAdminLogin={()=>setScreen("adminLogin")} onJoinToken={handleJoinToken}/>;
  if (screen==="adminLogin")  return <AdminLogin onSuccess={(t)=>{setTeacherName(t);setScreen("admin");}} onBack={()=>setScreen("home")}/>;
  if (screen==="admin")       return <AdminPanel teacherName={teacherName} onBack={()=>setScreen("home")}/>;

  if (screen==="tokenJoin")   return (
    <TokenJoin token={pendingToken}
      onValid={s=>{setSession(s);setScreen("studentLogin");}}
      onInvalid={msg=>{setErrMsg(msg);setScreen("error");}}/>
  );
  if (screen==="error")       return <ErrorScreen message={errMsg} onBack={()=>{setScreen("home");window.history.pushState({},"",window.location.pathname);}}/>;
  if (screen==="studentLogin")return <StudentLogin session={session} onLogin={(n,g,sp)=>{setStudent({name:n,group:g,spec:sp||""});setScreen("labRouter");}}/>;

  // Lab router — route to correct lab based on session
  if (screen==="labRouter") {
    // Check fisa mode FIRST — before lab-specific routing
    if (session?.labCode?.endsWith("-FISA")) { setScreen("fisa_grup"); }
    else if (session?.labId==="lp1a") setScreen("lp1a_modules");
    else if (session?.labId==="lp1b") setScreen("lp1b_modules");
    else if (session?.labId==="lp2a") setScreen("lp2a_modules");
    else if (session?.labId==="lp2b") setScreen("lp2b_modules");
    else if (session?.labId==="lp3a") setScreen("lp3a_modules");
    else if (session?.labId==="lp3b") setScreen("lp3b_modules");
    else if (session?.labId==="lp6a") setScreen("lp6a_modules");
    else if (session?.labId==="lp6b") setScreen("lp6b_modules");
    else if (session?.labId==="lp4a") setScreen("lp4a_modules");
    else if (session?.labId==="lp4b") setScreen("lp4b_modules");
    else if (session?.labId==="lp5a") setScreen("lp5a_modules");
    else if (session?.labId==="lp5b") setScreen("lp5b_modules");
    else if (false) setScreen("never"); // placeholder
    else { setErrMsg(`Practica ${session?.labCode} nu are quiz activ inca.`); setScreen("error"); }
    return null;
  }

  if (screen==="lp1a_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp1a")}
      modules={LP1A_MODULES}
      questions={LP1A_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp1b_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp1b")}
      modules={LP1B_MODULES}
      questions={LP1B_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp2a_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp2a")}
      modules={LP2A_MODULES}
      questions={LP2A_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp2b_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp2b")}
      modules={LP2B_MODULES}
      questions={LP2B_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp3a_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp3a")}
      modules={LP3A_MODULES}
      questions={LP3A_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp6a_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp6a")}
      modules={LP6A_MODULES}
      questions={LP6A_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp6b_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp6b")}
      modules={LP6B_MODULES}
      questions={LP6B_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp5b_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp5b")}
      modules={LP5B_MODULES}
      questions={LP5B_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp5a_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp5a")}
      modules={LP5A_MODULES}
      questions={LP5A_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp4a_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp4a")}
      modules={LP4A_MODULES}
      questions={LP4A_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp3b_modules") return (
    <GenericModuleSelect
      lab={LABS.find(l=>l.id==="lp3b")}
      modules={LP3B_MODULES}
      questions={LP3B_QUESTIONS}
      studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (screen==="lp4b_modules") return (
    <LP4BModuleSelect studentName={student?.name}
      onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>
  );
  if (showDemo) return (
    <DemoScreen lab={LABS.find(l=>l.id===session?.labId)} onBack={()=>setShowDemo(false)}/>
  );
  // ── FIȘĂ GRUP SCREEN ──────────────────────────────────────
  if (screen==="fisa_grup") return (
    <FisaGrupScreen
      session={session}
      student={student}
      onBack={()=>setScreen("home")}
    />
  );

  if (screen==="quiz" && module) return (
    <QuizScreen studentName={student?.name} studentGroup={student?.group} studentSpec={student?.spec||""}
      labId={session?.labId} module={module} sessionTeacher={session?.teacher||""} sessionSemester={session?.semester||""}
      onFinish={(e,a,q)=>{setResult(e);setAnswers(a);setQuizQs(q);setScreen("result");}}/>
  );
  if (screen==="result" && result) return (
    <ResultScreen studentName={student?.name} studentGroup={student?.group}
      labId={session?.labId} module={module} entry={result} answers={answers} qs={quizQs||[]}
      onRestart={()=>{setResult(null);setAnswers(null);setScreen("quiz");}}
      onModules={()=>{setResult(null);setAnswers(null);setModule(null);setScreen((session?.labId||"lp4b")+"_modules");}}/>
  );
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
