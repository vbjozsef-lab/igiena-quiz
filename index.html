  );
}

// ════════════════════════════════════════════════════════════
// ③ ADMIN PANEL — QR generator + results
// ════════════════════════════════════════════════════════════
function AdminPanel({onBack, teacherName}) {
  const [tab, setTab]             = useState("qr"); // qr | results
  const [selectedResult, setSelectedResult] = useState(null); // fisa detail modal
  const [selLab, setSelLab]       = useState(LABS.find(l=>l.ready) || LABS[0]);
  const [duration, setDuration]   = useState(5);
  const [semSpec,   setSemSpec]   = useState("");
  const [semYear,   setSemYear]   = useState("");
  const [semMod,    setSemMod]    = useState("");
  const [nomenclator, setNomenclator] = useState(loadNomenclator());
  const semester = [semSpec, semYear, semMod].filter(Boolean).join(" · ");
  const [activeSession, setActiveSession] = useState(null);
  const [qrDataURL, setQrDataURL] = useState(null);
  const [timeLeft, setTimeLeft]   = useState(0);
  const [generating, setGenerating] = useState(false);
  const [fisaMode,   setFisaMode]   = useState(false);  // fisa grup mode
  const timerRef = useRef();

  // results state
  const [results, setResults]     = useState([]);
  const [labFilter,  setLabFilter]  = useState("all");
  const [grpFilter,  setGrpFilter]  = useState("all");
  const [semFilter,  setSemFilter]  = useState("all");
  const [specFilter, setSpecFilter] = useState("all");
  const [nameFilter, setNameFilter] = useState("");

  useEffect(() => {
    loadResults().then(r => setResults(r.sort((a,b)=>b.timestamp-a.timestamp)));
  }, [tab]);

  // countdown
  useEffect(() => {
    if (!activeSession) return;
    timerRef.current = setInterval(() => {
      const left = Math.max(0, Math.round((activeSession.expiresAt - Date.now()) / 1000));
      setTimeLeft(left);
      if (left <= 0) {
        clearInterval(timerRef.current);
        setActiveSession(null);
        setQrDataURL(null);
      }
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [activeSession]);

  const generateQR = async () => {
    setGenerating(true);
    try {
      const token = generateToken();
      const expiresAt = Date.now() + duration * 60 * 1000;
      const fisaCode = fisaMode ? selLab.code+"-FISA" : selLab.code;
      const session = { token, labId: selLab.id, labTitle: selLab.title, labCode: fisaCode, duration, expiresAt, createdAt: Date.now(), usedBy:[], teacher: teacherName, semester: semester.trim() };
      await addSession(session);
      const url = `${getBaseURL()}?token=${token}`;
      const dataURL = await generateQRDataURL(url);
      setQrDataURL(dataURL);
      setActiveSession(session);
      setTimeLeft(duration * 60);
    } catch(e) {
      console.error("generateQR error:", e);
      alert("Eroare la generarea QR: " + e.message);
    }
    setGenerating(false);
  };

  const cancelSession = () => {
    clearInterval(timerRef.current);
    setActiveSession(null);
    setQrDataURL(null);
    setTimeLeft(0);
  };

  const exportCSV = () => {
    const toExport = results.filter(r =>
      (labFilter==="all"||r.labId===labFilter) &&
      (grpFilter==="all"||r.group===grpFilter) &&
      (semFilter==="all"||r.semester===semFilter) &&
      (specFilter==="all"||r.specialization===specFilter) &&
      (!nameFilter||r.name.toLowerCase().includes(nameFilter.toLowerCase()))
    );
    const header = "Semestru,Specializare,Profesor,Nume,Grupă,Laborator,Modul,Scor,Procent,Timp,Data\n";
    const rows = toExport.map(r=>`"${r.semester||""}","${r.specialization||""}","${r.teacher||""}","${r.name}","${r.group||""}","${r.labCode||""}","${r.moduleTitle||""}",${r.score}/${r.total},${r.pct}%,${r.timeUsed}s,"${new Date(r.timestamp).toLocaleString("ro-RO")}"`).join("\n");
    const blob = new Blob(["\uFEFF"+header+rows],{type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`igiena_rezultate_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  };

  const pct = activeSession ? Math.round(timeLeft / (activeSession.duration * 60) * 100) : 0;
  const timerColor = timeLeft < 60 ? "#dc2626" : timeLeft < 120 ? "#ca8a04" : "#16a34a";

  const allGroups = [...new Set(results.map(r=>r.group).filter(Boolean))].sort();
  const allSemesters = [...new Set(results.map(r=>r.semester).filter(Boolean))].sort().reverse();
  const allSpecs = [...new Set(results.map(r=>r.specialization).filter(Boolean))].sort();
  const filteredResults = results
    .filter(r => labFilter==="all"||r.labId===labFilter)
    .filter(r => grpFilter==="all"||r.group===grpFilter)
    .filter(r => semFilter==="all"||r.semester===semFilter)
    .filter(r => specFilter==="all"||r.specialization===specFilter)
    .filter(r => !nameFilter||r.name.toLowerCase().includes(nameFilter.toLowerCase()));

  return (
    <div style={{minHeight:"100vh",background:"#F0F4FF",fontFamily:"'DM Sans','Segoe UI',system-ui,sans-serif",position:"relative"}}>

      {/* Soft blobs */}
      <div style={{position:"fixed",width:600,height:600,borderRadius:"50%",background:"radial-gradient(circle,rgba(99,102,241,0.07),transparent 70%)",top:-200,left:-200,pointerEvents:"none",zIndex:0}}/>
      <div style={{position:"fixed",width:400,height:400,borderRadius:"50%",background:"radial-gradient(circle,rgba(139,92,246,0.05),transparent 70%)",bottom:-100,right:-100,pointerEvents:"none",zIndex:0}}/>

      {/* TOP NAV */}
      <div style={{position:"sticky",top:0,zIndex:100,background:"rgba(240,244,255,0.9)",backdropFilter:"blur(20px)",borderBottom:"1px solid rgba(99,102,241,0.12)",padding:"0 24px"}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",gap:0,height:60}}>

          {/* Logo */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginRight:32}}>
            <div style={{width:34,height:34,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🧬</div>
            <span style={{fontSize:14,fontWeight:800,color:"#1e1b4b",letterSpacing:"-.01em"}}>Igienă</span>
            <span style={{fontSize:11,color:"#6366f1",fontWeight:600,marginLeft:2}}>· UMFST</span>
          </div>

          {/* Nav tabs */}
          <div className="admin-nav-tabs" style={{flex:1}}>
            {[
              {id:"qr",      icon:"📱", label:"Generează QR"},
              {id:"preview", icon:"👁️", label:"Previzualizare Quiz"},
              {id:"results", icon:"📊", label:"Rezultate"},
              {id:"prezentari",icon:"📽️",label:"Prezentări"},
              {id:"fisiere", icon:"📁", label:"Fișiere"},
              {id:"nomenclator",icon:"🗂️",label:"Nomenclator"},
            ].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{
                  display:"flex",alignItems:"center",gap:6,
                  padding:"6px 14px",borderRadius:8,border:"none",cursor:"pointer",
                  fontSize:13,fontWeight:tab===t.id?700:400,
                  background:tab===t.id?"#EEF2FF":"transparent",
                  color:tab===t.id?"#6366f1":"#64748b",
                  transition:"all .15s",
                  borderBottom:tab===t.id?"2px solid #6366f1":"2px solid transparent",
                }}>
                <span style={{fontSize:14}}>{t.icon}</span>
                <span style={{display:"none",display:"block"}}>{t.label}</span>
              </button>
            ))}
          </div>

          {/* User badge + logout */}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {teacherName && (
              <div style={{display:"flex",alignItems:"center",gap:8,background:"#EEF2FF",border:"1px solid #c7d2fe",borderRadius:20,padding:"6px 14px 6px 8px"}}>
                <div style={{width:26,height:26,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"white",fontWeight:700}}>
                  {teacherName.split(" ").map(w=>w[0]).join("").slice(0,2)}
                </div>
                <span style={{fontSize:13,color:"#6366f1",fontWeight:700}}>{teacherName.split(" ")[0]}</span>
              </div>
            )}
            <button onClick={onBack}
              style={{padding:"7px 14px",background:"#fff",border:"1px solid #e0e7ff",borderRadius:8,color:"#64748b",fontSize:13,cursor:"pointer",fontWeight:500}}>
              Ieși
            </button>
          </div>
        </div>
      </div>

      <div className="admin-content" style={{zIndex:1}}>

        {/* ── QR TAB ── */}
        {tab==="qr" && (
          <div className="qr-grid">
            {/* left: generator */}
            <div style={{background:"#fff",borderRadius:16,padding:24,border:"1px solid #e0e7ff",boxShadow:"0 4px 24px rgba(99,102,241,0.06)"}}>
              <h3 style={{color:"#1e1b4b",fontSize:16,margin:"0 0 20px",fontWeight:700}}>⚙️ Configurare sesiune</h3>

              <label style={S.label}>Selectează practica</label>
              <select style={{...S.input,marginBottom:16}}
                value={selLab.id} onChange={e=>setSelLab(LABS.find(l=>l.id===e.target.value))}>
                {LABS.map(l=>(
                  <option key={l.id} value={l.id}>{l.code} – {l.title}{!l.ready?" (în pregătire)":""}</option>
                ))}
              </select>

              <label style={S.label}>📅 Clasificare sesiune <span style={{fontWeight:400,color:"#6a9a80",fontSize:12}}>(opțional)</span></label>
              <select style={{...S.input, marginBottom:8}} value={semSpec} onChange={e=>setSemSpec(e.target.value)}>
                <option value="">— Specializare —</option>
                {nomenclator.specializations.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                <select style={{...S.input,flex:1}} value={semYear} onChange={e=>setSemYear(e.target.value)}>
                  <option value="">— An —</option>
                  {nomenclator.years.map(y=><option key={y} value={y}>{y}</option>)}
                </select>
                <select style={{...S.input,flex:1}} value={semMod} onChange={e=>setSemMod(e.target.value)}>
                  <option value="">— Modul —</option>
                  {nomenclator.modules.map(m=><option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              {semester && <div style={{background:"#EEF2FF",border:"1px solid #c7d2fe",borderRadius:8,padding:"6px 12px",marginBottom:16,fontSize:13,color:"#6366f1",fontWeight:600}}>📅 {semester}</div>}

              <label style={S.label}>Tip activitate</label>
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                {[{id:false,icon:"🎯",label:"Quiz interactiv"},{id:true,icon:"📋",label:"Fișă de grup"}].map(t=>(
                  <button key={String(t.id)} onClick={()=>setFisaMode(t.id)}
                    style={{flex:1,padding:"10px 8px",borderRadius:10,border:`1.5px solid ${fisaMode===t.id?"#a5b4fc":"#e0e7ff"}`,
                      background:fisaMode===t.id?"#EEF2FF":"#F8FAFF",color:fisaMode===t.id?"#6366f1":"#64748b",
                      fontSize:13,fontWeight:fisaMode===t.id?700:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    <span>{t.icon}</span><span>{t.label}</span>

              </div>
              {fisaMode && <div style={{background:"#FFFBEB",border:"1px solid #fde68a",borderRadius:9,padding:"8px 14px",marginBottom:16,fontSize:12,color:"#92400e"}}>
                📋 Studenții vor alege grupa și completa fișa interactivă cu evaluare AI.<br/>
                Rezultatele apar în tab-ul <strong>📊 Rezultate</strong>.
              </div>}

              <label style={S.label}>Durată valabilitate QR</label>
              <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
                {QR_DURATIONS.map(d=>(
                  <button key={d.value} onClick={()=>setDuration(d.value)}
                    style={{flex:1,minWidth:70,padding:"8px 4px",borderRadius:8,border:`1.5px solid ${duration===d.value?"#a5b4fc":"#e0e7ff"}`,
                      background:duration===d.value?"#EEF2FF":"#F8FAFF",color:duration===d.value?"#6366f1":"#64748b",
                      fontSize:12,fontWeight:duration===d.value?700:400,cursor:"pointer"}}>
                    {d.label}
                  </button>
                ))}
              </div>

              {/* selected lab preview */}
              <div style={{background:"#F8FAFF",border:"1.5px solid #e0e7ff",borderRadius:10,padding:"12px 14px",marginBottom:20}}>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <span style={{fontSize:28}}>{selLab.icon}</span>
                  <div>
                    <p style={{color:"#6366f1",fontSize:11,fontWeight:700,textTransform:"uppercase",margin:"0 0 2px"}}>{selLab.code}</p>
                    <p style={{color:"#1e1b4b",fontSize:14,margin:0,fontWeight:600}}>{selLab.title}</p>
                    {!selLab.ready && <p style={{color:"#dc2626",fontSize:11,margin:"2px 0 0"}}>⚠️ Practica nu are quiz activ</p>}
                  </div>
                </div>
              </div>

              {activeSession ? (
                <button style={{...S.btnW,color:"#dc2626",borderColor:"#fca5a5"}} onClick={cancelSession}>
                  ✕ Anulează sesiunea curentă
                </button>
              ) : (
                <button style={S.btnG} onClick={generateQR} disabled={generating}>
                  {generating ? <span className="spin">⏳</span> : "📱 Generează cod QR"}
                </button>
              )}
            </div>

            {/* right: QR display */}
            <div style={{background:"#fff",borderRadius:16,padding:24,border:"1px solid #e0e7ff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 24px rgba(99,102,241,0.06)"}}>
              {!activeSession ? (
                <div style={{textAlign:"center",color:"#94a3b8"}}>
                  <div style={{fontSize:80,marginBottom:16,opacity:.2}}>📱</div>
                  <p style={{fontSize:14,color:"#94a3b8"}}>Configurează sesiunea și<br/>apasă „Generează cod QR"</p>
                </div>
              ) : (
                <>
                  {/* countdown ring */}
                  <div style={{position:"relative",width:220,height:220,marginBottom:16}}>
                    <svg style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}} width="220" height="220">
                      <circle cx="110" cy="110" r="105" fill="none" stroke="#f0f9f4" strokeWidth="8"/>
                      <circle cx="110" cy="110" r="105" fill="none" stroke={timerColor} strokeWidth="8"
                        strokeDasharray={`${2*Math.PI*105}`}
                        strokeDashoffset={`${2*Math.PI*105*(1-pct/100)}`}
                        style={{transition:"stroke-dashoffset 1s linear, stroke .5s"}}/>
                    </svg>
                    <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center"}}>
                      {qrDataURL
                        ? <img src={qrDataURL} alt="QR" style={{width:180,height:180,borderRadius:8}}/>
                        : <div style={{width:180,height:180,background:"#f0f9f4",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
                            <span className="spin" style={{fontSize:24}}>⏳</span>
                          </div>
                      }
                    </div>
                  </div>

                  {/* timer */}
                  <div style={{textAlign:"center",marginBottom:16}}>
                    <div style={{fontFamily:"monospace",fontSize:32,fontWeight:800,color:timerColor,letterSpacing:".05em"}}>{fmt(timeLeft)}</div>
                    <p style={{color:"#94a3b8",fontSize:12,margin:"4px 0 0"}}>timp rămas</p>
                  </div>

                  {/* session info */}
                  <div style={{background:"#F8FAFF",border:"1px solid #e0e7ff",borderRadius:10,padding:"10px 16px",width:"100%",marginBottom:12}}>

                      💾 Descarcă imaginea QR
                    </a>
                  )}

                {label:"Studenți unici",  value:[...new Set(results.map(r=>r.name))].length,icon:"👥",color:"#3b82f6"},
                {label:"Medie generală",  value:results.length?`${Math.round(results.reduce((s,r)=>s+r.pct,0)/results.length)}%`:"–",icon:"📈",color:"#f59e0b"},

                  </thead>

                                </button>

                            </td>

                          <td style={{padding:"9px 12px",color:"#6366f1",fontWeight:700}}>{r.score}/{r.total}</td>
                          <td style={{padding:"9px 12px"}}>

              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {(LAB_DEMOS[selLab.id]||[]).map((d,i)=>(
                  <a key={i} href={d.url} target="_blank" rel="noreferrer"
                    style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",
                      background:"linear-gradient(135deg,#EEF2FF,#F5F3FF)",
                      border:"1.5px solid #c7d2fe",borderRadius:12,
                      textDecoration:"none",color:"#6366f1",fontSize:14,fontWeight:600}}>
                    <span style={{fontSize:22}}>{d.icon||"📄"}</span>
                    <span style={{flex:1}}>{d.title}</span>
                    <span style={{fontSize:12,opacity:0.6,background:"#dcfce7",padding:"3px 10px",borderRadius:6}}>↗ Deschide</span>
                  </a>
                ))}
              </div>
            )}
          </div>
        )}

        {tab==="fisiere" && (
          <FileManager teacherName={teacherName} selLab={selLab} />
        )}


        {tab==="nomenclator" && (
          <NomenclatorEditor nomenclator={nomenclator} onChange={n=>{setNomenclator(n);saveNomenclator(n);}} />
        )}
        {selectedResult && (()=>{
        const parts=(selectedResult.moduleTitle||"").split("\n---\n");
        const title=parts[0];
        const answersRaw=parts[1]||"";
        const qaBlocks=answersRaw.split("\n\nQ").filter(Boolean).map((b,i)=>i===0?b:"Q"+b);
        return (
          <div onClick={e=>{if(e.target===e.currentTarget)setSelectedResult(null);}}
            style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(30,27,75,0.4)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 16px",overflowY:"auto"}}>
            <div style={{background:"#fff",borderRadius:16,padding:"24px 22px",maxWidth:680,width:"100%",boxShadow:"0 20px 60px rgba(99,102,241,.15)",marginTop:20,marginBottom:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:"#16a34a",textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>Fișă completată</div>
                  <div style={{fontSize:17,fontWeight:700,color:"#0a2a18",marginBottom:4}}>{selectedResult.name}</div>
                  <div style={{fontSize:13,color:"#4a9a6a"}}>Grupa {selectedResult.group} · {selectedResult.labCode} · {title}</div>
                </div>
                <button onClick={()=>setSelectedResult(null)}
                  style={{padding:"6px 14px",background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,cursor:"pointer",fontWeight:700,color:"#64748b",flexShrink:0,marginLeft:12}}>
                  ✕
                </button>
              </div>
              <div style={{background:"#f0fdf4",border:"1.5px solid #86efac",borderRadius:10,padding:"10px 16px",marginBottom:18,display:"flex",alignItems:"center",gap:16}}>
                <div style={{fontSize:28,fontWeight:800,color:selectedResult.pct>=80?"#16a34a":selectedResult.pct>=60?"#d97706":"#dc2626"}}>{selectedResult.pct}%</div>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:"#0a2a18"}}>Scor AI: {selectedResult.score}/{selectedResult.total} puncte</div>
                  <div style={{fontSize:12,color:"#4a9a6a"}}>{selectedResult.pct>=80?"Excelent":selectedResult.pct>=60?"Bun":"Necesită îmbunătățiri"}</div>
                </div>
              </div>
              {qaBlocks.length>0 ? qaBlocks.map((block,i)=>{
                const nl=block.indexOf("\nA: ");
                if(nl===-1) return null;
                const question=block.slice(block.indexOf(": ")+2,nl);
                const answer=block.slice(nl+4)||"(fara raspuns)";
                const isEmpty=answer.trim()==="(fara raspuns)"||answer.trim()==="";
                return (
                  <div key={i} style={{marginBottom:10,borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0"}}>
                    <div style={{background:"#f8fafc",padding:"9px 14px",fontSize:13,fontWeight:600,color:"#0a2a18",borderBottom:"1px solid #e2e8f0"}}>
                      <span style={{color:"#16a34a",marginRight:6}}>Intrebarea {i+1}.</span>{question}
                    </div>
                    <div style={{padding:"9px 14px",fontSize:13,color:isEmpty?"#94a3b8":"#1e293b",fontStyle:isEmpty?"italic":"normal",lineHeight:1.6,background:isEmpty?"#fafafa":"#fff"}}>
                      {answer}
                    </div>
                  </div>
                );
              }) : (
                <div style={{color:"#94a3b8",fontSize:13,textAlign:"center",padding:20}}>Nu exista raspunsuri stocate pentru aceasta intrare.</div>
              )}
            </div>
          </div>
        );
      })()}
      </div>
    </div>
  );
}

// NOMENCLATOR EDITOR
// ════════════════════════════════════════════════════════════
function NomenclatorEditor({nomenclator, onChange}) {
  const [newSpec, setNewSpec] = useState("");
  const [newYear, setNewYear] = useState("");
  const [newMod,  setNewMod]  = useState("");

  const addItem = (key, val, reset) => {
    const v = val.trim();
    if (!v) return;
    if (nomenclator[key].includes(v)) return;
    onChange({...nomenclator, [key]: [...nomenclator[key], v]});
    reset("");
  };
  const removeItem = (key, val) => {
    onChange({...nomenclator, [key]: nomenclator[key].filter(x=>x!==val)});
  };
  const reset = () => { onChange(DEFAULT_NOMENCLATOR); saveNomenclator(DEFAULT_NOMENCLATOR); };

  const Section = ({title, icon, itemKey, items, newVal, setNewVal, placeholder}) => (
    <div style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:14,padding:20,marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:14,color:"#1a3a28",marginBottom:12}}>{icon} {title}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
        {items.map(item=>(
          <span key={item} style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:20,padding:"4px 10px",fontSize:12,color:"#166534",display:"flex",alignItems:"center",gap:6}}>
            {item}
            <button onClick={()=>removeItem(itemKey,item)} style={{background:"none",border:"none",cursor:"pointer",color:"#dc2626",fontSize:14,lineHeight:1,padding:0}}>×</button>
          </span>
        ))}
        {items.length===0 && <span style={{color:"#94a3b8",fontSize:12}}>Nicio valoare adăugată</span>}
      </div>
      <div style={{display:"flex",gap:8}}>
        <input value={newVal} onChange={e=>setNewVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem(itemKey,newVal,setNewVal)}
          style={{flex:1,padding:"8px 12px",border:"1.5px solid #b2ddc8",borderRadius:9,fontSize:13}} placeholder={placeholder}/>
        <button onClick={()=>addItem(itemKey,newVal,setNewVal)} style={{padding:"8px 14px",background:"#10b981",color:"#fff",border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer"}}>+</button>
      </div>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <h3 style={{color:"#0a2a18",fontSize:17,margin:"0 0 4px"}}>🗂️ Nomenclator Clasificare</h3>
          <p style={{color:"#4a9a6a",fontSize:13,margin:0}}>Valorile apar în dropdown-urile de clasificare la generarea sesiunii QR.</p>
        </div>
        <button onClick={reset} style={{padding:"8px 14px",background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer"}}>↺ Reset</button>
      </div>
      <Section title="Specializări" icon="🎓" itemKey="specializations" items={nomenclator.specializations} newVal={newSpec} setNewVal={setNewSpec} placeholder="ex: Medicină Generală"/>
      <Section title="Ani de studiu" icon="📅" itemKey="years" items={nomenclator.years} newVal={newYear} setNewVal={setNewYear} placeholder="ex: Anul I"/>
      <Section title="Module" icon="📚" itemKey="modules" items={nomenclator.modules} newVal={newMod} setNewVal={setNewMod} placeholder="ex: Semestrul 1"/>
    </div>
  );
}

// FIȘĂ GRUP SCREEN

function FisaGrupScreen({session, student, onBack}) {

  const [selectedFisa, setSelectedFisa] = useState(null);
  const [answers, setAnswers] = useState({});
  const [concluzii, setConcluzii] = useState({});
  // phases: select | case | questions | evaluating | done
  const [phase, setPhase] = useState("select");
  const [evalResults, setEvalResults] = useState(null);

  // ── GRUP SELECT ──────────────────────────────────────────
  if (phase === "select") return (
    <div style={FS.page}>
      <div style={FS.hdr}>
        <span style={{fontSize:24}}>📋</span>

          <div style={{fontWeight:700,fontSize:16}}>Fișe de Lucru — {session?.labCode?.replace("-FISA","")}</div>
          <div style={{fontSize:12,color:"#90b4d8"}}>{student?.name} · Grupa {student?.group}</div>
        </div>
      </div>
      <div style={{maxWidth:600,margin:"24px auto",padding:"0 16px"}}>
        <div style={{background:"#fef9c3",border:"1.5px solid #fde68a",borderRadius:10,padding:"14px 18px",marginBottom:20,fontSize:14,color:"#92400e",lineHeight:1.7}}>
          <strong>📌 Instrucțiune generală:</strong> Fiecare grupă primește un caz clinic/situațional. Citiți cu atenție cazul prezentat, analizați-l împreună, apoi răspundeți la întrebările aferente. La final, prezentați concluziile în <strong>maximum 2 minute</strong>.
        </div>
        <h3 style={{color:"#0d2040",fontSize:16,margin:"0 0 14px",fontWeight:700}}>Selectați fișa grupei voastre:</h3>
        <div className="fisa-grid-3" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {allFise.map((f,i) => (
            <button key={f.id} onClick={()=>{setSelectedFisa(f);setPhase("case");}}
              style={{padding:"14px 8px",borderRadius:12,border:"2px solid "+f.color+"44",background:f.color+"18",
                cursor:"pointer",textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <span style={{fontSize:26}}>{f.emoji}</span>
              <span style={{fontSize:12,fontWeight:700,color:f.color}}>Grupa {i+1}</span>
              <span style={{fontSize:10,color:"#64748b",lineHeight:1.3}}>{f.title.split(" — ")[0]}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  const f = selectedFisa;

  // ── CASE PRESENTATION ────────────────────────────────────
  if (phase === "case") return (
    <div style={FS.page}>
      <div style={FS.hdr}>
        <span style={{fontSize:22}}>{f.emoji}</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:15}}>Grupa {allFise.indexOf(f)+1} — {f.title}</div>
          <div style={{fontSize:11,color:"#90b4d8"}}>{student?.name} · Citiți cazul cu atenție</div>
        </div>
        <button onClick={()=>setPhase("select")} style={{padding:"6px 12px",background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.3)",borderRadius:8,color:"white",fontSize:12,cursor:"pointer"}}>← Înapoi</button>
      </div>
      <div style={{maxWidth:680,margin:"0 auto",padding:"20px 16px 40px"}}>

        {/* CAZUL — mare, proeminent */}
        <div style={{background:"white",borderRadius:16,border:"2px solid "+f.color,boxShadow:"0 4px 24px rgba(0,0,0,.1)",overflow:"hidden",marginBottom:24}}>
          <div style={{background:f.color,padding:"14px 20px",display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:28}}>{f.emoji}</span>
            <div>
              <div style={{fontSize:11,color:"rgba(255,255,255,.8)",textTransform:"uppercase",letterSpacing:".08em",fontWeight:700}}>Caz prezentat — Grupa {allFise.indexOf(f)+1}</div>
              <div style={{fontSize:17,fontWeight:800,color:"white"}}>{f.title}</div>
            </div>
          </div>
          <div style={{padding:"20px 24px"}}>
            <div style={{fontSize:12,fontWeight:700,color:f.color,textTransform:"uppercase",letterSpacing:".07em",marginBottom:12}}>📁 Situația</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {f.caz.map((item,i) => (
                item.v ? (
                  <div key={i} style={{display:"flex",gap:12,padding:"8px 12px",background:i%2===0?"#f8fafc":"white",borderRadius:8,alignItems:"baseline"}}>
                    <span style={{fontSize:13,color:"#64748b",minWidth:160,flexShrink:0,fontWeight:500}}>{item.l}</span>

          </div>
        </div>

        {/* Sarcina comună */}
        <div style={{background:"#eff6ff",border:"1.5px solid #bfdbfe",borderRadius:12,padding:"16px 20px",marginBottom:24}}>
          <div style={{fontSize:12,fontWeight:700,color:"#1e40af",textTransform:"uppercase",letterSpacing:".07em",marginBottom:8}}>📌 Sarcina grupei</div>

            <li>Formulați 3 măsuri concrete de corecție sau prevenire</li>

        </div>

        {/* Preview întrebări */}
        <div style={{background:"#f0fdf4",border:"1.5px solid #bbf7d0",borderRadius:12,padding:"16px 20px",marginBottom:28}}>
          <div style={{fontSize:12,fontWeight:700,color:"#16a34a",textTransform:"uppercase",letterSpacing:".07em",marginBottom:10}}>📝 Întrebările aferente cazului ({f.qs.length} întrebări)</div>

                  placeholder="Concluzie scurtă…"
                  value={concluzii[i]||""}
                  onChange={e=>{const nc={...concluzii};nc[i]=e.target.value;setConcluzii(nc);}}

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"white",borderTop:"1.5px solid #e2e8f0",padding:"10px 16px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 -4px 20px rgba(0,0,0,.08)"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:700,color:answered>=f.qs.length?"#16a34a":f.color}}>{answered} / {f.qs.length} răspunsuri</div>
          <div style={{fontSize:11,color:"#94a3b8"}}>{answered>=f.qs.length?"Toate completate!":"completate"}</div>
        </div>
        <button onClick={()=>{
            if(answered<1){alert("Completați cel puțin o întrebare înainte de a trimite!");return;}
            submitFisaGrup(f,answers,concluzii,student,session,setPhase,setEvalResults);
          }}
          style={{padding:"12px 24px",background:answered>=1?"linear-gradient(135deg,#10b981,#059669)":"#e2e8f0",
            color:answered>=1?"white":"#94a3b8",border:"none",borderRadius:11,fontSize:15,fontWeight:700,cursor:"pointer",transition:"all .2s"}}>
          ✉️ Trimite răspunsurile
        </button>
      </div>
    </div>
  );

  // ── EVALUATING ───────────────────────────────────────────
  if (phase === "evaluating") return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#f0f4f8,#e8f0f8)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{...FS.card,maxWidth:440,textAlign:"center",padding:"40px 28px"}}>
        <div style={{width:60,height:60,border:"5px solid #e2e8f0",borderTopColor:"#2E86DE",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 20px"}}/>
        <h2 style={{color:"#0d2040",fontSize:20,margin:"0 0 8px"}}>Se evaluează răspunsurile…</h2>
        <p style={{color:"#64748b",fontSize:14,lineHeight:1.7}}>Claude AI analizează fiecare răspuns în raport cu cunoștințele de igienă.</p>
      </div>
    </div>
  );

  // ── DONE ─────────────────────────────────────────────────
  if (phase === "done" && evalResults) {
    const {evaluations,totalScore,maxScore,pct} = evalResults;
    const sc = pct>=80?"#16a34a":pct>=60?"#d97706":"#dc2626";
    return (
      <div style={FS.page}>
        <div style={FS.hdr}>
          <span style={{fontSize:22}}>✅</span>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>Rezultate — {f.title.split(" — ")[0]}</div>
            <div style={{fontSize:11,color:"#90b4d8"}}>{student?.name} · Trimis profesorului</div>
          </div>
        </div>
        <div style={{maxWidth:620,margin:"20px auto",padding:"0 14px 40px"}}>
          <div style={{...FS.card,textAlign:"center",marginBottom:16,padding:"28px 20px"}}>
            <div style={{background:"#dcfce7",color:"#16a34a",fontSize:12,fontWeight:700,padding:"5px 14px",borderRadius:20,display:"inline-block",marginBottom:14}}>✅ Răspunsuri trimise profesorului</div>
            <div style={{width:100,height:100,borderRadius:"50%",border:"6px solid "+sc,margin:"0 auto 14px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:30,fontWeight:800,color:sc,lineHeight:1}}>{totalScore}</span>
              <span style={{fontSize:12,color:sc,opacity:.7}}>/{maxScore}</span>
            </div>
            <h3 style={{color:"#0d2040",margin:"0 0 4px"}}>{pct>=80?"Excelent! 🎉":pct>=60?"Bun! 👍":"Necesită îmbunătățiri"}</h3>
            <p style={{color:"#64748b",fontSize:13}}>{student?.name} · Grupa {student?.group} · {f.title}</p>
          </div>

          {/* Case recap in results */}
          <div style={{background:"white",borderRadius:12,border:"1.5px solid "+f.color+"44",padding:"14px 18px",marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:f.color,marginBottom:8}}>📋 Cazul analizat</div>
            <div style={{fontSize:13,color:"#475569"}}>{f.caz.filter(i=>i.v).map(i=>i.l+": "+i.v).join(" · ")}</div>
          </div>

          {f.qs.map((q,i)=>{
            const ev=evaluations[i]||{score:0,feedback:"Fără evaluare"};
            const cc=ev.score===2?"#16a34a":ev.score===1?"#d97706":"#dc2626";
            return (
              <div key={i} style={{...FS.card,marginBottom:10,borderLeft:"4px solid "+cc}}>
                <div style={{fontSize:11,fontWeight:700,color:cc,textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>Întrebarea {i+1}</div>
                <div style={{fontSize:13,fontWeight:600,color:"#0d2040",marginBottom:6}}>{q.q}</div>
                <div style={{fontSize:13,color:"#475569",background:"#f8fafc",borderRadius:7,padding:"7px 10px",marginBottom:7,borderLeft:"3px solid #e2e8f0"}}>{answers[i]||"(fără răspuns)"}</div>
                <div style={{fontSize:13,background:ev.score===2?"#f0fdf4":ev.score===1?"#fffbeb":"#fef2f2",borderLeft:"3px solid "+cc,padding:"8px 10px",borderRadius:7,lineHeight:1.6}}>
                  🤖 <strong>Evaluare AI:</strong> {ev.feedback}
                </div>
                <span style={{background:ev.score===2?"#dcfce7":ev.score===1?"#fef9c3":"#fee2e2",color:cc,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,display:"inline-block",marginTop:6}}>
                  {ev.score===2?"✅ 2/2":ev.score===1?"⚠️ 1/2":"❌ 0/2"} puncte
                </span>
              </div>
            );
          })}
          <div style={{background:"#eff6ff",borderRadius:12,padding:"12px 16px",marginTop:8,fontSize:13,color:"#1e40af"}}>
            <strong>⏱️ Urmează:</strong> Prezentați cazul și concluziile grupei în <strong>maximum 2 minute</strong>.
          </div>
          <button onClick={onBack} style={{width:"100%",padding:14,background:"#0d2040",color:"white",border:"none",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer",marginTop:14}}>
            🏠 Înapoi la pagina principală
          </button>
        </div>
      </div>
    );
  }
  return null;
}


async function submitFisaGrup(f,answers,concluzii,student,session,setPhase,setEvalResults) {
  setPhase("evaluating");
  const cazStr = f.caz.map(i=>i.l+": "+i.v).join(", ");
  const qStr = f.qs.map((q,i)=>"Intrebarea "+(i+1)+": "+q.q+"\nRaspuns: "+(answers[i]||"(fara raspuns)")).join("\n\n");
  const prompt = "Esti profesor de igiena. Evalueaza raspunsurile unui student la fisa \""+f.title+"\"."
    +"\nContext: "+cazStr+"\n\n"+qStr
    +"\n\nAcorda scor (0,1,2) si feedback scurt pentru fiecare din cele "+f.qs.length+" intrebari."
    +"\nCriterii: 2p=corect complet, 1p=partial, 0p=incorect."
    +'\nRaspunde NUMAI cu JSON: {"evaluations":[{"score":2,"feedback":"..."}]}'
    +"\nAray-ul trebuie sa contina EXACT "+f.qs.length+" obiecte.";
  let evaluations=[];
  try {
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const data=await res.json();
    const parsed=JSON.parse((data.content?.[0]?.text||"{}").replace(/```json|```/g,"").trim());
    evaluations=parsed.evaluations||[];
  } catch(e){
    evaluations=f.qs.map(()=>({score:1,feedback:"Raspuns inregistrat — evaluare manuala."}));
  }
  const totalScore=evaluations.reduce((s,e)=>s+(e.score||0),0);
  const maxScore=f.qs.length*2;
  const pct=Math.round(totalScore/maxScore*100);
  const answersText=f.qs.map((q,i)=>"Q"+(i+1)+": "+q.q+"\nA: "+(answers[i]||"(fara raspuns)")).join("\n\n");
  const SB="https://hgknirjorjvlofhngvcp.supabase.co";
  const SK="sb_publishable_PnUOkG2Tpw3wKa9hTZc3Yw_T0bnhFAO";
  try {
    await fetch(SB+"/rest/v1/results",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SK,"Authorization":"Bearer "+SK,"Prefer":"return=minimal"},
      body:JSON.stringify({
        session_id:session?.token||null,name:student?.name,grp:student?.group,
        lab_id:session?.labId,lab_code:session?.labCode,
        module:"fisa_"+f.id,
        module_title:"Fisa Grupa: "+f.title+"\n---\n"+answersText,
        score:totalScore,total:maxScore,pct,time_used:0,
        teacher:session?.teacher||"",semester:session?.semester||"",
        specialization:student?.spec||""
      })
    });
  } catch(e){console.error("save error",e);}
  setEvalResults({evaluations,totalScore,maxScore,pct});
  setPhase("done");
}

// QUIZ PREVIEW TAB — teacher sees all questions per lab/module
// ════════════════════════════════════════════════════════════
function QuizPreviewTab({selLab, onSelectLab}) {
  const LAB_Q_MAP = {
    lp1a:{q:LP1A_QUESTIONS,m:LP1A_MODULES}, lp1b:{q:LP1B_QUESTIONS,m:LP1B_MODULES},
    lp2a:{q:LP2A_QUESTIONS,m:LP2A_MODULES}, lp2b:{q:LP2B_QUESTIONS,m:LP2B_MODULES},
    lp3a:{q:LP3A_QUESTIONS,m:LP3A_MODULES}, lp3b:{q:LP3B_QUESTIONS,m:LP3B_MODULES},
    lp4a:{q:LP4A_QUESTIONS,m:LP4A_MODULES}, lp4b:{q:LP4B_QUESTIONS,m:LP4B_MODULES},
    lp5a:{q:LP5A_QUESTIONS,m:LP5A_MODULES}, lp5b:{q:LP5B_QUESTIONS,m:LP5B_MODULES},
    lp6a:{q:LP6A_QUESTIONS,m:LP6A_MODULES}, lp6b:{q:LP6B_QUESTIONS,m:LP6B_MODULES},
  };

  const [selModId, setSelModId] = useState(null);
  const [search, setSearch] = useState("");
  const [subTab, setSubTab] = useState("preview"); // preview | edit | fise
  const [quizEdits, setQuizEdits] = useState(()=>loadQuizEdits());

  // Edit state
  const [editingQ, setEditingQ] = useState(null); // {idx, q, o:[...], c, e}
  const [newQDraft, setNewQDraft] = useState(null); // draft for new question
  const [expandedQ, setExpandedQ] = useState(null);
  const [saveMsg, setSaveMsg] = useState("");

  React.useEffect(()=>{ setSelModId(null); setExpandedQ(null); setSearch(""); setEditingQ(null); setNewQDraft(null); }, [selLab?.id]);

  const labData = LAB_Q_MAP[selLab?.id];
  const modules = labData?.m || [];
  const baseQuestions = labData?.q || {};
  const selMod = modules.find(m=>m.id===selModId);

  const edKey = selLab?.id + ":" + selModId;
  const hasEdits = selModId && !!quizEdits[edKey];
  const activeQs = selModId ? (quizEdits[edKey] || baseQuestions[selModId] || []) : [];
  const filteredQs = search.trim() ? activeQs.filter(q=>(q.q+(q.o||[]).join("")+(q.e||"")).toLowerCase().includes(search.toLowerCase())) : activeQs;

  const persist = (newEdits) => {
    setQuizEdits(newEdits);
    saveQuizEdits(newEdits);
    setSaveMsg("✓ Salvat");
    setTimeout(()=>setSaveMsg(""), 2000);
  };

  const resetModule = () => {
    if (!confirm("Resetați la întrebările originale?")) return;
    const ne = {...quizEdits};
    delete ne[edKey];
    persist(ne);
  };

  const saveEditQ = (idx, updated) => {
    const arr = [...activeQs];
    arr[idx] = updated;
    persist({...quizEdits, [edKey]: arr});
    setEditingQ(null);
  };

  const deleteQ = (idx) => {
    if (!confirm("Ștergeți această întrebare?")) return;
    const arr = activeQs.filter((_,i)=>i!==idx);
    persist({...quizEdits, [edKey]: arr});
    setExpandedQ(null);
  };

  const addNewQ = (q) => {
    const arr = [...activeQs, q];
    persist({...quizEdits, [edKey]: arr});
    setNewQDraft(null);
  };

  const moveQ = (idx, dir) => {
    const arr = [...activeQs];
    const target = idx + dir;
    if (target < 0 || target >= arr.length) return;
    [arr[idx], arr[target]] = [arr[target], arr[idx]];
    persist({...quizEdits, [edKey]: arr});
  };

  const totalQ = Object.values(baseQuestions).reduce((s,arr)=>s+arr.length,0);

  // ── EDIT FORM ──────────────────────────────────────────
  const EditForm = ({initial, onSave, onCancel, isNew}) => {
    const [q, setQ] = useState(initial?.q||"");
    const [opts, setOpts] = useState(initial?.o||["","","",""]);
    const [correct, setCorrect] = useState(initial?.c??0);
    const [expl, setExpl] = useState(initial?.e||"");
    const [scenario, setScenario] = useState(initial?.s||"");
    const valid = q.trim() && opts.filter(o=>o.trim()).length>=2;

    return (
      <div style={{background:"#F8FAFF",border:"2px solid #a5b4fc",borderRadius:14,padding:"20px 18px",marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:800,color:"#6366f1",textTransform:"uppercase",letterSpacing:".1em",marginBottom:14}}>
          {isNew ? "➕ Întrebare nouă" : "✏️ Editare întrebare"}
        </div>

        <label style={{fontSize:11,fontWeight:700,color:"#6366f1",textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:4}}>Întrebarea *</label>
        <textarea value={q} onChange={e=>setQ(e.target.value)} rows={2}
          style={{width:"100%",padding:"9px 12px",border:"1.5px solid #c7d2fe",borderRadius:9,fontSize:13,resize:"vertical",boxSizing:"border-box",marginBottom:10,outline:"none"}}
          placeholder="Scrieți întrebarea..."/>

        <label style={{fontSize:11,fontWeight:700,color:"#6366f1",textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:4}}>Scenariu/Date (opțional)</label>
        <input value={scenario} onChange={e=>setScenario(e.target.value)}
          style={{width:"100%",padding:"8px 12px",border:"1.5px solid #e0e7ff",borderRadius:9,fontSize:13,boxSizing:"border-box",marginBottom:10,outline:"none"}}
          placeholder="ex: Temperatura 24°C, UR 72%..."/>

        <label style={{fontSize:11,fontWeight:700,color:"#6366f1",textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:6}}>Variante de răspuns *</label>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
          {opts.map((opt,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
              <button onClick={()=>setCorrect(i)}
                style={{width:28,height:28,borderRadius:"50%",flexShrink:0,border:`2px solid ${correct===i?"#6366f1":"#e0e7ff"}`,
                  background:correct===i?"#6366f1":"#fff",color:correct===i?"#fff":"#94a3b8",
                  fontSize:11,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                {correct===i ? "✓" : String.fromCharCode(65+i)}
              </button>
              <input value={opt} onChange={e=>{const o=[...opts];o[i]=e.target.value;setOpts(o);}}
                style={{flex:1,padding:"8px 12px",border:`1.5px solid ${correct===i?"#a5b4fc":"#e0e7ff"}`,borderRadius:9,fontSize:13,outline:"none",background:correct===i?"#EEF2FF":"#fff"}}
                placeholder={`Varianta ${String.fromCharCode(65+i)}…`}/>
            </div>
          ))}
        </div>
        <div style={{fontSize:11,color:"#94a3b8",marginBottom:10}}>👆 Click pe cerculet = răspuns corect</div>

        <label style={{fontSize:11,fontWeight:700,color:"#6366f1",textTransform:"uppercase",letterSpacing:".08em",display:"block",marginBottom:4}}>Explicație (opțional)</label>
        <textarea value={expl} onChange={e=>setExpl(e.target.value)} rows={2}
          style={{width:"100%",padding:"9px 12px",border:"1.5px solid #e0e7ff",borderRadius:9,fontSize:13,resize:"vertical",boxSizing:"border-box",marginBottom:14,outline:"none"}}
          placeholder="Explicație afișată după răspuns..."/>

        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>onSave({q:q.trim(),o:opts.map(o=>o.trim()).filter(o=>o),c:correct,e:expl.trim(),s:scenario.trim()})} disabled={!valid}
            style={{flex:1,padding:"10px",background:valid?"linear-gradient(135deg,#6366f1,#8b5cf6)":"#e0e7ff",color:valid?"#fff":"#94a3b8",border:"none",borderRadius:9,fontWeight:700,fontSize:13,cursor:valid?"pointer":"not-allowed"}}>
            {isNew ? "➕ Adaugă întrebare" : "💾 Salvează modificările"}
          </button>
          <button onClick={onCancel}
            style={{padding:"10px 18px",background:"#fff",border:"1.5px solid #e0e7ff",borderRadius:9,color:"#64748b",fontSize:13,cursor:"pointer"}}>
            Anulează
          </button>
        </div>
      </div>
    );
  };

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <h3 style={{color:"#1e1b4b",fontSize:18,margin:"0 0 2px",fontWeight:800}}>👁️ Quiz — Previzualizare & Editare</h3>
          <p style={{color:"#64748b",fontSize:13,margin:0}}>Vizualizați, editați sau adăugați întrebări · Modificările se salvează local în browser</p>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {saveMsg && <span style={{fontSize:13,color:"#16a34a",fontWeight:700,background:"#f0fdf4",padding:"6px 12px",borderRadius:8,border:"1px solid #bbf7d0"}}>{saveMsg}</span>}
          <div style={{display:"flex",alignItems:"center",gap:8,background:"#EEF2FF",border:"1px solid #c7d2fe",borderRadius:20,padding:"6px 14px"}}>
            <span style={{fontSize:18}}>{selLab?.icon}</span>
            <span style={{fontSize:13,fontWeight:700,color:"#6366f1"}}>{selLab?.code}</span>
            <span style={{fontSize:12,color:"#94a3b8"}}>· {totalQ}Q total</span>
          </div>
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{display:"flex",gap:4,marginBottom:16,background:"#fff",padding:4,borderRadius:12,border:"1px solid #e0e7ff",width:"fit-content"}}>
        {[
          {id:"preview",label:"👁️ Previzualizare"},
          {id:"edit",   label:"✏️ Editor Quiz"},
          {id:"fise",   label:"📋 Fișe de Grup"},
        ].map(t=>(
          <button key={t.id} onClick={()=>setSubTab(t.id)}
            style={{padding:"8px 18px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,fontWeight:subTab===t.id?700:400,
              background:subTab===t.id?"#EEF2FF":"transparent",color:subTab===t.id?"#6366f1":"#64748b",transition:"all .15s"}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* Lab selector */}
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:16}}>
        {LABS.map(lab=>{
          const lq = LAB_Q_MAP[lab.id];
          const cnt = lq ? Object.values(lq.q).reduce((s,a)=>s+a.length,0) : 0;
          const active = selLab?.id===lab.id;
          const hasEd = Object.keys(quizEdits).some(k=>k.startsWith(lab.id+":"));
          return (

      </div>

      {subTab==="fise" && (
        <FisaPreviewPanel labId={selLab?.id}/>

      {/* ── PREVIEW + EDIT sub-tabs: two-column layout ── */}
      {(subTab==="preview"||subTab==="edit") && (

                      <div style={{fontSize:10,color:active?"#818cf8":"#94a3b8",marginTop:1,display:"flex",gap:4,alignItems:"center"}}>

          {/* Right panel */}
          <div>
            {!selModId ? (
              <div style={{background:"#fff",borderRadius:14,border:"1px solid #e0e7ff",padding:"50px 24px",textAlign:"center"}}>
                <div style={{fontSize:44,marginBottom:10,opacity:.25}}>👈</div>
                <p style={{color:"#94a3b8",fontSize:13}}>Selectați un modul din stânga</p>
              </div>
            ) : (
              <>
                {/* Module header */}
                <div style={{background:"#fff",borderRadius:14,border:"1px solid #e0e7ff",padding:"14px 18px",marginBottom:10,display:"flex",alignItems:"center",gap:10,boxShadow:"0 2px 8px rgba(99,102,241,0.05)"}}>
                  <span style={{fontSize:26}}>{selMod?.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:15,fontWeight:800,color:"#1e1b4b"}}>{selMod?.title}</div>
                    <div style={{fontSize:12,color:"#64748b"}}>{selMod?.sub} · {activeQs.length} întrebări · {selMod?.time} min</div>

                  {hasEdits && (
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>

                    </div>
                  )}
                </div>

                {/* Search */}
                <div style={{position:"relative",marginBottom:10}}>
                  <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Caută în întrebări…"
                    style={{width:"100%",padding:"9px 14px",borderRadius:10,border:"1.5px solid #e0e7ff",background:"#fff",fontSize:13,color:"#1e293b",boxSizing:"border-box",outline:"none"}}/>
                  {search && <button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:14}}>✕</button>}
                </div>

                {/* EDIT mode: new question button */}
                {subTab==="edit" && !newQDraft && (
                  <button onClick={()=>setNewQDraft({q:"",o:["","","",""],c:0,e:"",s:""})}
                    style={{width:"100%",padding:"11px",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:10,letterSpacing:".01em"}}>

                  <EditForm initial={newQDraft} isNew={true} onSave={addNewQ} onCancel={()=>setNewQDraft(null)}/>

                {filteredQs.length===0 && search && (

                  const isEditing = editingQ===i;

                  if (isEditing && subTab==="edit") return (
                    <EditForm key={i} initial={q} isNew={false}
                      onSave={(updated)=>saveEditQ(realIdx,updated)}
                      onCancel={()=>setEditingQ(null)}/>
                  );

                  return (
                    <div key={i} style={{background:"#fff",borderRadius:12,border:`1.5px solid ${open?"#a5b4fc":"#e0e7ff"}`,marginBottom:7,overflow:"hidden",boxShadow:open?"0 4px 16px rgba(99,102,241,0.1)":"0 1px 4px rgba(0,0,0,0.04)"}}>

                        </button>

                        {/* Edit actions */}
                        {subTab==="edit" && (
                          <div style={{display:"flex",flexDirection:"column",borderLeft:"1px solid #f1f5f9",padding:"6px 4px",gap:2,justifyContent:"center"}}>
                            <button onClick={()=>moveQ(realIdx,-1)} disabled={realIdx===0}

                              style={{padding:"3px 8px",background:"none",border:"none",cursor:realIdx===activeQs.length-1?"not-allowed":"pointer",color:realIdx===activeQs.length-1?"#e0e7ff":"#94a3b8",fontSize:13}} title="Jos">↓</button>

                              style={{padding:"3px 8px",background:"none",border:"none",cursor:"pointer",color:"#6366f1",fontSize:12,fontWeight:700}} title="Editează">✏️</button>
                            <button onClick={()=>deleteQ(realIdx)}
                              style={{padding:"3px 8px",background:"none",border:"none",cursor:"pointer",color:"#dc2626",fontSize:12}} title="Șterge">🗑️</button>
                          </div>
                        )}

                      {/* Expanded answers */}
                      {open && (
                        <div style={{padding:"0 14px 14px",borderTop:"1px solid #f1f5f9"}}>
                          <div style={{display:"flex",flexDirection:"column",gap:5,marginTop:10}}>
                            {(q.o||[]).map((opt,j)=>{
                              const correct=j===q.c;
                              return (
                                <div key={j} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 12px",borderRadius:9,
                                  background:correct?"#F0FDF4":"#F8FAFF",border:`1.5px solid ${correct?"#86efac":"#e0e7ff"}`}}>
                                  <div style={{width:22,height:22,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
                                    background:correct?"#16a34a":"#e0e7ff",fontSize:11,fontWeight:800,color:correct?"#fff":"#94a3b8"}}>
                                    {String.fromCharCode(65+j)}
                                  </div>
                                  <span style={{fontSize:13,color:correct?"#15803d":"#475569",fontWeight:correct?700:400}}>{opt}</span>
                                  {correct && <span style={{marginLeft:"auto",fontSize:11,color:"#16a34a",fontWeight:700,background:"#dcfce7",padding:"2px 8px",borderRadius:8}}>✓ Corect</span>}
                                </div>
                              );
                            })}
                          </div>
                          {q.e && <div style={{marginTop:8,padding:"9px 12px",background:"#EEF2FF",borderRadius:9,border:"1px solid #c7d2fe",fontSize:13,color:"#4338ca",lineHeight:1.6}}><strong>💡</strong> {q.e}</div>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// FILE MANAGER
// ════════════════════════════════════════════════════════════
function FileManager({teacherName, selLab}) {
  const [files, setFiles]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [uploading, setUploading] = React.useState(false);
  const [msg, setMsg]             = React.useState({type:"", text:""});
  const fileRef = React.useRef();

  const load = () => {
    setLoading(true);
    Promise.all([
      listFiles(teacherName, selLab.id),
      listAllFiles(selLab.id)
    ]).then(([own, all]) => {
      const ownPaths = new Set(own.map(f=>f.path));
      const merged = [
        ...own.map(f=>({...f, isOwn:true})),
        ...all.filter(f=>!ownPaths.has(f.path)).map(f=>({...f, isOwn:false}))
      ];
      setFiles(merged);
      setLoading(false);
    }).catch(()=>setLoading(false));
  };

  React.useEffect(()=>{load();},[selLab.id]);

  const upload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true); setMsg({type:"",text:""});
    try {
      await uploadFile(teacherName, selLab.id, file);
      setMsg({type:"ok", text:"Fișier încărcat cu succes!"});
      load();
    } catch(err) {
      setMsg({type:"err", text:"Eroare la încărcare: "+err.message});
    }
    setUploading(false);
  };

  const del = async (path) => {
    if (!confirm("Ștergeți acest fișier?")) return;
    try {
      await deleteFile(path);
      setMsg({type:"ok", text:"Fișier șters."});
      load();
    } catch(err) {
      setMsg({type:"err", text:"Eroare la ștergere."});
    }
  };

  const SB_STORAGE = "https://hgknirjorjvlofhngvcp.supabase.co/storage/v1";

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <h3 style={{color:"#0a2a18",fontSize:17,margin:"0 0 4px"}}>📁 Fișiere mele — {selLab.code}</h3>
          <p style={{color:"#4a9a6a",fontSize:13,margin:0}}>Încarcă PDF-uri, prezentări sau alte materiale pentru studenți.</p>
        </div>
        <div>
          <input ref={fileRef} type="file" style={{display:"none"}} onChange={upload}
            accept=".pdf,.pptx,.ppt,.docx,.doc,.xlsx,.xls,.png,.jpg,.jpeg,.gif,.zip"/>
          <button onClick={()=>fileRef.current.click()} disabled={uploading}
            style={{padding:"10px 18px",background:"linear-gradient(135deg,#10b981,#059669)",color:"white",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer"}}>
            {uploading?"⏳ Se încarcă…":"📤 Încarcă fișier"}
          </button>
        </div>
      </div>
      {msg.text && <div style={{padding:"10px 14px",borderRadius:9,marginBottom:14,fontSize:13,fontWeight:600,
        background:msg.type==="ok"?"#dcfce7":"#fee2e2",color:msg.type==="ok"?"#16a34a":"#dc2626"}}>
        {msg.type==="ok"?"✅":"❌"} {msg.text}
      </div>}
      {loading ? <div style={{textAlign:"center",padding:30,color:"#94a3b8"}}>Se încarcă fișierele…</div>
      : files.length===0 ? (
        <div style={{background:"#f0fdf4",border:"1.5px solid #b2ddc8",borderRadius:12,padding:24,textAlign:"center",color:"#4a9a6a"}}>
          <div style={{fontSize:32,marginBottom:8}}>📂</div>

// ════════════════════════════════════════════════════════════
// TOKEN JOIN
// ════════════════════════════════════════════════════════════
function TokenJoin({token, onValid, onInvalid}) {
  React.useEffect(()=>{
    if (!token) { onInvalid("Token lipsă."); return; }
    getSession(token).then(s=>{
      if (!s) { onInvalid("Cod QR invalid sau expirat."); return; }
      if (Date.now() > s.expiresAt) { onInvalid("Sesiunea a expirat. Cereți un cod nou de la profesor."); return; }
      onValid(s);
    }).catch(()=>onInvalid("Eroare de rețea. Verificați conexiunea."));
  },[]);
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:48,height:48,border:"5px solid #e2e8f0",borderTopColor:"#10b981",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/>
        <p style={{color:"#4a9a6a",fontSize:15}}>Se verifică codul QR…</p>
      </div>
    </div>
  );
}

// STUDENT LOGIN
// ════════════════════════════════════════════════════════════
function StudentLogin({session, onLogin}) {
  const [name, setName]   = useState("");
  const [group, setGroup] = useState("");
  const [spec, setSpec]   = useState("");
  const [err, setErr]     = useState("");
  const lab = LABS.find(l=>l.id===session.labId) || {};

  const go = () => {
    if (name.trim().length < 3) { setErr("Introduceți numele complet (min. 3 caractere)."); return; }
    if (!group) { setErr("Selectați grupa!"); return; }
    if (!spec) { setErr("Selectați specializarea!"); return; }
    markSessionUsed(session.token, name.trim());
    onLogin(name.trim(), group, spec);
  };

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(150deg,#F0F4FF,#F5F3FF)",padding:"24px 16px",display:"flex",alignItems:"center",justifyContent:"center"}}>

        <label style={S.label}>Specializare</label>

  );
}

// QUIZ SCREEN
// ════════════════════════════════════════════════════════════
function QuizScreen({studentName, studentGroup, studentSpec, labId, module, onFinish, sessionTeacher, sessionSemester}) {
  const _labQMap = {
    lp1a:LP1A_QUESTIONS, lp1b:LP1B_QUESTIONS,
    lp2a:LP2A_QUESTIONS, lp2b:LP2B_QUESTIONS,
    lp3a:LP3A_QUESTIONS, lp3b:LP3B_QUESTIONS,
    lp4a:LP4A_QUESTIONS, lp4b:LP4B_QUESTIONS,
    lp5a:LP5A_QUESTIONS, lp5b:LP5B_QUESTIONS,
    lp6a:LP6A_QUESTIONS, lp6b:LP6B_QUESTIONS,
  };
  const _allQs = applyQuizEdits(labId, module.id, (_labQMap[labId] || LP4B_QUESTIONS)[module.id] || []);
  const [qs]          = useState(() => shufflePick(_allQs, module.count || _allQs.length));
  const [cur, setCur] = useState(0);
  const [sel, setSel] = useState(null);
  const [ans, setAns] = useState([]);
  const [startT]      = useState(Date.now());
  const [showExp, setShowExp] = useState(false);
  const [confirmed, setConfirmed] = useState(false);

  const q = qs[cur];
  if (!q) return null;

  const confirm = () => {
    if (sel===null) return;
    setConfirmed(true);
    setShowExp(true);
  };

  const next = () => {
    const newAns = [...ans, {q:q.q, chosen:sel, correct:q.c, options:q.o, explanation:q.e||""}];
    if (cur+1 >= qs.length) {
      const score = newAns.filter(a=>a.chosen===a.correct).length;
      const pct = Math.round(score/qs.length*100);
      const timeUsed = Math.round((Date.now()-startT)/1000);
      const entry = {
        name:studentName, group:studentGroup, spec:studentSpec||"",
        labId, labCode:module.labCode||(LABS.find(l=>l.id===labId)||{}).code,
        module:module.id, moduleTitle:module.title,
        score, total:qs.length, pct, timeUsed,
        timestamp:Date.now(),
        teacher:sessionTeacher||"", semester:sessionSemester||"",
        specialization:studentSpec||""
      };
      addResult(entry).catch(()=>{});
      onFinish(entry, newAns, qs);
    } else {
      setAns(newAns);
      setCur(cur+1);
      setSel(null);
      setShowExp(false);
      setConfirmed(false);
    }
  };

  const pct = Math.round((cur)/qs.length*100);
  const pctColor = (p) => p>=80?"#16a34a":p>=60?"#ca8a04":"#dc2626";

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8f5ee,#f0f9f4)",padding:"16px"}}>
      <div style={{maxWidth:680,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,background:"#fff",borderRadius:14,padding:"12px 16px",border:"1.5px solid #b2ddc8"}}>
          <div style={{flex:1}}>
            <p style={{fontWeight:700,color:module.color,fontSize:13,margin:"0 0 2px"}}>{module.icon} {module.title}</p>
            <p style={{color:"#4a9a6a",fontSize:12,margin:0}}>{studentName} · Î{cur+1}/{qs.length}</p>
          </div>
          <div style={{textAlign:"right"}}>
            <p style={{fontWeight:800,color:pctColor(pct),fontSize:16,margin:"0 0 2px"}}>{cur}/{qs.length}</p>
            <p style={{color:"#94a3b8",fontSize:11,margin:0}}>răspunsuri</p>
          </div>
        </div>
        <div style={{height:6,background:"#e2e8f0",borderRadius:3,marginBottom:16,overflow:"hidden"}}>
          <div style={{height:"100%",background:"linear-gradient(90deg,"+module.color+",#10b981)",width:pct+"%",transition:"width .4s",borderRadius:3}}/>
        </div>
        {q.s && <div style={{background:"#fef9c3",border:"1px solid #fde68a",borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#92400e"}}>📊 {q.s}</div>}
        <div style={{background:"#fff",border:"1.5px solid #b2ddc8",borderRadius:16,padding:"20px",marginBottom:16,boxShadow:"0 2px 12px rgba(0,0,0,.06)"}}>
          <p style={{fontWeight:700,fontSize:16,color:"#0a2a18",lineHeight:1.5,margin:"0 0 16px"}}>{q.q}</p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {q.o.map((opt,i)=>{
              let bg="#f8fdfb", border="1.5px solid #b2ddc8", color="#0a2a18", fw=400;
              if (confirmed) {
                if (i===q.c) { bg="#dcfce7"; border="2px solid #16a34a"; color="#166534"; fw=700; }
                else if (i===sel && i!==q.c) { bg="#fee2e2"; border="2px solid #dc2626"; color="#991b1b"; }
              } else if (sel===i) { bg=module.dim; border="2px solid "+module.color; color=module.color; fw=700; }
              return (
                <button key={i} onClick={()=>{if(!confirmed){setSel(i);}}}
                  style={{padding:"12px 16px",borderRadius:10,border,background:bg,color,fontWeight:fw,fontSize:14,textAlign:"left",cursor:confirmed?"default":"pointer",transition:"all .15s"}}>
                  <span style={{opacity:.6,marginRight:8}}>{String.fromCharCode(65+i)}.</span>{opt}
                </button>
              );
            })}
          </div>
        </div>
        {showExp && q.e && (
          <div style={{background:"#eff6ff",border:"1.5px solid #bfdbfe",borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#1e40af",lineHeight:1.6}}>
            💡 {q.e}
          </div>
        )}
        {!confirmed
          ? <button style={{...S.btnG,opacity:sel===null?.4:1}} onClick={confirm} disabled={sel===null}>Confirmă răspunsul</button>
          : <button style={S.btnG} onClick={next}>{cur+1>=qs.length?"Finalizează testul →":"Următoarea întrebare →"}</button>
        }
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [screen,      setScreen]      = useState("home");
  const [session,     setSession]     = useState(null);
  const [student,     setStudent]     = useState(null);
  const [module,      setModule]      = useState(null);
  const [result,      setResult]      = useState(null);
  const [answers,     setAnswers]     = useState(null);
  const [quizQs,      setQuizQs]      = useState([]);
  const [teacherName, setTeacherName] = useState("");
  const [showDemo,    setShowDemo]    = useState(false);
  const [errMsg,      setErrMsg]      = useState("");
  const [pendingToken,setPendingToken]= useState(null);

  const handleJoinToken = token => { setPendingToken(token); setScreen("tokenJoin"); };

  if (screen==="home")        return <HomePage onAdminLogin={(t)=>{setTeacherName(t);setScreen("admin");}} onJoinToken={handleJoinToken}/>;
  if (screen==="adminLogin")  return <AdminLogin onSuccess={(t)=>{setTeacherName(t);setScreen("admin");}} onBack={()=>setScreen("home")}/>;
  if (screen==="admin")       return <AdminPanel teacherName={teacherName} onBack={()=>setScreen("home")}/>;
  if (screen==="tokenJoin")   return (
    <TokenJoin token={pendingToken}
      onValid={s=>{setSession(s);setScreen("studentLogin");}}
      onInvalid={msg=>{setErrMsg(msg);setScreen("error");}}/>
  );
  if (screen==="error")       return <ErrorScreen message={errMsg} onBack={()=>{setScreen("home");window.history.pushState({},"",window.location.pathname);}}/>;
  if (screen==="studentLogin")return <StudentLogin session={session} onLogin={(n,g,sp)=>{setStudent({name:n,group:g,spec:sp||""});setScreen("labRouter");}}/>;

  if (screen==="labRouter") {
    if (session?.labCode?.endsWith("-FISA")) { setScreen("fisa_grup"); }
    else if (session?.labId==="lp1a") setScreen("lp1a_modules");
    else if (session?.labId==="lp1b") setScreen("lp1b_modules");
    else if (session?.labId==="lp2a") setScreen("lp2a_modules");
    else if (session?.labId==="lp2b") setScreen("lp2b_modules");
    else if (session?.labId==="lp3a") setScreen("lp3a_modules");
    else if (session?.labId==="lp3b") setScreen("lp3b_modules");
    else if (session?.labId==="lp6a") setScreen("lp6a_modules");
    else if (session?.labId==="lp6b") setScreen("lp6b_modules");
    else if (session?.labId==="lp4a") setScreen("lp4a_modules");
    else if (session?.labId==="lp4b") setScreen("lp4b_modules");
    else if (session?.labId==="lp5a") setScreen("lp5a_modules");
    else if (session?.labId==="lp5b") setScreen("lp5b_modules");
    else { setErrMsg("Practica "+session?.labCode+" nu are quiz activ inca."); setScreen("error"); }
    return null;
  }

  if (screen==="fisa_grup") return (
    <FisaGrupScreen session={session} student={student} onBack={()=>setScreen("home")}/>
  );
  if (screen==="lp1a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp1a")} modules={LP1A_MODULES} questions={LP1A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp1b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp1b")} modules={LP1B_MODULES} questions={LP1B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp2a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp2a")} modules={LP2A_MODULES} questions={LP2A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp2b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp2b")} modules={LP2B_MODULES} questions={LP2B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp3a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp3a")} modules={LP3A_MODULES} questions={LP3A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp3b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp3b")} modules={LP3B_MODULES} questions={LP3B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp6a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp6a")} modules={LP6A_MODULES} questions={LP6A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp6b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp6b")} modules={LP6B_MODULES} questions={LP6B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp5b_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp5b")} modules={LP5B_MODULES} questions={LP5B_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp5a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp5a")} modules={LP5A_MODULES} questions={LP5A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp4a_modules") return <GenericModuleSelect lab={LABS.find(l=>l.id==="lp4a")} modules={LP4A_MODULES} questions={LP4A_QUESTIONS} studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (screen==="lp4b_modules") return <LP4BModuleSelect studentName={student?.name} onSelect={m=>{setModule(m);setScreen("quiz");}} onDemo={()=>setShowDemo(true)}/>;
  if (showDemo) return <DemoScreen lab={LABS.find(l=>l.id===session?.labId)} onBack={()=>setShowDemo(false)}/>;
  if (screen==="quiz" && module) return (
    <QuizScreen studentName={student?.name} studentGroup={student?.group} studentSpec={student?.spec||""}
      labId={session?.labId} module={module} sessionTeacher={session?.teacher||""} sessionSemester={session?.semester||""}
      onFinish={(e,a,q)=>{setResult(e);setAnswers(a);setQuizQs(q);setScreen("result");}}/>
  );
  if (screen==="result" && result) return (
    <ResultScreen studentName={student?.name} studentGroup={student?.group}
      labId={session?.labId} module={module} entry={result} answers={answers} qs={quizQs||[]}
      onRestart={()=>{setResult(null);setAnswers(null);setScreen("quiz");}}
      onModules={()=>{setResult(null);setAnswers(null);setModule(null);setScreen((session?.labId||"lp4b")+"_modules");}}/>
  );
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
